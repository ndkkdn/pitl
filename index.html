                        <button class="wf-tab-btn" id="btn-wf-c" onclick="switchWireframe('C')">${t("Type C (실험적/미래형 안)", "Type C (Experimental/Futuristic Option)")}</button>
                    </div>

                    <div id="wireframe-render-target">
                        <!-- Type details inject here -->
                    </div>
                </div>
            `;
            switchWireframe(activeWf);
        }

        // Switch active ASCII wireframe type
        function switchWireframe(type) {
            activeWf = type;
            document.querySelectorAll('.wf-tab-btn').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.getElementById(`btn-wf-${type.toLowerCase()}`);
            if (targetBtn) targetBtn.classList.add('active');

            const mdRaw = generatedDocs['wireframe'];
            
            let concept = t("기본 요구사항을 충족하는 레이아웃 구성안입니다.", "Layout meeting basic requirements.");
            let asciiArt = "";

            try {
                const sections = mdRaw.split(/##\s*Type\s*[A-C]/i);
                let selectedSec = "";
                if (type === 'A' && sections[1]) selectedSec = sections[1];
                else if (type === 'B' && sections[2]) selectedSec = sections[2];
                else if (type === 'C' && sections[3]) selectedSec = sections[3];

                if (selectedSec) {
                    const conceptMatch = selectedSec.match(/컨셉\s*:\s*([^\n]+)/i) || selectedSec.match(/-\s*([^\n]+)/);
                    if (conceptMatch) concept = conceptMatch[1];
                    
                    const codeBlockMatch = selectedSec.match(/```(?:text)?\n([\s\S]+?)\n```/);
                    if (codeBlockMatch) asciiArt = codeBlockMatch[1];
                }
            } catch (e) {
                console.error("Parsing wireframe failed:", e);
            }

            // Fallbacks
            if (!asciiArt) {
                if (type === 'A') {
                    asciiArt = t(
                        `┌──────────────────────────────────────────┐\n│ [Logo] PITL-Process            [마이]    │\n├──────────────────────────────────────────┤\n│  [ 탭: 1-pager ] [ 탭: PRD ] [ 탭: 와이어 ]│\n├──────────────────────────────────────────┤\n│  - 리스트 아이템 1                       │\n│  - 리스트 아이템 2                       │\n└──────────────────────────────────────────┘`,
                        `┌──────────────────────────────────────────┐\n│ [Logo] PITL-Process            [My]      │\n├──────────────────────────────────────────┤\n│  [ Tab: 1-pager ] [ Tab: PRD ] [ Tab: WF ]│\n├──────────────────────────────────────────┤\n│  - List Item 1                           │\n│  - List Item 2                           │\n└──────────────────────────────────────────┘`
                    );
                } else if (type === 'B') {
                    asciiArt = t(
                        `┌──────────────────────────────────────────┐\n│ [Logo] PITL-Process                [▾]   │\n├──────────────────────────────────────────┤\n│                                          │\n│      [ 슬라이드 카드: 주요 정보 ]        │\n│      - 세련된 비주얼 중심                │\n│                                          │\n│                         ┌──────────────┐ │\n│                         │  ⚡ 복사 FAB  │ │\n└─────────────────────────└──────────────┘─┘`,
                        `┌──────────────────────────────────────────┐\n│ [Logo] PITL-Process                [▾]   │\n├──────────────────────────────────────────┤\n│                                          │\n│      [ Slide Card: Key Info ]            │\n│      - Sleek visual focus                │\n│                                          │\n│                         ┌──────────────┐ │\n│                         │  ⚡ Copy FAB  │ │\n└─────────────────────────└──────────────┘─┘`
                    );
                } else {
                    asciiArt = t(
                        `┌──────────────────────────────────────────┐\n│ [Logo] PITL-Process    (라이브 모드)     │\n├────────────────────┬─────────────────────┤\n│ [실시간 프리뷰]    │ [에이전트 로그]     │\n│                    │ - strategist 완공   │\n│                    │ - reviewer 검증 PASS│\n└────────────────────┴─────────────────────┘`,
                        `┌──────────────────────────────────────────┐\n│ [Logo] PITL-Process    (Live Mode)       │\n├────────────────────┬─────────────────────┤\n│ [Realtime Preview] │ [Agent Logs]        │\n│                    │ - strategist done   │\n│                    │ - reviewer QA PASS  │\n└────────────────────┴─────────────────────┘`
                    );
                }
            }

            const target = document.getElementById('wireframe-render-target');
            if (target) {
                target.innerHTML = `
                    <h3 style="font-size: 14px; font-weight: 600; color: var(--text-primary); margin: 20px 0 6px 0;">Type ${type} ${t("시안 아키텍처", "Layout Architecture")}</h3>
                    <p style="color: var(--accent-text); font-size: 13px; font-style: italic; margin-bottom: 14px;">"${concept}"</p>
                    
                    <div class="terminal-container">
                        <div class="terminal-header">
                            <div class="terminal-buttons">
                                <div class="t-btn tb-red"></div>
                                <div class="t-btn tb-yellow"></div>
                                <div class="t-btn tb-green"></div>
                            </div>
                            <div class="terminal-title">wireframe_type_${type.toLowerCase()}.txt</div>
                            <div></div>
                        </div>
                        <div class="terminal-body">
                            <div class="ascii-art">${escapeHtml(asciiArt)}</div>
                        </div>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // Core Document Copy & PDF actions
        function copyActiveDocument() {
            if (!generatedDocs) return;
            const md = generatedDocs[activeDoc];
            navigator.clipboard.writeText(md).then(() => {
                pitlAlert(t(`'<strong>${activeDoc}</strong>' 문서의 마크다운 소스가 클립보드에 복사되었습니다.`, `Markdown source of '<strong>${activeDoc}</strong>' copied to clipboard.`), 'success', t('복사 완료', 'Copied'));
            });
        }

        function simulatePDFDownload() {
            if (!generatedDocs) return;
            pitlAlert(t(`PDF 빌드가 완공되었습니다.<br><code style="font-size:11px;color:var(--accent-text)">outputs/${generatedDocs.title}_wireframes.pdf</code>`, `PDF build complete.<br><code style="font-size:11px;color:var(--accent-text)">outputs/${generatedDocs.title}_wireframes.pdf</code>`), 'success', t('PDF 내보내기 완료', 'PDF Export Complete'));
        }

        // Delete single history item
        // 확인/취소 두 버튼짜리 알림 (pitlAlert 위에 버튼만 바꿔 끼운다)
        function pitlConfirm(message, onConfirm, { title = '', confirmLabel = '', cancelLabel = '' } = {}) {
            pitlAlert(message, 'warn', title);
            const overlay = document.getElementById('pitl-alert-overlay');
            const btnsEl = document.getElementById('pitl-alert-buttons');
            if (!overlay || !btnsEl) return; // 모달이 없으면 확인받지 못한 것으로 보고 실행하지 않는다
            btnsEl.innerHTML = `
                <button type="button" class="pitl-modal-btn pitl-modal-btn-secondary" data-act="cancel">${cancelLabel || t('취소', 'Cancel')}</button>
                <button type="button" class="pitl-modal-btn pitl-modal-btn-danger" data-act="ok"><i class="fa-regular fa-trash-can"></i> ${confirmLabel || t('확인', 'OK')}</button>`;
            const close = () => { overlay.style.display = 'none'; };
            btnsEl.querySelector('[data-act="cancel"]').addEventListener('click', close);
            btnsEl.querySelector('[data-act="ok"]').addEventListener('click', () => { close(); onConfirm(); });
            btnsEl.querySelector('[data-act="cancel"]').focus();
        }

        function deleteHistoryItem(title, date, event) {
            if (event) event.stopPropagation();
            pitlConfirm(
                t('이 기획을 삭제할까요?<br>브라우저 기록과 서버 <code>outputs/</code> 폴더의 파일이 모두 지워지며 되돌릴 수 없습니다.',
                  'Delete this plan?<br>Both the browser record and the files in the server <code>outputs/</code> folder will be removed. This cannot be undone.'),
                () => performHistoryDelete(title, date),
                { title: t('기획 삭제', 'Delete plan'), confirmLabel: t('삭제', 'Delete') }
            );
        }

        async function performHistoryDelete(title, date) {
            // 1. 브라우저 저장소
            let clientHistory = localStorage.getItem('pitl_client_history');
            if (clientHistory) {
                try {
                    let parsed = JSON.parse(clientHistory);
                    const filtered = parsed.filter(item => !(item.title === title && item.date === date));
                    localStorage.setItem('pitl_client_history', JSON.stringify(filtered));
                } catch(e){}
            }

            // 2. 서버 outputs/ 파일
            try {
                const res = await fetch(`/api/history?title=${encodeURIComponent(title)}&date=${encodeURIComponent(date)}`, { method: 'DELETE' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
                showCompletionToast(data.deleted
                    ? t(`히스토리 항목이 삭제되었습니다. (서버 파일 ${data.deleted}개)`, `History item deleted (${data.deleted} server files).`)
                    : t('히스토리 항목이 삭제되었습니다.', 'History item deleted.'));
            } catch (err) {
                pitlAlert(t('브라우저 기록은 지웠지만 서버 파일 삭제에 실패했습니다: ', 'Removed from the browser, but deleting the server files failed: ') + vizEsc(err.message),
                    'error', t('삭제 실패', 'Delete failed'));
            }

            // 지금 열려 있는 기획을 지웠으면 랜딩으로 돌아간다
            if (generatedDocs && generatedDocs.title === title && window.pitlActiveSessionDate === date) {
                generatedDocs = null;
                resetToLanding();
            }
            loadHistoryList();
        }

        // Helper to render history cards (used by loadHistoryList)
        const STARTER_EXAMPLES = [
            { title: '반찬 구독 앱', desc: '구독형 커머스 · 재구매 설계', fill: '1인 가구 반찬 구독 앱\n타겟유저: 30대 직장인\n경쟁사: 쿠캣, 배민 반찬' },
            { title: 'PT 예약 SaaS', desc: 'B2B 예약 · 노쇼 방지', fill: '동네 헬스장 PT 예약 SaaS\n타겟유저: 트레이너 1~5인 센터\n경쟁사: 짐플, 바디코디' },
            { title: 'AI 여행 일정', desc: '개인화 추천 · 일정 편집', fill: 'AI 여행 일정 짜주는 앱\n타겟유저: 20대 자유여행객\n경쟁사: 트리플, 마이리얼트립' }
        ];

        function fillStarterExample(i) {
            const ta = document.getElementById('idea-textarea');
            if (!ta || !STARTER_EXAMPLES[i]) return;
            ta.value = STARTER_EXAMPLES[i].fill;
            updatePromptSlots();
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);
        }

        // ── 구조화 입력: 아이디어·타겟유저·경쟁사 칩 ──
        function detectPromptSlots(text) {
            const parsed = checkIdeaParsing(text);
            const firstLine = text.split(/\n|\//)[0].replace(/(타겟|타깃|경쟁|target|competitor).*/i, '').trim();
            return { idea: firstLine.length >= 4, target: parsed.hasTarget, comp: parsed.hasCompetitor };
        }

        function updatePromptSlots() {
            const ta = document.getElementById('idea-textarea');
            const box = document.getElementById('prompt-slots');
            if (!ta || !box) return;
            const d = detectPromptSlots(ta.value);
            let n = 0;
            box.querySelectorAll('.slot-chip').forEach(el => { const on = !!d[el.dataset.slot]; el.classList.toggle('filled', on); if (on) n++; });
            box.querySelectorAll('.slot-meter i').forEach((el, i) => el.classList.toggle('on', i < n));
            const nudge = document.getElementById('slot-nudge');
            const missing = [!d.target && t('타겟유저', 'target users'), !d.comp && t('경쟁사', 'competitors')].filter(Boolean).join('·');
            nudge.classList.toggle('warn', d.idea && n < 3);
            nudge.textContent = !ta.value.trim() ? t('아이디어부터 적어 주세요', 'Start with your idea')
                : n === 3 ? t('세 항목이 모두 있어 분석이 더 정확해집니다', 'All three present: analysis will be sharper')
                : !d.idea ? t('아이디어를 조금 더 구체적으로 적어 주세요', 'Describe the idea a little more')
                : t(`${missing}를 더하면 분석이 깊어집니다 (없어도 시작 가능)`, `Add ${missing} for a deeper analysis (optional)`);
        }

        function initPromptSlots() {
            const ta = document.getElementById('idea-textarea');
            const box = document.getElementById('prompt-slots');
            if (!ta || !box) return;
            ta.addEventListener('input', updatePromptSlots);
            box.querySelectorAll('.slot-chip').forEach(el => el.addEventListener('click', () => {
                if (!el.classList.contains('filled') && el.dataset.slot !== 'idea') {
                    const label = el.dataset.slot === 'target' ? t('타겟유저: ', 'Target users: ') : t('경쟁사: ', 'Competitors: ');
                    ta.value = ta.value.replace(/\s*$/, '') + (ta.value.trim() ? '\n' : '') + label;
                    updatePromptSlots();
                }
                ta.focus();
                ta.setSelectionRange(ta.value.length, ta.value.length);
            }));
            updatePromptSlots();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPromptSlots);
        else initPromptSlots();

        // 오늘 만든 기록은 완료 시각, 그 외는 "10월 31일"
        function historyWhen(item, isToday) {
            const fin = item.docs && item.docs.timings && item.docs.timings.finishedAt;
            if (isToday && fin) return new Date(fin).toLocaleTimeString(t('ko-KR', 'en-US'), { hour: 'numeric', minute: '2-digit' });
            const m = String(item.displayDate || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!m) return item.displayDate || '';
            return t(`${Number(m[2])}월 ${Number(m[3])}일`, new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
        }

        function filterHistoryRows(query) {
            const q = String(query || '').trim().toLowerCase();
            const list = document.getElementById('history-list');
            if (!list) return;
            list.querySelectorAll('.history-row:not(.history-live)').forEach(row => { row.hidden = !!q && !(row.dataset.search || '').includes(q); });
            // 보이는 행이 없는 날짜 묶음 머리글은 숨긴다
            list.querySelectorAll('.history-group').forEach(head => {
                let el = head.nextElementSibling, any = false;
                while (el && !el.classList.contains('history-group')) { if (!el.hidden && el.classList.contains('history-row')) any = true; el = el.nextElementSibling; }
                head.hidden = !any;
            });
        }

        function startNewPlan() {
            resetToLanding();
            const ta = document.getElementById('idea-textarea');
            if (ta) setTimeout(() => ta.focus(), 50);
        }

        document.addEventListener('keydown', e => {
            if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                startNewPlan();
            }
        });

        // 실행 중인 기획을 사이드바 "오늘" 맨 위에 보여 준다
        function updateLiveHistoryRow() {
            const list = document.getElementById('history-list');
            if (!list) return;
            const tm = window.pitlTiming;
            const running = !!(tm && tm.active && !tm.finishedAt);
            let row = document.getElementById('history-live-row');
            const empty = list.querySelector('.sidebar-empty-state');
            if (empty) empty.hidden = running;
            if (!running) {
                if (row) row.remove();
                const h = document.getElementById('history-live-head');
                if (h) h.remove();
                return;
            }
            if (!row) {
                row = document.createElement('div');
                row.id = 'history-live-row';
                row.className = 'history-item-card history-row history-live cur';
                row.onclick = () => {
                    document.body.classList.remove('state-landing');
                    document.body.classList.add('state-workspace');
                    if (window.pitlWaitingGate50) renderGateCheckpoint(); else renderPipelineRunningProgressCard();
                };
                const first = list.querySelector('.history-group');
                let head = first && first.textContent === t('오늘', 'Today') ? first : null;
                if (!head) {
                    head = document.createElement('div');
                    head.className = 'history-group';
                    head.id = 'history-live-head';
                    head.textContent = t('오늘', 'Today');
                    list.prepend(head);
                }
                head.after(row);
            }
            const title = window.pitlRunTitle || (window.pitlRunIdea && typeof summarizeIdeaToTitle === 'function' ? summarizeIdeaToTitle(window.pitlRunIdea) : '') || t('새 기획', 'New plan');
            const stats = computeProgress();
            const status = window.pitlWaitingGate50 ? t('⏸ 검토 대기', '⏸ Waiting for review')
                : `● ${t('실행 중', 'Running')} · ${STEP_LABELS[tm.active] || ''}${stats ? ` · ${t('전체', 'overall')} ${Math.round(stats.percent)}%` : ''}`;
            const html = `<div class="history-row-main"><b class="history-row-title">${escHtml(title)}</b><span class="history-row-meta history-live-meta">${escHtml(status)}</span></div>`;
            if (row.dataset.sig !== html) { row.innerHTML = html; row.dataset.sig = html; }
        }

        function fillHistoryMarquee(grid) {
            const set = grid.dataset.cards;
            if (!set) return;
            grid.innerHTML = set;
            const setWidth = grid.scrollWidth;
            const view = (grid.parentElement && grid.parentElement.clientWidth) || window.innerWidth;
            const reps = setWidth > 0 ? Math.max(1, Math.ceil(view / setWidth)) : 1;
            const half = set.repeat(reps);
            grid.innerHTML = half + half;
            // 속도는 카드 수와 상관없이 일정하게 (초당 약 40px)
            grid.style.animationDuration = Math.max(18, Math.round(setWidth * reps / 40)) + 's';
        }

        // 작업 화면에서 첫 화면으로 돌아오면 (숨겨져 있던 동안 폭을 잴 수 없었으므로) 다시 채운다
        function refillHistoryMarquees() {
            if (!document.body.classList.contains('state-landing')) return;
            ['landing-history-list', 'landing-history-list-2'].forEach(id => {
                const grid = document.getElementById(id);
                if (grid && grid.dataset.cards) fillHistoryMarquee(grid);
            });
        }
        new MutationObserver(refillHistoryMarquees).observe(document.body, { attributes: true, attributeFilter: ['class'] });

        let historyMarqueeTimer = 0;
        window.addEventListener('resize', () => {
            clearTimeout(historyMarqueeTimer);
            historyMarqueeTimer = setTimeout(refillHistoryMarquees, 200);
        });

        function renderHistoryLists(data) {
            // 1. Sidebar List
            const listContainer = document.getElementById('history-list');
            if (listContainer) {
                if (!data || data.length === 0) {
                    listContainer.innerHTML = `
                        <div class="sidebar-empty-state">
                            <i class="fa-regular fa-folder-open"></i>
                            <span>${t("히스토리가 없습니다", "No History")}</span>
                        </div>
                    `;
                } else {
                    const today = new Date();
                    const ymd = d => `${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
                    const todayKey = ymd(today);
                    const weekKey = ymd(new Date(today.getFullYear(), today.getMonth(), today.getDate() - 6));
                    const groupOf = item => item.date === todayKey ? t('오늘', 'Today') : item.date >= weekKey ? t('최근 7일', 'Last 7 days') : t('이전', 'Earlier');
                    let lastGroup = '';
                    listContainer.innerHTML = data.map(item => {
                        const group = groupOf(item);
                        const head = group !== lastGroup ? `<div class="history-group">${group}</div>` : '';
                        lastGroup = group;
                        const fullIdeaText = item.idea || item.displayTitle || '';
                        const isCur = window.pitlCurrentHistoryKey === `${item.title}|${item.date}`;
                        return `${head}
                        <div class="history-item-card history-row${isCur ? ' cur' : ''}" data-key="${escHtml(item.title + '|' + item.date)}" data-search="${escHtml((item.displayTitle + ' ' + fullIdeaText).toLowerCase())}" onclick="if (!String(window.getSelection())) loadHistoryItem('${item.title}', '${item.date}')" title="${escHtml(fullIdeaText)}">
                            <div class="history-row-main">
                                <b class="history-row-title">${item.displayTitle}</b>
                                <span class="history-row-meta">${item.types.length}${t('개 문서', ' docs')} · ${historyWhen(item, group === t('오늘', 'Today'))}</span>
                            </div>
                            <button class="btn-delete-history" onclick="deleteHistoryItem('${item.title}', '${item.date}', event)" title="${t("삭제", "Delete")}">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                        `;
                    }).join('');
                }
                updateLiveHistoryRow();
                const q = document.getElementById('history-search');
                if (q && q.value) filterHistoryRows(q.value);
            }
            
            // 2. Landing Recent history marquee (credit roll)
            const landingGrid = document.getElementById('landing-history-list');
            const marqueeWrapper = landingGrid ? landingGrid.closest('.landing-history-marquee-wrapper') : null;
            const landingGrid2 = document.getElementById('landing-history-list-2');
            if (landingGrid) {
                if (!data || data.length === 0) {
                    landingGrid.style.animation = 'none';
                    delete landingGrid.dataset.cards;
                    if (landingGrid2) { landingGrid2.hidden = true; landingGrid2.innerHTML = ''; delete landingGrid2.dataset.cards; }
                    landingGrid.innerHTML = `
                        <div class="landing-history-empty starter-empty">
                            <div class="starter-glyph" aria-hidden="true">✦</div>
                            <b class="starter-title">${t("첫 기획서를 만들어 보세요", "Create your first plan")}</b>
                            <span class="starter-desc">${t("아이디어 한 줄이면 1-Pager부터 프로토타입·QA까지 9개 문서가 만들어집니다. 예시로 시작해도 좋아요.", "One idea line produces nine documents, from the 1-Pager to the prototype and QA. Start from an example if you like.")}</span>
                            <div class="starter-grid">
                                ${STARTER_EXAMPLES.map((ex, i) => `<button type="button" class="starter-card" onclick="fillStarterExample(${i})"><b>${ex.title}</b><span>${ex.desc}</span><em>${t("예시로 채우기 →", "Use example →")}</em></button>`).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    const buildCard = (item) => {
                        const fullIdeaText = item.idea || item.displayTitle || '';
                        return `
                        <div class="landing-history-card" onclick="if (!String(window.getSelection())) loadHistoryItem('${item.title}', '${item.date}')">
                            <div class="landing-card-content">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                                    <div class="landing-card-title" style="user-select:text; flex: 1;">
                                        <i class="fa-regular fa-file-lines" style="color: var(--accent-text); margin-right: 6px; user-select:none;"></i> ${item.displayTitle}
                                    </div>
                                    <button class="btn-delete-history" onclick="deleteHistoryItem('${item.title}', '${item.date}', event)" title="${t("삭제", "Delete")}">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </div>
                                ${fullIdeaText ? `<div class="landing-card-idea" style="font-size:12px; color:var(--text-secondary); margin:6px 0 4px; line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:188px;">${fullIdeaText}</div>` : ''}
                                <div class="landing-card-footer">
                                    <span style="user-select:text;">${item.displayDate}</span>
                                    <span class="landing-card-badge">${item.types.length}${t("개 파일 완료", " files completed")}</span>
                                </div>
                            </div>
                        </div>`;
                    };
                    // 끊김 없는 흐름: 화면 폭을 채울 만큼 반복한 묶음을 두 번 이어 붙인다 (-50% 이동)
                    // 두 줄이 서로 반대로 흐른다: 6개 이상이면 번갈아 나눠 담고, 적으면 두 줄 모두 전체(아랫줄은 역순)
                    const row1 = data.length >= 6 ? data.filter((_, i) => i % 2 === 0) : data;
                    const row2 = data.length >= 6 ? data.filter((_, i) => i % 2 === 1) : [...data].reverse();
                    landingGrid.style.animation = '';
                    landingGrid.dataset.cards = row1.map(buildCard).join('');
                    fillHistoryMarquee(landingGrid);
                    if (landingGrid2) {
                        landingGrid2.hidden = false;
                        landingGrid2.dataset.cards = row2.map(buildCard).join('');
                        fillHistoryMarquee(landingGrid2);
                    }
                }
            }
            
            // Dynamically bind 3D Tilt on loaded history cards
            setTimeout(() => {
                document.querySelectorAll('.landing-history-card').forEach(card => {
                    card.addEventListener('mousemove', (e) => handleTilt(e, card, 6)); // classier subtle tilt
                    card.addEventListener('mouseleave', () => resetTilt(card));
                });
            }, 200);
        }

        // Planning history fetching
        async function loadHistoryList() {
            fetch('/api/history')
            .then(res => {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(data => {
                // Merge server history and localStorage client history
                let clientHistory = localStorage.getItem('pitl_client_history');
                clientHistory = clientHistory ? JSON.parse(clientHistory) : [];
                
                // Deduplicate items based on title and date (prioritizing server items)
                const merged = [...data];
                clientHistory.forEach(cItem => {
                    if (!merged.some(sItem => sItem.title === cItem.title && sItem.date === cItem.date)) {
                        merged.push(cItem);
                    }
                });
                
                renderHistoryLists(merged.sort((a, b) => b.date.localeCompare(a.date)));
            })
            .catch(err => {
                console.warn("Backend history API unavailable. Loading from localStorage...");
                let clientHistory = localStorage.getItem('pitl_client_history');
                clientHistory = clientHistory ? JSON.parse(clientHistory) : [];
                renderHistoryLists(clientHistory);
            });
        }

        // Fetch selected historical item
        async function loadHistoryItem(title, date) {
            resetViewHistory();
            window.pitlCurrentHistoryKey = `${title}|${date}`;
            document.querySelectorAll('#history-list .history-row:not(.history-live)').forEach(row => row.classList.toggle('cur', row.dataset.key === window.pitlCurrentHistoryKey));
            const btnSubmit = document.getElementById('btn-submit-planning');
            const ideaTextarea = document.getElementById('idea-textarea');

            if (ideaTextarea) ideaTextarea.disabled = true;
            
            // Transition view directly to workspace
            document.body.classList.remove('state-landing');
            document.body.classList.add('state-workspace');

            // Close mobile sidebar if open
            const container = document.querySelector('.workspace-view-container');
            const overlay = document.querySelector('.sidebar-overlay');
            if (container) container.classList.remove('sidebar-open');
            if (overlay) overlay.classList.remove('active');

            // Find full idea description from local storage or server data first
            let clientHistory = localStorage.getItem('pitl_client_history');
            clientHistory = clientHistory ? JSON.parse(clientHistory) : [];
            const foundItem = clientHistory.find(item => item.title === title && item.date === date);
            const rawIdea = foundItem ? (foundItem.idea || foundItem.displayTitle) : title.replace(/_/g, ' ');

            // Populate system loaded message card in timeline
            const chatContainer = document.getElementById('chat-messages-container');
            if (chatContainer) {
                chatContainer.innerHTML = `
                    <div class="system-notification" data-i18n-msg="기획 세션 로드 완료: ${rawIdea} (${date})">
                        <i class="fa-solid fa-folder-open"></i> <span class="msg-text">${t("기획 세션 로드 완료", "Planning session loaded")}: ${rawIdea} (${date})</span>
                    </div>
                    <div class="chat-bubble agent-system">
                        <div class="bubble-avatar" style="background: var(--text-muted)">
                            <i class="fa-solid fa-gears"></i>
                        </div>
                        <div class="bubble-content">
                            <div class="bubble-header">
                                <span class="bubble-author">PITL Orchestrator</span>
                                <span class="bubble-time">${new Date().toLocaleTimeString()}</span>
                            </div>
                            <div class="bubble-text" data-i18n-msg="이전에 생성 완료된 1-pager 요약서, PRD 요구사항 명세서, 와이어프레임 3안 시안 및 삼각 정합성 검수서 세션이 성공적으로 복원되었습니다. 우측 컴퓨터 뷰어의 탭을 사용하여 개별 문서를 검토하고, 기획안 수정을 진행할 수 있습니다.">${t("이전에 생성 완료된 1-pager 요약서, PRD 요구사항 명세서, 와이어프레임 3안 시안 및 삼각 정합성 검수서 세션이 성공적으로 복원되었습니다. 우측 컴퓨터 뷰어의 탭을 사용하여 개별 문서를 검토하고, 기획안 수정을 진행할 수 있습니다.", "Previously generated 1-pager summary, PRD specification, 3 wireframe options, and consistency QA audit report have been successfully restored. You can review individual documents using the tabs in the right viewer panel and perform edits.")}</div>
                        </div>
                    </div>
                `;
            }

            // 이 브라우저에서 생성한 기획(localStorage)을 먼저 찾고, 없으면 서버 outputs/에서 로드
            let localHistory = localStorage.getItem('pitl_client_history');
            localHistory = localHistory ? JSON.parse(localHistory) : [];
            const localItem = localHistory.find(item => item.title === title && item.date === date);
            if (localItem && localItem.docs) {
                setupLoadedSession(localItem.docs, title, date);
                return;
            }

            const currentLang = localStorage.getItem('pitl_lang') || 'ko';
            fetch(`/api/history/load?title=${encodeURIComponent(title)}&date=${encodeURIComponent(date)}&lang=${currentLang}`)
            .then(res => {
                if (!res.ok) throw new Error("네트워크 서버 통신 오류");
                return res.json();
            })
            .then(data => {
                setupLoadedSession(data, title, date);

            .catch(err => {

                    setupLoadedSession(foundItem.docs, title, date);

                    if (btnSubmit) btnSubmit.disabled = false;
                    if (ideaTextarea) ideaTextarea.disabled = false;
                    resetToLanding();
                }
            });
        }

        function setupLoadedSession(data, title, date) {

            generatedDocs = data;
            
            window.pitlActiveSessionDate = date;

                ideaTextarea.value = data.idea;
            }

            if (ideaTextarea) ideaTextarea.disabled = false;

        // 🌌 Space Particle Network Background Animation Engine
        function initSpaceParticleNetwork() {
            const canvas = document.getElementById('space-particle-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let width = (canvas.width = canvas.parentElement.clientWidth || window.innerWidth);
            let height = (canvas.height = canvas.parentElement.clientHeight || window.innerHeight);

            let mouse = { x: null, y: null, maxDist: 170 };

            window.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            });

            window.addEventListener('mouseleave', () => {
                mouse.x = null;
                mouse.y = null;
            });

            const resizeCanvas = () => {
                if (!canvas.parentElement) return;
                width = canvas.width = canvas.parentElement.clientWidth || window.innerWidth;
                height = canvas.height = canvas.parentElement.clientHeight || window.innerHeight;
            };

            window.addEventListener('resize', resizeCanvas);

            const particleCount = Math.min(Math.floor((width * height) / 9500), 120);
            const particles = [];

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.6;
                    this.vy = (Math.random() - 0.5) * 0.6;
                    this.radius = Math.random() * 2 + 1;
                    this.baseAlpha = Math.random() * 0.5 + 0.3;
                    this.alpha = this.baseAlpha;
                    this.pulseSpeed = Math.random() * 0.02 + 0.005;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;

                    this.alpha += Math.sin(Date.now() * this.pulseSpeed) * 0.006;
                    if (this.alpha < 0.2) this.alpha = 0.2;
                    if (this.alpha > 0.85) this.alpha = 0.85;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${cssAccentRGB()}, ${this.alpha})`;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = `rgb(${cssAccentRGB()})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function animate() {
                if (shouldPauseBackgroundMotion()) {
                    setTimeout(() => requestAnimationFrame(animate), 500);
                    return;
                }
                ctx.clearRect(0, 0, width, height);

                // Draw network connection lines between nearby particles
                const maxConnectDist = 135;
                for (let a = 0; a < particles.length; a++) {
                    for (let b = a + 1; b < particles.length; b++) {
                        const dx = particles[a].x - particles[b].x;
                        const dy = particles[a].y - particles[b].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < maxConnectDist) {
                            const lineAlpha = (1 - dist / maxConnectDist) * 0.28;
                            ctx.beginPath();
                            ctx.moveTo(particles[a].x, particles[a].y);
                            ctx.lineTo(particles[b].x, particles[b].y);
                            ctx.strokeStyle = `rgba(${cssAccentRGB()}, ${lineAlpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }

                // Draw interactive mouse connection lines
                if (mouse.x !== null && mouse.y !== null) {
                    for (let i = 0; i < particles.length; i++) {
                        const dx = particles[i].x - mouse.x;
                        const dy = particles[i].y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < mouse.maxDist) {
                            const lineAlpha = (1 - dist / mouse.maxDist) * 0.45;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.strokeStyle = `rgba(${cssAccentRGB()}, ${lineAlpha})`;
                            ctx.lineWidth = 1.2;
                            ctx.stroke();
                        }
                    }
                }

                // Update and render particles
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }

                requestAnimationFrame(animate);
            }

            animate();
        }

        // Initialize Resizable Column Panels & Space Particle Canvas on DOMContentLoaded
        window.addEventListener('DOMContentLoaded', () => {
            initResizablePanels();
            initSpaceParticleNetwork();

            // Sync theme icons after DOM is ready
            const savedTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const isLight = savedTheme === 'light';
            document.querySelectorAll(
                '#theme-toggle-btn, .theme-toggle-btn, #btn-theme-toggle-sidebar'
            ).forEach(btn => {
                btn.innerHTML = isLight
                    ? '<i class="fa-solid fa-moon"></i>'
                    : '<i class="fa-solid fa-sun"></i>';
            });
        });

        // Resizable Columns Script (2-Column Layout: Sidebar & Main Viewer)
        function initResizablePanels() {
            const sidebar = document.getElementById('panel-sidebar');
            const resizerLeft = document.getElementById('resizer-left');

            if (!resizerLeft || !sidebar) return;

            // Restore saved column width from localStorage
            const savedSidebarWidth = localStorage.getItem('pitl_sidebar_width');
            if (savedSidebarWidth && sidebar) sidebar.style.width = savedSidebarWidth + 'px';

            let isDragging = false;
            let startX = 0;
            let startWidth = 0;

            resizerLeft.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;
                resizerLeft.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                let newWidth = startWidth + dx;

                const minW = 220;
                const maxW = 560;

                if (newWidth >= minW && newWidth <= maxW) {
                    sidebar.style.width = newWidth + 'px';
                    localStorage.setItem('pitl_sidebar_width', newWidth);
                }
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    resizerLeft.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        }
    </script>
    <script>
        // 두 줄 제목(PITL. / Planning-in-the-loop)의 가로 길이를 같게 맞춘다.
        // 기준 폭은 56px 크기의 아래 줄 폭, 화면이 좁으면 제목 영역 폭.
        function fitLandingTitle() {
            const title = document.getElementById('landing-title');
            if (!title) return;
            const lines = title.querySelectorAll('.title-pitl, .title-full');
            const BASE = 56;
            lines.forEach(el => { el.style.fontSize = BASE + 'px'; });
            const full = title.querySelector('.title-full');
            const avail = Math.min(title.parentElement.clientWidth, window.innerWidth - 32);
            if (!avail) return;
            const target = Math.min(full.getBoundingClientRect().width, avail);
            // 글자 크기와 폭이 정확히 비례하지 않아(힌팅·커닝) 두 번 보정한다
            for (let pass = 0; pass < 2; pass++) {
                lines.forEach(el => {
                    const w = el.getBoundingClientRect().width;
                    const size = parseFloat(el.style.fontSize);
                    if (w > 0) el.style.fontSize = (size * target / w).toFixed(2) + 'px';
                });
            }
        }
        fitLandingTitle();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLandingTitle);
        window.addEventListener('resize', fitLandingTitle);
    </script>

    <script>
        (function landingDots() {
            // 첫 화면 우측 애니메이션: 세 가지 이야기가 번갈아 재생된다
            //  A. 아이디어 → 9단계 → 한 장의 기획   B. 에이전트 4팀 → 하나의 루프   C. 구조 → 우선순위 → 검증 → 화면
            const canvas = document.getElementById('landing-dots-canvas');
            const caption = document.getElementById('landing-dots-caption');
            if (!canvas || !caption) return;
            const ctx = canvas.getContext('2d');
            const LABELS = ['1-Pager', '3C', 'SWOT', 'STP', 'MECE', 'PRD', 'Wireframe', 'Prototype', 'QA'];
            const COLOR_VARS = ['--agent-s', '--agent-s', '--agent-s', '--agent-s', '--agent-s', '--agent-a', '--agent-d', '--agent-d', '--agent-r'];
            const N = 9;
            const rand = i => { const x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); };
            const C = { x: .5, y: .46 };
            const ring = (i, r, rot = 0) => ({ x: C.x + Math.cos(i / N * Math.PI * 2 - Math.PI / 2 + rot) * r, y: C.y + Math.sin(i / N * Math.PI * 2 - Math.PI / 2 + rot) * r });
            const loopEdges = Array.from({ length: N }, (_, i) => [i, (i + 1) % N]);
            const chain = Array.from({ length: N - 1 }, (_, i) => [i, i + 1]);

            // A: 3줄 지그재그 경로 · 문서
            const zig = i => { const row = Math.floor(i / 3), col = row % 2 ? 2 - i % 3 : i % 3; return { x: .2 + col * .3, y: .22 + row * .26 }; };
            const docRows = [.36, .46, .56, .66, .76];
            // B: 에이전트 4팀 묶음 (전략가 5 · 분석가 1 · 설계자 2 · 검수자 1)
            const TEAM = [0, 0, 0, 0, 0, 1, 2, 2, 3];
            const TEAM_C = [{ x: .28, y: .27 }, { x: .72, y: .27 }, { x: .72, y: .67 }, { x: .28, y: .67 }];
            const teamPos = (i, el, spin) => {
                const g = TEAM[i], members = TEAM.map((t, j) => t === g ? j : -1).filter(j => j >= 0), m = members.indexOf(i);
                if (members.length === 1) return { ...TEAM_C[g] };
                const ang = m / members.length * Math.PI * 2 + (spin ? el / 900 : 0);
                const r = members.length > 2 ? .085 : .055;
                return { x: TEAM_C[g].x + Math.cos(ang) * r, y: TEAM_C[g].y + Math.sin(ang) * r };
            };
            // C: 3×3 격자 · 막대 · 체크 · 휴대폰 화면
            const grid = i => ({ x: .26 + (i % 3) * .24, y: .22 + Math.floor(i / 3) * .24 });
            const BAR_H = [.42, .3, .5, .22, .36, .46, .28, .4, .34];
            const bar = i => ({ x: .14 + i * .09, y: .74 - BAR_H[i] });
            const CHECK = [[.26, .48], [.32, .55], [.38, .62], [.44, .69], [.52, .6], [.6, .5], [.68, .4], [.76, .3], [.82, .22]];
            const phoneRows = [.3, .4, .5, .6, .7];

            const STORIES = [
                [ // A
                    { dur: 3000, ko: '아이디어 한 점에서', en: 'It starts with one dot',
                      dots: i => i === 0 ? { x: C.x, y: C.y, r: 11, a: 1 } : { x: C.x, y: C.y, r: 3, a: 0 }, edges: [], pulse: true },
                    { dur: 3200, ko: '질문이 생기고', en: 'Questions appear',
                      dots: i => i === 0 ? { x: C.x, y: C.y, r: 9, a: 1 } : i <= 3 ? { x: C.x + Math.cos((i - 1) * 2.094 - 1.571) * .26, y: C.y + Math.sin((i - 1) * 2.094 - 1.571) * .26, r: 7, a: 1 } : { x: C.x, y: C.y, r: 3, a: 0 },
                      edges: [[0, 1], [0, 2], [0, 3], [1, 2], [2, 3], [3, 1]] },
                    { dur: 2800, ko: '흩어진 생각을 모아', en: 'Gather scattered thoughts',
                      dots: i => ({ x: .12 + rand(i) * .76, y: .14 + rand(i + 20) * .64, r: 6, a: .9 }), edges: [] },
                    { dur: 5400, ko: '하나씩 이어 가면', en: 'Connect them one by one', labels: true, seq: true,
                      dots: i => ({ ...zig(i), r: 7, a: 1 }), edges: chain },
                    { dur: 4400, ko: '한 장의 기획이 됩니다', en: 'And it becomes a plan',
                      dots: i => i < 4 ? { x: [.24, .76, .76, .24][i], y: [.16, .16, .86, .86][i], r: 6, a: 1 } : { x: .32, y: docRows[i - 4], r: 5, a: 1 },
                      edges: [[0, 1], [1, 2], [2, 3], [3, 0], [4, [.68, docRows[0]]], [5, [.62, docRows[1]]], [6, [.66, docRows[2]]], [7, [.56, docRows[3]]], [8, [.6, docRows[4]]]] }
                ],
                [ // B
                    { dur: 3200, ko: '네 에이전트 팀이', en: 'Four agent teams',
                      dots: i => ({ ...teamPos(i, 0, false), r: 7, a: 1 }),
                      edges: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0], [6, 7]] },
                    { dur: 3600, ko: '각자 맡은 일을 하고', en: 'Each does its part',
                      dots: (i, el) => ({ ...teamPos(i, el, true), r: 7, a: 1 }), edges: [] },
                    { dur: 3800, ko: '결과를 건네며', en: 'Then hands it on', seq: true,
                      dots: (i, el) => ({ ...teamPos(i, el + 3600, true), r: 7, a: 1 }), edges: [[4, 5], [5, 6], [7, 8], [8, 0]] },
                    { dur: 5200, ko: '하나의 루프로 돕니다', en: 'Around one loop', seq: true,
                      dots: (i, el) => ({ ...ring(i, .3, el / 6000), r: 7, a: 1 }), edges: loopEdges }
                ],
                [ // C
                    { dur: 3600, ko: '문제를 구조로 나누고', en: 'Break the problem down',
                      dots: i => ({ ...grid(i), r: 7, a: 1 }),
                      edges: [[0, 1], [1, 2], [3, 4], [4, 5], [6, 7], [7, 8], [0, 3], [3, 6], [1, 4], [4, 7], [2, 5], [5, 8]] },
                    { dur: 3600, ko: '우선순위를 정하고', en: 'Decide what matters',
                      dots: i => ({ ...bar(i), r: 6, a: 1 }), edges: Array.from({ length: N }, (_, i) => [i, [bar(i).x, .74]]), bars: true },
                    { dur: 3800, ko: '빠짐없이 검증하면', en: 'Check every piece', seq: true,
                      dots: i => ({ x: CHECK[i][0], y: CHECK[i][1], r: 6, a: 1 }), edges: chain },
                    { dur: 4600, ko: '만들 준비가 됩니다', en: 'Ready to build',
                      dots: i => i < 4 ? { x: [.34, .66, .66, .34][i], y: [.14, .14, .84, .84][i], r: 6, a: 1 } : { x: .42, y: phoneRows[i - 4], r: 5, a: 1 },
                      edges: [[0, 1], [1, 2], [2, 3], [3, 0], [4, [.58, phoneRows[0]]], [5, [.56, phoneRows[1]]], [6, [.58, phoneRows[2]]], [7, [.52, phoneRows[3]]], [8, [.57, phoneRows[4]]]] }
                ]
            ];
            const SCENES = STORIES.flat();
            const TRANS = 1300;
            const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
            const lerp = (a, b, k) => a + (b - a) * k;
            const clamp01 = x => Math.min(1, Math.max(0, x));

            let W = 0, H = 0, colors = [], muted = '#888', textColor = '#222';
            function readTheme() {
                const cs = getComputedStyle(document.documentElement);
                colors = COLOR_VARS.map(v => cs.getPropertyValue(v).trim() || '#8B6CFF');
                const bcs = getComputedStyle(document.body);
                textColor = bcs.getPropertyValue('--text-primary').trim() || '#222';
                muted = bcs.getPropertyValue('--text-secondary').trim() || '#888';
            }
            // 배경 점 캔버스의 마스크 중심을 애니메이션 위치에 맞춘다
            function placeParticleMask() {
                const bgCanvas = document.getElementById('space-particle-canvas');
                if (!bgCanvas) return;
                const a = canvas.getBoundingClientRect(), b = bgCanvas.getBoundingClientRect();
                if (!a.width || !b.width) return;
                bgCanvas.style.setProperty('--dots-x', (a.left + a.width / 2 - b.left) + 'px');
                bgCanvas.style.setProperty('--dots-y', (a.top + a.height / 2 - b.top) + 'px');
                bgCanvas.style.setProperty('--dots-r', Math.round(Math.max(a.width, a.height) * .75) + 'px');
            }
            function resize() {
                const r = canvas.getBoundingClientRect();
                placeParticleMask();
                if (!r.width) return;
                const dpr = Math.min(2, window.devicePixelRatio || 1);
                W = r.width; H = r.height;
                canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            // k번째 장면의 el(ms) 시점을 그린다. 시작 위치는 직전 장면의 마지막 위치
            function drawAt(k, el) {
                const sc = SCENES[k], prev = SCENES[(k + SCENES.length - 1) % SCENES.length];
                const cur = [];
                for (let i = 0; i < N; i++) {
                    const q = ease(clamp01((el - i * 45) / TRANS));
                    const f = prev.dots(i, prev.dur), to = sc.dots(i, el);
                    cur.push({ x: lerp(f.x, to.x, q), y: lerp(f.y, to.y, q), r: lerp(f.r, to.r, q), a: lerp(f.a, to.a, q) });
                }
                ctx.clearRect(0, 0, W, H);
                const P = d => [d.x * W, d.y * H];

                // 잇는 선: 점이 자리 잡은 뒤 차례로 그려진다
                sc.edges.forEach((e, j) => {
                    const start = TRANS * .7 + j * (sc.seq ? 380 : 120);
                    const q = ease(clamp01((el - start) / (sc.seq ? 420 : 700)));
                    if (q <= 0) return;
                    const d0 = cur[e[0]];
                    const [x1, y1] = P(d0);
                    const toPoint = Array.isArray(e[1]);
                    const [x2, y2] = toPoint ? [e[1][0] * W, e[1][1] * H] : P(cur[e[1]]);
                    const grad = ctx.createLinearGradient(x1, y1, x2 + .01, y2 + .01);
                    grad.addColorStop(0, colors[e[0]]);
                    grad.addColorStop(1, toPoint ? colors[e[0]] : colors[e[1]]);
                    ctx.strokeStyle = grad;
                    ctx.globalAlpha = (toPoint ? (sc.bars ? .45 : .3) : .55) * Math.min(d0.a, 1);
                    ctx.lineWidth = toPoint ? (sc.bars ? 8 : 5) : 2;
                    ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, q), lerp(y1, y2, q)); ctx.stroke();
                });

                // 점
                cur.forEach((d, i) => {
                    if (d.a < .01) return;
                    const [x, y] = P(d);
                    const lit = sc.labels ? clamp01((el - TRANS * .7 - (i - 1) * 380) / 300) : 1;
                    ctx.globalAlpha = d.a * (sc.labels ? .35 + .65 * lit : 1);
                    ctx.fillStyle = colors[i];
                    ctx.beginPath(); ctx.arc(x, y, d.r, 0, Math.PI * 2); ctx.fill();
                    if (sc.pulse && i === 0) { // 첫 점은 숨 쉬듯 퍼지는 고리
                        const rr = (Math.max(0, el) % 1600) / 1600;
                        ctx.globalAlpha = (1 - rr) * .35;
                        ctx.strokeStyle = colors[0]; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(x, y, d.r + rr * 26, 0, Math.PI * 2); ctx.stroke();
                    }
                    if (sc.labels && lit > 0) {
                        ctx.globalAlpha = d.a * lit * .9;
                        ctx.fillStyle = i % 2 ? muted : textColor;
                        ctx.font = `500 ${Math.max(11, W * .027)}px 'Space Grotesk', 'Noto Sans KR', sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText(LABELS[i], x, y + (i % 2 ? 26 : -16));
                    }
                });
                ctx.globalAlpha = 1;
            }

            // 자막: 한 바퀴(세 이야기 전체)는 한글, 다음 바퀴는 영어로 번갈아 보여 준다
            let capKey = '', cycle = 0;
            function setCaption(text, lang) {
                if (capKey === text) return;
                capKey = text;
                caption.classList.remove('show');
                clearTimeout(setCaption.t);
                setCaption.t = setTimeout(() => { caption.textContent = text; caption.lang = lang; caption.classList.add('show'); }, 280);
            }
            function captionFor(k, lang) {
                const sc = SCENES[k];
                return lang === 'en' ? [sc.en, 'en'] : [sc.ko, 'ko'];
            }
            const cycleLang = () => (cycle % 2 ? 'en' : 'ko');

            let scene = 0, sceneStart = performance.now(), raf = 0;
            // 점검용: 원하는 장면·시점을 바로 그린다
            canvas.pitlSeek = (k, el, lang = 'ko') => { readTheme(); resize(); drawAt(k, el); const [c, l] = captionFor(k, lang); caption.textContent = c; caption.lang = l; caption.classList.add('show'); capKey = c; };

            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
            const active = () => document.body.classList.contains('state-landing') && !document.hidden && canvas.offsetParent !== null;
            function loop() {
                raf = 0;
                if (!active()) return;
                const now = performance.now();
                if (now - sceneStart > SCENES[scene].dur) {
                    scene = (scene + 1) % SCENES.length;
                    sceneStart = now;
                    if (scene === 0) cycle++;
                }
                drawAt(scene, now - sceneStart);
                setCaption(...captionFor(scene, cycleLang()));
                raf = requestAnimationFrame(loop);
            }
            function start() {
                readTheme(); resize();
                if (reduce.matches) { // 움직임 줄이기: 첫 이야기의 마지막 장면만 보여 준다
                    const last = STORIES[0].length - 1;
                    drawAt(last, 1e6);
                    caption.textContent = SCENES[last].ko; caption.classList.add('show');
                    return;
                }
                if (!raf && active()) raf = requestAnimationFrame(loop);
            }
            if (window.ResizeObserver) new ResizeObserver(start).observe(canvas);
            document.addEventListener('visibilitychange', start);
            new MutationObserver(start).observe(document.body, { attributes: true, attributeFilter: ['class'] });
            new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
            reduce.addEventListener('change', start);
            start();
        })();
    </script>
