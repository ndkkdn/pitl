        /* Custom Toast Notification */
        .pitl-toast-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(11, 11, 10, 0.85);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(var(--accent-rgb), 0.25);
            border-radius: 12px;
            padding: 16px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(var(--accent-rgb), 0.15);
            color: var(--text-primary);
            font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: -0.01em;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }
        .pitl-toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .pitl-toast-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--accent-text);
            font-size: 13px;
            box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.2);
            animation: pulse-neon 2s infinite;
        }
        @keyframes pulse-neon {
            0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(var(--accent-rgb), 0); }
            100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); }
        }

        /* Password Overlay Styling */
        .password-overlay-wrapper {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9fb;
            font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 1;
        }
        
        .password-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.06), 0 0 40px rgba(0, 0, 0, 0.02);
            text-align: center;
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .password-card-glow {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 100px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .password-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.06);
            color: var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 auto 16px auto;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
        }
        
        .password-title {
            font-size: 15px;
            font-weight: 700;
            color: #121211;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        
        .password-subtitle {
            font-size: 13px;
            color: #4a4a4d;
            line-height: 1.6;
        }
        
        .password-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        
        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(245, 245, 245, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            padding: 0 16px;
            transition: all 0.3s ease;
        }
        
        .password-input-wrapper:focus-within {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
        }
        
        .password-input-wrapper input {
            width: 100%;
            height: 48px;
            background: transparent;
            border: none;
            outline: none;
            color: #121211;
            font-size: 14px;
            padding: 0 12px;
        }
        
        .password-input-wrapper .input-icon {
            color: #8d8d92;
            font-size: 14px;
        }
        
        .password-toggle-btn {
            background: transparent;
            border: none;
            color: #8d8d92;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color 0.2s ease;
        }
        
        .password-toggle-btn:hover {
            color: #121211;
        }
        
        .password-error {
            display: none;
            color: var(--accent-red);
            font-size: 12px;
            font-weight: 500;
            padding-left: 4px;
            margin-top: 4px;
            animation: shake 0.3s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .password-submit-btn {
            height: 48px;
            background: var(--accent-red);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
        }
        
        .password-submit-btn:hover {
            transform: translateY(-2px);
            background: #d32f2f;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.35);
        }
        
        .password-submit-btn:active {
            transform: translateY(0);
        }

        /* ── 2026 Accessibility: visible keyboard focus (WCAG 2.4.7) ── */
        :focus-visible {
            outline: 2px solid var(--focus-ring) !important;
            outline-offset: 2px !important;
        }
        textarea:focus-visible,
        input:focus-visible {
            outline-offset: 0 !important;
        }
        ::selection {
            background: rgba(var(--accent-rgb), 0.28);
        }

        /* ═══════════════════════════════════════════════════════════════════
           2026 DESIGN LAYER — unified chrome surfaces, soft cards, bento tiles
           (마지막에 두어 이전의 중복 규칙들보다 우선 적용)
           ═══════════════════════════════════════════════════════════════════ */
        :root {
            --surface-chrome: rgba(25, 24, 31, 0.86);
            --radius-card: 16px;
            --radius-tile: 20px;
            --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30), 0 8px 24px rgba(0, 0, 0, 0.22);
            --shadow-card-hover: 0 2px 6px rgba(0, 0, 0, 0.35), 0 18px 40px rgba(0, 0, 0, 0.32), 0 0 0 1px rgba(var(--accent-rgb), 0.45);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }
        [data-theme="light"], body.light-theme {
            --surface-chrome: rgba(233, 230, 223, 0.88);
            --shadow-card: 0 1px 2px rgba(27, 26, 31, 0.05), 0 6px 20px rgba(27, 26, 31, 0.06);
            --shadow-card-hover: 0 2px 6px rgba(27, 26, 31, 0.08), 0 18px 40px rgba(91, 59, 240, 0.14), 0 0 0 1px rgba(var(--accent-rgb), 0.35);
        }

        /* ── Sidebar & top bars share one surface ── */
        .sidebar-panel,
        [data-theme="light"] .sidebar-panel {
            background: var(--bg-sidebar) !important;
            border-right: 1px solid var(--border-color) !important;
        }
        .landing-top-bar,
        .computer-chrome,
        [data-theme="light"] .computer-chrome {
            background: var(--surface-chrome) !important;
            border-bottom: 1px solid var(--border-color) !important;
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            box-shadow: none !important;
        }
        .computer-chrome .chrome-title-bar,
        .computer-chrome .chrome-address-bar,
        [data-theme="light"] .chrome-title-bar {
            background: transparent !important;
            border-bottom: 1px solid var(--border-color) !important;
            box-shadow: none !important;
        }
        .step-pill-group,
        [data-theme="light"] .step-pill-group {
            background: rgba(var(--surface-rgb), 0.72) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: var(--shadow-card) !important;
        }
        .btn-minimal,
        [data-theme="light"] .btn-minimal {
            background: var(--bg-card);
            border-color: var(--border-color);
        }

        /* ── Soft cards (history lists) ── */
        .history-item-card,
        .landing-history-card,
        [data-theme="light"] .history-item-card,
        [data-theme="light"] .landing-history-card {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: var(--radius-card) !important;
            box-shadow: var(--shadow-card) !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            transition: transform 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out), border-color 0.25s var(--ease-out) !important;
        }
        .history-item-card:hover, .history-item-card:focus-visible,
        .landing-history-card:hover, .landing-history-card:focus-visible,
        [data-theme="light"] .history-item-card:hover,
        [data-theme="light"] .landing-history-card:hover {
            background: var(--bg-card) !important;
            border-color: rgba(var(--accent-rgb), 0.45) !important;
            box-shadow: var(--shadow-card-hover) !important;
            transform: translateY(-2px) !important;
        }

        /* ── Prompt box follows the theme (was always white) ── */
        .manus-prompt-container,
        .manus-prompt-container .prompt-box-inner {
            background: var(--bg-card) !important;
        }
        .manus-prompt-container {
            border: 1px solid var(--border-color) !important;
            border-radius: 24px !important;
            box-shadow: var(--shadow-card) !important;
        }
        .manus-prompt-container:focus-within {
            border-color: rgba(var(--accent-rgb), 0.55) !important;
            box-shadow: var(--shadow-card), 0 0 0 4px rgba(var(--accent-rgb), 0.14) !important;
        }
        .manus-prompt-container .prompt-box-inner textarea {
            color: var(--text-primary) !important;
        }
        .manus-prompt-container .prompt-box-inner textarea::placeholder {
            color: var(--text-muted) !important;
        }

        /* ── Document viewer: paper card on the base canvas ── */
        .viewer-canvas,
        [data-theme="light"] .viewer-canvas {
            background: var(--bg-base) !important;
        }
        .viewer-canvas .document-wrapper.markdown-body,
        [data-theme="light"] .viewer-canvas .document-wrapper.markdown-body {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: var(--radius-tile) !important;
            box-shadow: var(--shadow-card) !important;
        }
        .markdown-body table,
        [data-theme="light"] .markdown-body table {
            border-collapse: separate !important;
            border-spacing: 0;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px;
            overflow: hidden;
            background: transparent !important;
        }
        .markdown-body th,
        [data-theme="light"] .markdown-body th {
            background: rgba(var(--accent-rgb), 0.07) !important;
            color: var(--text-primary) !important;
            border-bottom: 1px solid var(--border-color) !important;
        }
        .markdown-body td,
        [data-theme="light"] .markdown-body td {
            background: transparent !important;
            border-color: var(--border-color) !important;
        }
        .markdown-body tbody tr:hover td {
            background: rgba(var(--accent-rgb), 0.04) !important;
        }

        /* ── Bento tile dashboard ── */
        .tile-bento {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: minmax(200px, auto);
            gap: 16px;
            width: 100%;
        }
        .tile-card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-tile);
            box-shadow: var(--shadow-card);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out), border-color 0.25s var(--ease-out);
        }
        .tile-card.wide { grid-column: span 2; }
        .tile-card.ready::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 3px;
            background: var(--cta-gradient);
        }
        .tile-card:hover,
        .tile-card:focus-visible {
            transform: translateY(-3px);
            border-color: rgba(var(--accent-rgb), 0.45);
            box-shadow: var(--shadow-card-hover);
        }
        .tile-card.empty { opacity: 0.72; }
        .tile-head {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tile-num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
            background: var(--cta-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tile-code {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        .tile-status {
            margin-left: auto;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            color: var(--text-muted);
        }
        .tile-card.ready .tile-status {
            background: rgba(var(--success-rgb), 0.12);
            color: var(--success);
        }
        .tile-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .tile-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--accent-text);
            font-size: 17px;
        }
        .tile-title {
            font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 4px 0 0;
        }
        .tile-card.wide .tile-title { font-size: 19px; }
        .tile-snippet {
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .tile-card.wide .tile-snippet { -webkit-line-clamp: 4; }
        .tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .tile-time { font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .tile-cta {
            align-self: flex-end;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-text);
        }
        .tile-cta i { margin-left: 4px; transition: transform 0.25s var(--ease-out); }
        .tile-card:hover .tile-cta i { transform: translateX(3px); }
        @media (max-width: 1100px) {
            .tile-bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 640px) {
            .tile-bento { grid-template-columns: 1fr; }
            .tile-card.wide { grid-column: auto; }
        }

        /* ═══════════════════════════════════════════════════════════════════
           2026 MOTION LAYER — scrolltelling, micro-interactions, ripples
           이징: 콘텐츠 등장은 부드러운 감속(smooth), 버튼·아이콘은 경쾌한 반동(spring)
           transform/opacity만 애니메이션 → 레이아웃 재계산 없음
           ═══════════════════════════════════════════════════════════════════ */
        :root {
            --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --dur-fast: 160ms;
            --dur-base: 260ms;
            --dur-slow: 560ms;
        }

        /* Scroll-triggered reveal (scrolltelling) */
        .reveal-pending {
            opacity: 0;
            transform: translateY(14px);
        }
        .reveal-in {
            animation: motion-reveal-up var(--dur-slow) var(--ease-smooth) both;
            animation-delay: var(--reveal-delay, 0ms);
        }
        @keyframes motion-reveal-up {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }

        /* View transitions: landing → workspace, document switches */
        body.state-workspace .workspace-view-container {
            animation: motion-fade-in var(--dur-slow) var(--ease-smooth) backwards;
        }
        .view-enter {
            animation: motion-view-enter var(--dur-base) var(--ease-smooth) backwards;
        }
        @keyframes motion-fade-in {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes motion-view-enter {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        /* Micro-interactions: springy hover / press feedback */
        .prompt-submit-btn,
        .btn-minimal,
        .pitl-modal-btn,
        .password-submit-btn,
        .new-plan-btn,
        .pill-gate-btn,
        .suggestion-pill {
            transition: transform var(--dur-base) var(--ease-spring),
                        box-shadow var(--dur-base) var(--ease-smooth),
                        background-color var(--dur-base) ease,
                        border-color var(--dur-base) ease,
                        color var(--dur-base) ease,
                        opacity var(--dur-base) ease !important;
        }
        .prompt-submit-btn:active,
        .btn-minimal:active,
        .pitl-modal-btn:active,
        .password-submit-btn:active,
        .new-plan-btn:active,
        .pill-gate-btn:active,
        .suggestion-pill:active {
            transform: scale(0.95) !important;
            transition-duration: var(--dur-fast) !important;
        }
        .tile-icon {
            transition: transform var(--dur-base) var(--ease-spring);
        }
        .tile-card:hover .tile-icon,
        .tile-card:focus-visible .tile-icon {
            transform: translateY(-2px) rotate(-6deg) scale(1.08);
        }

        /* Button ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: currentColor;
            opacity: 0.22;
            transform: scale(0);
            animation: motion-ripple var(--dur-slow) var(--ease-smooth) forwards;
        }
        @keyframes motion-ripple {
            to { transform: scale(1); opacity: 0; }
        }

        /* Kinetic headline: slow gradient drift */
        .landing-title span {
            background-size: 200% 200% !important;
            animation: motion-gradient-drift 8s ease-in-out infinite alternate;
        }
        @keyframes motion-gradient-drift {
            from { background-position: 0% 50%; }
            to   { background-position: 100% 50%; }
        }

        /* Reading progress (scrolltelling) */
        .computer-chrome {
            position: relative;
        }
        #read-progress {
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 100%;
            height: 2px;
            background: var(--cta-gradient);
            transform: scaleX(0);
            transform-origin: 0 50%;
            transition: transform 80ms linear;
            pointer-events: none;
            z-index: 60;
        }

        @media print {
            .reveal-pending { opacity: 1 !important; transform: none !important; }
        }

        /* ═══════════════════════════════════════════════════════════════════
           2026 NEUMORPHISM LAYER (Figma 트렌드 8)
           배경과 같은 톤의 표면 + 빛(좌상단)/그림자(우하단) 이중 그림자 → 촉각적 입체감
           튀어나온 면(raised): 카드·타일·버튼 / 눌린 면(inset): 입력창·아이콘 우물·눌림 상태
           저대비 약점 보완: 1px 헤어라인 테두리와 포커스 링 유지, 주요 CTA는 그라디언트 유지
           ═══════════════════════════════════════════════════════════════════ */
        :root {
            --neu-surface: linear-gradient(145deg, #23212B 0%, #1B1A21 100%);
            --neu-raised: -5px -5px 12px rgba(255, 255, 255, 0.035), 6px 6px 16px rgba(0, 0, 0, 0.55);
            --neu-raised-hover: -7px -7px 16px rgba(255, 255, 255, 0.045), 10px 10px 24px rgba(0, 0, 0, 0.6);
            --neu-raised-sm: -2px -2px 5px rgba(255, 255, 255, 0.03), 3px 3px 7px rgba(0, 0, 0, 0.5);
            --neu-inset: inset 3px 3px 8px rgba(0, 0, 0, 0.5), inset -2px -2px 6px rgba(255, 255, 255, 0.04);
            --neu-inset-sm: inset 2px 2px 5px rgba(0, 0, 0, 0.5), inset -1px -1px 3px rgba(255, 255, 255, 0.04);
            --shadow-card: var(--neu-raised);
            --shadow-card-hover: var(--neu-raised-hover), 0 0 0 1px rgba(var(--accent-rgb), 0.40);
        }
        [data-theme="light"], body.light-theme {
            --neu-surface: linear-gradient(145deg, #F7F5F1 0%, #E9E6DF 100%);
            --neu-raised: -6px -6px 14px rgba(255, 255, 255, 0.9), 6px 6px 14px rgba(156, 153, 150, 0.38);
            --neu-raised-hover: -8px -8px 18px rgba(255, 255, 255, 0.95), 10px 10px 22px rgba(156, 153, 150, 0.45);
            --neu-raised-sm: -3px -3px 6px rgba(255, 255, 255, 0.85), 3px 3px 6px rgba(156, 153, 150, 0.35);
            --neu-inset: inset 3px 3px 7px rgba(156, 153, 150, 0.42), inset -3px -3px 7px rgba(255, 255, 255, 0.9);
            --neu-inset-sm: inset 2px 2px 4px rgba(156, 153, 150, 0.40), inset -2px -2px 4px rgba(255, 255, 255, 0.85);
            --shadow-card: var(--neu-raised);
            --shadow-card-hover: var(--neu-raised-hover), 0 0 0 1px rgba(var(--accent-rgb), 0.30);
        }

        /* Raised surfaces: same tone as the page with a soft directional gradient */
        .tile-card,
        .history-item-card,
        .landing-history-card,
        [data-theme="light"] .history-item-card,
        [data-theme="light"] .landing-history-card,
        .history-item-card:hover,
        .landing-history-card:hover,
        [data-theme="light"] .history-item-card:hover,
        [data-theme="light"] .landing-history-card:hover,
        .viewer-canvas .document-wrapper.markdown-body,
        [data-theme="light"] .viewer-canvas .document-wrapper.markdown-body,
        .step-pill-group,
        [data-theme="light"] .step-pill-group {
            background: var(--neu-surface) !important;
        }

        /* Pressed state: cards sink into the surface */
        .tile-card:active,
        .history-item-card:active,
        .landing-history-card:active {
            box-shadow: var(--neu-inset) !important;
            transform: none !important;
        }

        /* Small controls: raised, pressed = inset */
        .btn-minimal,
        [data-theme="light"] .btn-minimal,
        .new-plan-btn {
            background: var(--neu-surface) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: var(--neu-raised-sm) !important;
        }
        .btn-minimal:active,
        [data-theme="light"] .btn-minimal:active,
        .new-plan-btn:active {
            box-shadow: var(--neu-inset-sm) !important;
        }

        /* Wells: inputs are carved into the surface */
        .manus-prompt-container,
        [data-theme="light"] .manus-prompt-container {
            background: var(--bg-card) !important;
            box-shadow: var(--neu-inset-sm), var(--neu-raised-sm) !important;
        }
        .manus-prompt-container .prompt-box-inner {
            background: transparent !important;
        }
        .manus-prompt-container:focus-within {
            box-shadow: var(--neu-inset-sm), 0 0 0 3px rgba(var(--accent-rgb), 0.22) !important;
        }
        .chrome-url-box,
        [data-theme="light"] .chrome-url-box {
            background: var(--bg-sidebar) !important;
            box-shadow: var(--neu-inset-sm) !important;
        }
        .tile-icon {
            box-shadow: var(--neu-inset-sm);
        }
        .tile-status {
            box-shadow: var(--neu-inset-sm);
        }

        /* ═══════════════════════════════════════════════════════════════════
           2026 RETROFUTURISM LAYER (Figma 트렌드 9)
           과거가 그린 미래: 크롬 질감 헤드라인,
           미래지향 디스플레이 글꼴, 네온 악센트(다크 전용), 픽셀 분할 진행 바
           ═══════════════════════════════════════════════════════════════════ */
        :root {
            --font-future: 'Unbounded', 'Space Grotesk', 'Noto Sans KR', sans-serif;
            --chrome-text: linear-gradient(180deg, #FFFFFF 0%, #DCD8E4 44%, #8E8A99 52%, #F0EEE9 62%, #FFFFFF 100%);
            --neon-glow: 0 0 10px rgba(var(--accent-rgb), 0.55);
        }
        [data-theme="light"], body.light-theme {
            --chrome-text: linear-gradient(180deg, #1B1A1F 0%, #3A3742 44%, #6A6672 52%, #2A2830 62%, #1B1A1F 100%);
            --neon-glow: none;
        }

        /* Chrome-textured headline + futuristic display face */
        .landing-title {
            background: var(--chrome-text);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: none !important;
        }
        .landing-title span {
            font-family: var(--font-future);
            font-weight: 700;
            letter-spacing: -1px;
        }
        body.dark-theme .landing-title {
            filter: drop-shadow(0 0 22px rgba(139, 108, 255, 0.28));
        }
        .badge-tag,
        .tile-num,
        .tile-code {
            font-family: var(--font-future) !important;
        }
        .tile-num {
            letter-spacing: -0.5px;
        }

        /* Neon accents (dark only — --neon-glow is none in light) */
        .badge-tag {
            text-shadow: var(--neon-glow);
        }
        body.dark-theme .badge-tag {
            border-color: rgba(var(--accent-rgb), 0.55) !important;
            box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.25), inset 0 0 10px rgba(var(--accent-rgb), 0.12);
        }
        body.dark-theme .tile-num {
            filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.55));
        }
        body.dark-theme .prompt-submit-btn,
        body.dark-theme .tile-card.ready::before {
            box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.55), 0 0 24px rgba(var(--accent-2-rgb), 0.25);
        }

        /* Pixel motif: LED-segmented reading progress bar */
        #read-progress {
            height: 3px;
            -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 8px);
            mask-image: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 8px);
        }
        body.dark-theme #read-progress {
            filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.8));
        }

        /* ═══════════════════════════════════════════════════════════════════
           FRAMEWORK VISUALIZATIONS (3C · SWOT/TOWS · STP · MECE/RICE)
           팔레트는 validate_palette.js로 검증: 카테고리 4색(인접 CVD ΔE ≥ 8.4),
           서열 램프 5단계(단일 색상, 밝은 끝 ≥ 2:1), 칸 라벨 대비 ≥ 4.5:1
           ═══════════════════════════════════════════════════════════════════ */
        :root {
            --viz-surface: #1F1D26;
            --viz-1: #8B6CFF;
            --viz-2: #d95926;
            --viz-3: #199e70;
            --viz-4: #c98500;
            --viz-muted: #77727F;
            --viz-grid: #2E2B36;
            --viz-axis: #4A4654;
            --viz-seq-1: #4F3FAE; --viz-seq-1-ink: #FFFFFF;
            --viz-seq-2: #5F4AD6; --viz-seq-2-ink: #FFFFFF;
            --viz-seq-3: #8D78FB; --viz-seq-3-ink: #1B1A1F;
            --viz-seq-4: #AE9EFF; --viz-seq-4-ink: #1B1A1F;
            --viz-seq-5: #D2C8FF; --viz-seq-5-ink: #1B1A1F;
        }
        [data-theme="light"], body.light-theme {
            --viz-surface: #FAF9F6;
            --viz-1: #5B3BF0;
            --viz-2: #eb6834;
            --viz-3: #1baf7a;
            --viz-4: #eda100;
            --viz-muted: #8A8590;
            --viz-grid: #E6E3DC;
            --viz-axis: #C9C5BC;
            --viz-seq-1: #B0A0FF; --viz-seq-1-ink: #1B1A1F;
            --viz-seq-2: #8C72FC; --viz-seq-2-ink: #1B1A1F;
            --viz-seq-3: #5B3BF0; --viz-seq-3-ink: #FFFFFF;
            --viz-seq-4: #4526C9; --viz-seq-4-ink: #FFFFFF;
            --viz-seq-5: #2F178F; --viz-seq-5-ink: #FFFFFF;
        }

        .viz-panel {
            margin: 8px 0 36px;
        }
        .viz-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--accent-text);
            margin-bottom: 12px;
        }
        .viz-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .viz-card {
            margin: 0;
            padding: 18px 20px 20px;
            background: var(--viz-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--neu-inset-sm, none);
            min-width: 0;
        }
        .viz-card.wide { grid-column: 1 / -1; }
        .viz-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .markdown-body .viz-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            border: none;
        }
        .markdown-body .viz-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 4px 0 0;
        }
        .viz-table-toggle {
            flex-shrink: 0;
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .viz-table-toggle:hover { color: var(--text-primary); border-color: rgba(var(--accent-rgb), 0.45); }
        .viz-table { margin-top: 14px; overflow-x: auto; }
        .viz-table table { font-size: 12.5px; font-variant-numeric: tabular-nums; }

        /* SVG chrome: recessive hairlines, text in text tokens (never the series color) */
        .viz-svg { width: 100%; height: auto; display: block; overflow: visible; }
        .viz-square { max-width: 420px; margin: 0 auto; }
        .viz-svg .viz-gridline { stroke: var(--viz-grid); stroke-width: 1; }
        .viz-svg .viz-axis { stroke: var(--viz-axis); stroke-width: 1; }
        .viz-svg text { font-family: 'Noto Sans KR', 'Space Grotesk', sans-serif; }
        .viz-svg .viz-tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
        .viz-svg .viz-label { fill: var(--text-secondary); font-size: 11.5px; }
        .viz-svg .viz-label-strong { fill: var(--text-primary); font-size: 12.5px; font-weight: 700; }
        .viz-svg .viz-axis-title { fill: var(--text-secondary); font-size: 11.5px; font-weight: 600; }
        .viz-svg .viz-quad-label { fill: var(--text-muted); font-size: 11px; font-weight: 600; }
        .viz-mark { cursor: default; outline: none; }
        .viz-mark:focus-visible circle:nth-child(2) { stroke: var(--focus-ring); stroke-width: 3; }

        .viz-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; font-size: 12px; color: var(--text-secondary); }
        .viz-legend-item { display: inline-flex; align-items: center; gap: 6px; }
        .viz-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

        /* 3C */
        .viz-3c { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 20px; align-items: center; }
        .viz-3c-lists { display: grid; gap: 12px; }
        .viz-3c-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-primary); }
        .markdown-body .viz-3c ul, .markdown-body .viz-quad ul { margin: 6px 0 0; padding-left: 18px; }
        .markdown-body .viz-3c li, .markdown-body .viz-quad li { font-size: 12.5px; color: var(--text-secondary); margin: 2px 0; }

        .viz-heat { display: grid; gap: 2px; overflow-x: auto; }
        .viz-heat-row { display: grid; grid-template-columns: minmax(110px, 1.2fr) repeat(var(--cols), minmax(64px, 1fr)); gap: 2px; align-items: stretch; }
        .viz-heat-header span { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); padding: 4px 6px; text-align: center; }
        .viz-heat-name { font-size: 12.5px; color: var(--text-secondary); padding: 8px 6px; display: flex; align-items: center; }
        .viz-heat-row.self .viz-heat-name { color: var(--text-primary); font-weight: 700; }
        .viz-heat-row.self .viz-heat-name::before { content: '★'; color: var(--accent-text); margin-right: 4px; }
        .viz-heat-cell { display: flex; align-items: center; justify-content: center; min-height: 36px; border-radius: 6px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; }
        .viz-heat-cell:focus-visible { box-shadow: 0 0 0 2px var(--viz-surface), 0 0 0 4px var(--focus-ring); }
        .viz-heat-scale { display: flex; align-items: center; gap: 2px; justify-content: flex-end; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
        .viz-heat-scale i { width: 22px; height: 10px; border-radius: 3px; }
        .viz-heat-scale span { margin: 0 6px; }

        /* SWOT / TOWS 2×2 */
        .viz-2x2 { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; }
        .viz-axis-head { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-align: center; align-self: end; }
        .viz-axis-side { writing-mode: vertical-rl; text-orientation: upright; align-self: center; text-align: center; letter-spacing: 2px; }
        .viz-quad { padding: 12px 14px; border-radius: 12px; background: var(--bg-base); border: 1px solid var(--border-color); min-width: 0; }
        .viz-quad-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
        .viz-quad-head b { color: var(--text-primary); font-size: 13.5px; }
        .markdown-body .viz-tows-cell p { font-size: 12.5px; color: var(--text-primary); margin: 8px 0 6px; line-height: 1.55; }
        .viz-priority { margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
        .viz-meta { font-size: 11px; color: var(--text-muted); }

        /* STP stat tiles */
        .viz-stats { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
        .viz-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .viz-stat { flex: 1 1 120px; display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 12px; background: var(--bg-base); border: 1px solid var(--border-color); }
        .viz-stat-key { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); }
        .viz-stat-value { font-size: 24px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
        .viz-stat-value small { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-left: 3px; }
        .viz-stat-label { font-size: 11.5px; color: var(--text-secondary); }
        .viz-funnel-arrow { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 16px; }
        .viz-funnel-arrow small { font-size: 10.5px; font-variant-numeric: tabular-nums; }

        /* MECE tree */
        .viz-tree { display: flex; flex-direction: column; align-items: center; gap: 18px; overflow-x: auto; }
        .viz-tree-root { padding: 8px 18px; border-radius: 999px; background: var(--cta-gradient); color: #fff; font-size: 13px; font-weight: 700; position: relative; }
        .viz-tree-root::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 18px; background: var(--viz-axis); }
        .viz-tree-branches { display: grid; grid-template-columns: repeat(var(--n), minmax(140px, 1fr)); gap: 10px; width: 100%; position: relative; padding-top: 14px; border-top: 1px solid var(--viz-axis); }
        .viz-tree-branch { display: flex; flex-direction: column; gap: 6px; position: relative; }
        .viz-tree-branch::before { content: ''; position: absolute; left: 50%; top: -14px; width: 1px; height: 14px; background: var(--viz-axis); }
        .viz-tree-domain { padding: 8px 10px; border-radius: 10px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--text-primary); background: rgba(var(--accent-rgb), 0.10); border: 1px solid rgba(var(--accent-rgb), 0.35); }
        .viz-tree-leaf { padding: 6px 10px; border-radius: 8px; font-size: 12px; color: var(--text-secondary); background: var(--bg-base); border: 1px solid var(--border-color); }

        /* RICE bars: ≤ 24px thick, 4px rounded data end, square at the baseline */
        .viz-bars { display: flex; flex-direction: column; gap: 8px; }
        .viz-bar-row { display: grid; grid-template-columns: minmax(120px, 40%) 1fr; gap: 10px; align-items: center; padding: 2px 0; border-radius: 6px; outline: none; }
        .viz-bar-row:hover, .viz-bar-row:focus-visible { background: rgba(var(--accent-rgb), 0.06); }
        .viz-bar-label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .viz-bar-label b { color: var(--text-primary); margin-right: 4px; }
        .viz-bar-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .viz-bar { display: block; height: 18px; border-radius: 0 4px 4px 0; }
        .viz-bar-value { font-size: 12px; font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

        .viz-empty { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-radius: 16px; border: 1px dashed rgba(var(--accent-rgb), 0.45); background: rgba(var(--accent-rgb), 0.04); }
        .markdown-body .viz-empty p { margin: 4px 0 0; font-size: 13px; color: var(--text-secondary); }

        #viz-tooltip {
            position: fixed;
            z-index: 10050;
            max-width: 280px;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-line;
            pointer-events: none;
        }

        @media (max-width: 900px) {
            .viz-grid { grid-template-columns: 1fr; }
            .viz-3c { grid-template-columns: 1fr; }
        }

        /* ── Run option: mid-review switch (landing) ── */
        .run-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 14px auto 0;
            max-width: 800px;
            width: 100%;
        }
        .review-toggle {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px 8px 10px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--neu-surface, var(--bg-card));
            box-shadow: var(--neu-raised-sm, none);
            color: var(--text-secondary);
            cursor: pointer;
            text-align: left;
            font: inherit;
        }
        .review-toggle:hover { border-color: rgba(var(--accent-rgb), 0.45); }
        .review-toggle-track {
            position: relative;
            flex-shrink: 0;
            width: 40px;
            height: 22px;
            border-radius: 999px;
            background: var(--bg-base);
            box-shadow: var(--neu-inset-sm, inset 0 0 0 1px var(--border-color));
            transition: background 0.25s var(--ease-smooth, ease);
        }
        .review-toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: transform 0.25s var(--ease-spring, ease), background 0.25s ease;
        }
        .review-toggle[aria-checked="true"] .review-toggle-track { background: var(--cta-gradient); box-shadow: none; }
        .review-toggle[aria-checked="true"] .review-toggle-thumb { transform: translateX(18px); background: #ffffff; }
        .review-toggle-text { display: flex; flex-direction: column; gap: 1px; line-height: 1.35; }
        .review-toggle-text b { font-size: 13px; color: var(--text-primary); }
        .review-toggle-text small { font-size: 11.5px; color: var(--text-secondary); }
        /* Fixed equal columns: ON/OFF copy changes length, so pills must not resize or shift */
        .run-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .review-toggle { width: 100%; min-width: 0; }
        .review-toggle-text { min-width: 0; }
        .review-toggle-text b,
        .review-toggle-text small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .review-toggle:active { transform: none !important; }
        @media (max-width: 640px) {
            .run-options { grid-template-columns: minmax(0, 1fr); }
        }

        /* ── Landing prompt: no focus outline, centered START button ── */
        #idea-textarea:focus,
        #idea-textarea:focus-visible {
            outline: none !important;
        }
        .manus-prompt-container:focus-within {
            border-color: var(--border-color) !important;
            box-shadow: var(--neu-inset-sm), var(--neu-raised-sm) !important;
        }
        .manus-prompt-container:focus-within::before { opacity: 0 !important; }
        .manus-prompt-container .prompt-box-inner {
            flex-direction: column;
            align-items: stretch;
        }
        .manus-prompt-container .prompt-submit-btn {
            align-self: center;
            width: auto;
            height: 40px;
            padding: 0 28px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        /* ── Landing title: two lines fitted to the same width (see fitLandingTitle) ── */
        .landing-title .title-pitl,
        .landing-title .title-full {
            display: block;
            width: fit-content;
            margin: 0 auto;
            white-space: nowrap;
            line-height: 1.05;
            letter-spacing: -0.03em !important; /* em so spacing scales with the fitted size */
        }
        .landing-title .title-full {
            background: none !important;
            -webkit-text-fill-color: inherit;
            animation: none;
            font-family: inherit;
            font-weight: 800;
        }

        /* ── Light theme fixes (code blocks, completed step circles) ── */
        [data-theme="light"] .markdown-body pre {
            background: rgba(var(--hairline-rgb), 0.05) !important;
            border-color: var(--border-color) !important;
            box-shadow: none;
            color: var(--text-primary);
        }
        [data-theme="light"] .markdown-body pre code {
            color: var(--text-primary) !important;
        }
        [data-theme="light"] .circle-tab-item.completed .node-percent {
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        /* Tile dashboard: no paper panel in either theme */
        .document-wrapper.tile-dashboard-wrapper,
        [data-theme="light"] .document-wrapper.tile-dashboard-wrapper {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* ── Landing history: one step smaller type ── */
        .landing-history-section .section-divider-title { font-size: 14px; }
        .landing-history-card .landing-card-title { font-size: 14px; }
        .landing-history-card .landing-card-idea { font-size: 11px !important; }
        .landing-history-card .landing-card-footer,
        .landing-history-card .landing-card-badge { font-size: 14px; }

        /* ── Pipeline timing: per-step durations & totals ── */
        .circle-tab-time {
            display: block;
            min-height: 12px;
            margin-top: 1px;
            font-size: 9.5px;
            font-weight: 600;
            line-height: 12px;
            color: var(--text-muted);
            text-align: center;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .circle-tab-item.active .circle-tab-time { color: var(--accent-text); }
        /* 소요시간 줄이 생긴 만큼 상단 단계 바 높이를 내용에 맞춘다 (원형 노드 상단 잘림 방지) */
        .computer-chrome .chrome-title-bar {
            height: auto !important;
            min-height: 96px;
            padding-top: 8px !important;
            padding-bottom: 6px !important;
        }
        .timing-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--text-secondary);
        }
        .timing-stats b {
            color: var(--text-primary);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-left: 4px;
        }

        /* ── Archive publish bar (tile dashboard) ── */
        .archive-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 0 16px;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            font-size: 13px;
            color: var(--text-secondary);
        }
        .archive-bar i { color: var(--accent-text); margin-right: 4px; }
        .archive-bar a { color: var(--accent-text); font-weight: 600; }
    
        /* ── 구조화 입력 칩 ── */
        .prompt-slots { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 12px 28px 14px; border-top: 1px solid rgba(var(--hairline-rgb), .08); margin: 0; }
        .slot-chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .slot-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px dashed rgba(var(--hairline-rgb), .25); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 12.5px; line-height: 1.4; background: transparent; color: var(--text-secondary); cursor: pointer; transition: all .2s; font-family: inherit; }
        .slot-chip .slot-dot { width: 14px; height: 14px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid rgba(var(--hairline-rgb), .35); display: grid; place-items: center; font-size: 9px; line-height: 1; color: transparent; }
        .slot-chip.filled { border-style: solid; border-color: rgba(var(--accent-rgb), .45); background: rgba(var(--accent-rgb), .08); color: var(--text-primary); }
        .slot-chip.filled .slot-dot { background: rgb(var(--accent-rgb)); border-color: rgb(var(--accent-rgb)); color: #fff; }
        .slot-status { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .slot-meter { display: inline-flex; gap: 3px; flex-shrink: 0; }
        .slot-meter i { width: 14px; height: 4px; border-radius: 2px; background: rgba(var(--hairline-rgb), .12); transition: background .2s; }
        .slot-meter i.on { background: rgb(var(--accent-rgb)); }
        .slot-nudge { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
        @media (max-width: 640px) { .prompt-slots { padding: 10px 16px 12px; } .slot-status { width: 100%; } }
        .slot-nudge.warn { color: var(--accent-amber); }

        /* ── 빈 상태 시작 카드 ── */
        .landing-history-empty.starter-empty { flex-direction: column; text-align: center; gap: 6px; padding: 12px 0 8px; width: 100%; border: none; }
        .landing-history-grid:has(.starter-empty) { width: 100%; }
        .landing-history-marquee-wrapper:has(.starter-empty) { mask-image: none; -webkit-mask-image: none; }
        .starter-glyph { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: rgba(var(--accent-rgb), .10); color: rgb(var(--accent-rgb)); font-size: 22px; margin-bottom: 4px; }
        .starter-title { font-size: 15px; color: var(--text-primary); }
        .starter-desc { font-size: 12.5px; color: var(--text-secondary); max-width: 420px; margin-bottom: 8px; }
        .starter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; width: 100%; max-width: 720px; }
        .starter-card { border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; transition: transform .2s, border-color .2s; font-family: inherit; color: var(--text-primary); }
        .starter-card:hover { transform: translateY(-2px); border-color: rgba(var(--accent-rgb), .5); }
        .starter-card b { display: block; font-size: 13.5px; margin-bottom: 3px; }
        .starter-card span { display: block; font-size: 12px; color: var(--text-secondary); }
        .starter-card em { display: block; margin-top: 6px; font-style: normal; font-size: 11.5px; color: var(--accent-text); font-weight: 700; }

        /* ── 진행 스트림 ── */
        .document-wrapper.run-stream-wrapper { background: transparent !important; border: none !important; box-shadow: none !important; padding: 32px 20px; display: flex; justify-content: center; }
        .run-stream { width: 100%; max-width: 920px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-card); }
        @media (max-width: 760px) { .run-stream { grid-template-columns: 1fr; } }
        .run-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; align-content: start; }
        .run-step { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; font-size: 13px; color: var(--text-secondary); opacity: .7; }
        .run-step-ic { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(var(--hairline-rgb), .25); display: grid; place-items: center; font-size: 9px; }
        .run-step-t { font-size: 11.5px; font-variant-numeric: tabular-nums; }
        .run-step.done { opacity: 1; }
        .run-step.done .run-step-ic { background: #10b981; border-color: #10b981; color: #fff; }
        .run-step.active { opacity: 1; color: var(--text-primary); background: rgba(var(--accent-rgb), .08); font-weight: 600; }
        .run-step.active .run-step-ic { border-color: rgb(var(--accent-rgb)); border-top-color: transparent; animation: runSpin .9s linear infinite; }
        .run-step.gate .run-step-ic { border-style: dashed; }
        .run-step.waiting { opacity: 1; color: var(--accent-amber); background: rgba(245, 158, 11, .10); font-weight: 600; }
        .run-step.waiting .run-step-ic { border-color: var(--accent-amber); }
        @keyframes runSpin { to { transform: rotate(360deg); } }
        .run-main { min-width: 0; display: grid; gap: 14px; align-content: start; }
        .run-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .run-heading { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--text-primary); min-width: 0; }
        .run-percent { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 800; color: var(--accent-text); font-variant-numeric: tabular-nums; }
        .run-pulse { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--accent-rgb)); flex-shrink: 0; animation: runPulse 1.6s infinite; }
        @keyframes runPulse { 0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .5); } 70% { box-shadow: 0 0 0 8px rgba(var(--accent-rgb), 0); } 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); } }
        .run-track { height: 6px !important; border-radius: 3px; overflow: hidden; }
        .run-track > div { height: 100%; background: linear-gradient(90deg, var(--accent-neon), var(--accent-blue, #3b82f6)); border-radius: 3px; transition: width .4s ease; }
        .run-stream .timing-stats { margin: 0; justify-content: flex-start; }
        .run-thinking { font-size: 13px; color: var(--text-secondary); display: grid; gap: 4px; min-height: 72px; }
        .run-thinking div { animation: runFadeUp .35s ease both; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .run-thinking div::before { content: '›'; color: rgb(var(--accent-rgb)); margin-right: 8px; font-weight: 700; }
        @keyframes runFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        .run-preview { border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; background: rgba(var(--hairline-rgb), .02); }
        .run-preview-head { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .run-caret { display: inline-block; width: 7px; height: 14px; background: rgb(var(--accent-rgb)); animation: runBlink 1s step-end infinite; }
        @keyframes runBlink { 50% { opacity: 0; } }
        .run-sk { height: 10px; border-radius: 5px; margin: 9px 0; background: linear-gradient(90deg, rgba(var(--hairline-rgb), .06) 0%, rgba(var(--hairline-rgb), .14) 50%, rgba(var(--hairline-rgb), .06) 100%); background-size: 200% 100%; animation: runShimmer 1.4s linear infinite; }
        @keyframes runShimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        /* ── 중간 검토 체크포인트 ── */
        .gate-checkpoint { width: 100%; max-width: 860px; border: 1px solid rgba(245, 158, 11, .45); background: var(--bg-card); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-card); animation: runFadeUp .3s ease both; }
        .gate-cp-badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent-amber); background: rgba(245, 158, 11, .12); border-radius: 999px; padding: 3px 10px; margin-bottom: 10px; }
        .gate-cp-head h3 { font-size: 18px; color: var(--text-primary); margin: 0 0 6px; border: none; padding: 0; }
        .gate-cp-head p { font-size: 13.5px; color: var(--text-secondary); margin: 0 0 16px; }
        .gate-cp-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 18px; }
        .gate-cp-item { text-align: left; border: 1px solid var(--border-color); background: rgba(var(--hairline-rgb), .02); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-family: inherit; color: var(--text-secondary); font-size: 12px; line-height: 1.5; transition: border-color .2s; }
        .gate-cp-item:hover { border-color: rgba(var(--accent-rgb), .5); }
        .gate-cp-item b { display: block; color: var(--text-primary); font-size: 13px; margin-bottom: 2px; }
        .gate-cp-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .gate-cp-btn { border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .gate-cp-btn:hover { border-color: rgba(var(--accent-rgb), .5); }
        .gate-cp-btn.primary { background: var(--cta-gradient, rgb(var(--accent-rgb))); color: #fff; border: 0; }
        .gate-cp-btn.ghost { color: var(--text-secondary); }
        .gate-cp-edit { display: none; margin-top: 12px; gap: 8px; flex-direction: column; align-items: flex-start; }
        .gate-cp-edit.show { display: flex; }
        .gate-cp-edit textarea { width: 100%; min-height: 72px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(var(--hairline-rgb), .03); color: var(--text-primary); padding: 10px 12px; font-family: inherit; font-size: 13.5px; resize: vertical; outline: none; }

        .gate-cp-edit textarea:focus, .gate-cp-edit textarea:focus-visible { outline: none !important; border-color: rgba(var(--hairline-rgb), .3) !important; box-shadow: none !important; }
        /* ── 상태 알약 (반투명 유리) ── */
        .status-pill { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 12px); width: min(400px, calc(100vw - 32px)); z-index: 900; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
                       background: color-mix(in srgb, var(--bg-card) 72%, transparent); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
                       border: 1px solid var(--border-color); border-radius: 22px; box-shadow: var(--shadow-card), 0 8px 30px rgba(0, 0, 0, .12); padding: 10px 14px; }
        .status-pill.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
        .status-pill-row { display: flex; align-items: center; gap: 10px; border: 0; background: none; width: 100%; padding: 0; text-align: left; cursor: pointer; color: var(--text-primary); font-family: inherit; }
        .status-pill-txt { flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-pill-txt small { color: var(--text-secondary); font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; }
        .status-pill-ring { width: 26px; height: 26px; flex-shrink: 0; }
        .status-pill-ring circle { fill: none; stroke-width: 3; transition: stroke-dashoffset .4s; }
        .status-pill-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
        .status-pill.open .status-pill-more { grid-template-rows: 1fr; }
        .status-pill-more > div { overflow: hidden; }
        .status-pill-more ul { list-style: none; padding: 10px 0 4px; margin: 0; display: grid; gap: 4px; font-size: 12.5px; color: var(--text-secondary); }
        .status-pill-more li { display: flex; justify-content: space-between; }
        .status-pill-more li.cur { color: var(--text-primary); font-weight: 600; }
        .status-pill-open { margin: 6px 0 2px; width: 100%; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); border-radius: 999px; padding: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
        @media (prefers-reduced-motion: reduce) { .run-stream *, .gate-checkpoint, .status-pill, .run-sk, .run-pulse { animation: none !important; transition: none !important; } }

        /* ══ 리디자인: 제목 영역 · 파이프라인 레일 ══ */

        .plan-title { font-family: 'Noto Sans KR', sans-serif !important; font-weight: 800; font-size: clamp(22px, 2.4vw, 32px); letter-spacing: -0.03em; line-height: 1.2; margin: 2px 0 8px; color: var(--text-primary); border: none; padding: 0; background: none; -webkit-text-fill-color: currentColor; }

        #circle-tabs-bar.pipeline-rail { display: grid !important; grid-template-columns: minmax(0, 5fr) 72px minmax(0, 4fr); gap: 12px; align-items: end; height: auto !important; padding: 12px 16px 10px !important; border: 1px solid var(--border-color); border-radius: 16px; background: var(--bg-card); overflow-x: auto; }

        .rail-phase-h { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--text-secondary); margin-bottom: 8px; }
        .rail-steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
        #circle-tabs-bar.pipeline-rail .circle-tab-item { all: unset; box-sizing: border-box; display: grid; gap: 4px; min-width: 0; cursor: pointer; color: var(--text-secondary); font-family: inherit; }
        #circle-tabs-bar.pipeline-rail .circle-tab-item.disabled { cursor: default; opacity: .55; }
        #circle-tabs-bar.pipeline-rail .circle-tab-item:focus-visible { outline: 2px solid rgb(var(--accent-rgb)); outline-offset: 3px; border-radius: 4px; }
        .rail-bar { display: block; height: 4px; border-radius: 2px; background: rgba(var(--hairline-rgb), .10); overflow: hidden; }
        #circle-tabs-bar .rail-bar .node-liquid { all: unset; display: block; height: 100%; width: 0; border-radius: 2px; background: rgb(var(--accent-rgb)); transition: width .4s ease; }

        #circle-tabs-bar .circle-tab-item.pending .rail-bar .node-liquid { width: 0 !important; }
        #circle-tabs-bar.pipeline-rail .circle-tab-label { all: unset; display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; }
        #circle-tabs-bar.pipeline-rail .rail-sub { display: flex; gap: 6px; min-height: 16px; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; overflow: hidden; }
        #circle-tabs-bar.pipeline-rail .node-percent { all: unset; font-weight: 700; color: var(--text-primary); }
        #circle-tabs-bar.pipeline-rail .circle-tab-time { all: unset; }

        #circle-tabs-bar.pipeline-rail .circle-tab-item.pending .node-percent,
        #circle-tabs-bar #nav-gate50 .node-percent { display: none; }
        #circle-tabs-bar #nav-gate50.waiting .circle-tab-label { color: var(--accent-amber); }
        #circle-tabs-bar.pipeline-rail .circle-tab-item.completed { color: var(--text-primary); }
        #circle-tabs-bar.pipeline-rail .circle-tab-item.completed:hover .circle-tab-label { text-decoration: underline; text-underline-offset: 3px; }

        #nav-gate50.completed .rail-dia { border: 1.5px solid #10b981; background: #10b981; }

        #nav-gate50.waiting .rail-dia { border: 1.5px solid var(--accent-amber); background: rgba(245, 158, 11, .2); animation: railBreathe 1.6s ease-in-out infinite; }
        @keyframes railBreathe { 50% { transform: rotate(45deg) scale(1.18); } }

        /* ══ 진행 화면 벤토 ══ */
        .document-wrapper.run-stream-wrapper:has(.run-bento) { padding: 20px 28px !important; }
        .run-bento { width: 100%; max-width: 1180px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
        .run-tile { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 18px 20px; min-width: 0; box-shadow: var(--shadow-card); animation: runFadeUp .35s ease both; }
        .run-tile-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .05em; color: var(--text-secondary); margin-bottom: 12px; }
        .run-writer { grid-column: span 7; grid-row: span 2; display: flex; flex-direction: column; }
        .run-stat, .run-agents { grid-column: span 5; }
        .run-activity { grid-column: span 12; }
        @media (max-width: 1100px) { .run-bento > * { grid-column: span 12 !important; grid-row: auto !important; } }
        .run-paper { flex: 1; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 18px; background: rgba(var(--hairline-rgb), .02); min-height: 260px; }
        .run-sk-h { height: 12px !important; margin-top: 18px !important; background: linear-gradient(90deg, rgba(var(--hairline-rgb), .12) 0%, rgba(var(--hairline-rgb), .22) 50%, rgba(var(--hairline-rgb), .12) 100%) !important; background-size: 200% 100% !important; }
        .run-who { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--text-secondary); }
        .run-av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font: 800 10px 'Space Grotesk', sans-serif; flex-shrink: 0; }
        .run-av-sys { background: rgba(var(--hairline-rgb), .18); color: var(--text-secondary); }
        .run-big { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(64px, 7vw, 100px); line-height: .9; letter-spacing: -0.05em; color: var(--text-primary); font-variant-numeric: tabular-nums; }
        .run-stat-sub { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 12.5px; color: var(--text-secondary); }
        .run-stat-sub b { display: block; font: 700 16px 'Space Grotesk', 'Noto Sans KR', sans-serif; color: var(--text-primary); }
        .run-mini { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin-top: 16px; }
        .run-mini i { height: 20px; border-radius: 4px; background: rgba(var(--hairline-rgb), .08); position: relative; overflow: hidden; }
        .run-mini i b { position: absolute; inset: 0 auto 0 0; width: 0; background: rgb(var(--accent-rgb)); transition: width .4s ease; }
        .run-mini i.done b { width: 100% !important; background: #10b981; }
        .run-flow { display: flex; align-items: flex-start; }
        .run-agent { flex: 1; min-width: 0; display: grid; justify-items: center; text-align: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
        .run-agent b { color: var(--text-secondary); font-size: 12.5px; }
        .run-agent small { font-size: 11px; line-height: 1.4; }
        .run-node { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font: 800 15px 'Space Grotesk', sans-serif; color: var(--text-secondary); background: rgba(var(--hairline-rgb), .04); border: 1px solid var(--border-color); transition: all .3s; }
        .run-agent.on .run-node { color: #fff; background: var(--c); border-color: var(--c); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 18%, transparent), 0 8px 22px color-mix(in srgb, var(--c) 35%, transparent); }
        .run-agent.on b { color: var(--text-primary); }
        .run-agent.done .run-node { color: var(--c); border-color: color-mix(in srgb, var(--c) 50%, transparent); }
        .run-link { flex: 0 0 16px; height: 0; margin-top: 21px; border-top: 1.5px dashed rgba(var(--hairline-rgb), .2); }
        .run-link.on { border-top-color: rgb(var(--accent-rgb)); }
        .run-feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
        .run-feed li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; font-size: 13px; color: var(--text-secondary); animation: runFadeUp .35s ease both; }
        .run-feed-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .run-feed-t { font-size: 11px; font-variant-numeric: tabular-nums; }

        /* ══ 사이드바 기록: 두 줄 행 ══ */
        .history-group { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--text-secondary); padding: 12px 10px 4px; }
        .history-item-card.history-row { display: flex !important; flex-direction: row !important; align-items: center; gap: 8px; padding: 8px 10px !important; margin: 0 0 2px !important; border-radius: 10px !important; border: 1px solid transparent !important; background: transparent !important; box-shadow: none !important; transform: none !important; min-height: 0 !important; }
        .history-item-card.history-row:hover { background: rgba(var(--hairline-rgb), .05) !important; }
        .history-row-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
        .history-row-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-row-meta { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-row .btn-delete-history { opacity: 0; transition: opacity .15s; }
        .history-row:hover .btn-delete-history, .history-row .btn-delete-history:focus-visible { opacity: 1; }

        /* ══ 완료 대시보드 숫자 줄 ══ */
        .dash-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
        @media (max-width: 760px) { .dash-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .dash-stat-v { font: 700 clamp(26px, 3vw, 40px)/1.05 'Space Grotesk', 'Noto Sans KR', sans-serif; letter-spacing: -0.03em; color: var(--text-primary); }
        .dash-stat-v sup { font-size: .45em; color: var(--text-secondary); margin-left: 2px; vertical-align: top; }
        .dash-stat-v.good { color: #10b981; }
        .dash-stat-k { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; }
        @media (prefers-reduced-motion: reduce) { .run-tile, .run-feed li, #nav-gate50 .rail-dia { animation: none !important; } }

        /* ══ 사이드바: 새 기획 · 검색 · 현재/실행 중 행 ══ */
        .sidebar-panel .new-plan-btn { background: var(--text-primary) !important; color: var(--bg-base) !important; border: 0 !important; box-shadow: none !important; justify-content: space-between !important; padding: 10px 14px !important; border-radius: 12px !important; font-size: 14px !important; font-weight: 700; }

        .history-search { display: block; width: 100%; box-sizing: border-box; margin: 10px 0 4px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); font: 13px 'Noto Sans KR', sans-serif; outline: none; }
        .history-search:focus { border-color: rgba(var(--hairline-rgb), .3); }
