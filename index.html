            border: none;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .wf-tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .wf-tab-btn.active {
            background: var(--text-primary);
            color: var(--bg-base);
            font-weight: 600;
        }

        /* ── Device Mockup Frame & Prototype Viewer System ── */
        .prototype-stage-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-base);
            overflow: hidden;
        }

        .prototype-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 10;
            gap: 12px;
        }

        .device-switcher-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 3px;
            gap: 3px;
        }

        [data-theme="light"] .device-switcher-group {
            background: rgba(0, 0, 0, 0.04);
        }

        .device-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .device-btn:hover {
            color: var(--text-primary);
        }

        .device-btn.active {
            background: var(--sb-accent);
            color: #ffffff !important;
            box-shadow: 0 2px 8px rgba(var(--accent-rgb), 0.35);
        }

        .prototype-viewport-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 24px;
            background: radial-gradient(circle at center, rgba(var(--accent-rgb), 0.05) 0%, transparent 70%), var(--bg-base);
            position: relative;
        }

        /* ── Responsive service preview (기기 브랜드 중립: 모바일 · 태블릿 · 데스크톱 폭) ── */
        .preview-frame {
            position: relative;
            display: flex;
            flex-direction: column;
            margin: auto; /* flex auto margin: 공간이 부족하면 위쪽 정렬 → 프레임 상단이 잘리지 않음 */
            flex-shrink: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: width 0.35s var(--ease-smooth, ease), height 0.35s var(--ease-smooth, ease);
        }
        .preview-frame.mode-mobile  { width: 390px; height: 780px; max-width: 100%; }
        .preview-frame.mode-tablet  { width: 768px; height: 820px; max-width: 100%; }
        .preview-frame.mode-desktop { width: 100%; height: 100%; min-height: 560px; border-radius: 14px; }
        .preview-frame-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 11.5px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .preview-frame-bar .dots { display: inline-flex; gap: 5px; }
        .preview-frame-bar .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--border-color); }
        .preview-frame-bar .label { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .preview-frame-iframe { flex: 1; width: 100%; border: none; background: #ffffff; }

        /* User-flow navigator (screens declared with data-screen in the prototype) */
        .prototype-flow {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-sidebar);
            flex-shrink: 0;
        }
        .prototype-flow-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-right: 4px; }
        .flow-step {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .flow-step b { color: var(--accent-text); font-size: 11px; }
        .flow-step:hover { color: var(--text-primary); border-color: rgba(var(--accent-rgb), 0.4); }
        .flow-step.active { color: var(--text-primary); border-color: rgba(var(--accent-rgb), 0.6); background: rgba(var(--accent-rgb), 0.08); }
        .flow-arrow { color: var(--text-muted); font-size: 11px; }

        /* Terminal — disciplined block element, no decorative radius */
        .terminal-container {
            background: #080807;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md); /* 4px */
            overflow: hidden;
            margin: var(--sp-3) 0; /* 24px = 3bl */
        }

        .terminal-header {
            height: 32px; /* 4×bl */
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            padding: 0 var(--sp-2); /* 0 16px */
            justify-content: space-between;
        }

        .terminal-buttons {
            display: flex;
            gap: var(--sp-1); /* 8px = 1bl */
        }

        .t-btn {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .tb-red { background: #ff5f56; }
        .tb-yellow { background: #ffbd2e; }
        .tb-green { background: #27c93f; }

        .terminal-title {
            font-family: 'Fira Code', monospace;
            font-size: var(--type-10);
            line-height: var(--sp-2);
            color: var(--text-muted);
        }

        .terminal-body {
            padding: var(--sp-3); /* 24px = 3bl */
            overflow-x: auto;
        }

        .ascii-art {
            font-family: 'Fira Code', monospace;
            font-size: var(--type-12);
            line-height: var(--lh);
            color: var(--accent-text);
            white-space: pre;
        }

        /* Agent Logger Console */
        .console-log-area {
            display: flex;
            flex-direction: column;
            gap: var(--lh); /* 24px = 3bl — one baseline unit gap */
            font-family: 'Fira Code', monospace;
            font-size: var(--type-12);
        }

        .log-entry {
            border-left: 2px solid var(--accent-neon);
            padding-left: var(--sp-2); /* 16px = 2bl */
            animation: slide-log 0.2s ease-out;
        }

        @keyframes slide-log {
            from { opacity: 0; transform: translateX(-4px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-time {
            color: var(--text-muted);
            margin-right: var(--sp-1);
        }

        .log-agent {
            font-weight: 600;
            margin-right: var(--sp-1);
        }

        .log-agent.strategist { color: var(--accent-text); }
        .log-agent.analyst { color: var(--accent-purple); }
        .log-agent.architect { color: #f59e0b; }
        .log-agent.reviewer { color: var(--accent-green); }
        .log-agent.system { color: var(--text-muted); }

        .log-msg {
            color: var(--text-secondary);
            line-height: var(--lh);
            margin-top: 2px;
        }

        /* Monospace Editor — no decorative shadow, grid-disciplined */
        .editor-textarea-custom {
            width: 100%;
            height: 480px; /* 60×8 = 480px — multiple of bl */
            background: #080807;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            padding: var(--sp-3); /* 24px = 3bl */
            font-size: var(--type-12);
            font-family: 'Fira Code', monospace;
            line-height: var(--lh);
            resize: none;
            transition: border-color 0.15s ease;
            outline: none;
        }

        .editor-textarea-custom:focus {
            border-color: var(--accent-neon);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Pulse highlight for suggests click */
        @keyframes suggestion-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.2); }
            100% { transform: scale(1); }
        }
        .populated-pulse {
            animation: suggestion-pulse 0.6s ease-in-out;
        }

        /* ==========================================================================
           DARK THEME OVERRIDES (sidebar-toggle hover fix below)
           ========================================================================== */
        /* (body.dark-theme variables already defined above in :root override block) */

        /* Password Screen Base Styles (Light — default) */
        .password-overlay-wrapper {
            background: #f9f9fb;
        }
        .password-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.06), 0 0 40px rgba(0, 0, 0, 0.02);
        }
        .password-card-glow {
            background: radial-gradient(circle, rgba(239, 68, 68, 0.05) 0%, transparent 70%);
        }
        .password-logo {
            background: rgba(239, 68, 68, 0.06);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.15);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.08);
        }
        .password-title {
            color: var(--text-primary);
        }
        .password-subtitle {
            color: var(--text-secondary);
        }
        .password-input-wrapper {
            background: rgba(245, 245, 245, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .password-input-wrapper:focus-within {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.1);
        }
        .password-input-wrapper input {
            color: var(--text-primary);
        }
        .password-input-wrapper .input-icon {
            color: var(--text-muted);
        }
        .password-toggle-btn {
            color: var(--text-muted);
        }
        .password-toggle-btn:hover {
            color: var(--text-primary);
        }
        .password-submit-btn {
            background: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
        }
        .password-submit-btn:hover {
            background: #d32f2f;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.35);
        }

        body::before {
            background: radial-gradient(
                550px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(var(--accent-rgb), 0.07) 0%,
                rgba(37, 99, 235, 0.03) 45%,
                transparent 80%
            );
        }
        body.dark-theme::before {
            background: radial-gradient(
                550px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(239, 68, 68, 0.06) 0%,
                rgba(139, 92, 246, 0.03) 45%,
                transparent 80%
            );
        }

        .aurora-blob {
            mix-blend-mode: multiply;
            opacity: 0.12;
        }
        body.dark-theme .aurora-blob {
            mix-blend-mode: screen;
            opacity: 0.24;
        }

        .manus-prompt-container {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.01));
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
        }

        .manus-prompt-container::before {
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-blue), var(--accent-purple));
            opacity: 0.12;
        }

        .prompt-box-inner {
            background: #ffffff;
        }

        .prompt-box-inner textarea {
            color: #0f172a !important;
        }

        .prompt-box-inner textarea::placeholder {
            color: #64748b !important;
        }

        .prompt-submit-btn {
            background: var(--cta-gradient);
            color: #ffffff;
        }

        .prompt-submit-btn:hover {
            background: var(--cta-gradient);
            color: #ffffff;
            box-shadow: var(--glow-neon);
        }

        .suggestion-pill {
            background: rgba(0, 0, 0, 0.01);
            color: var(--text-secondary);
        }

        .suggestion-pill:hover {
            background: rgba(0, 0, 0, 0.03);
            color: var(--text-primary);
        }

        .landing-history-card {
            background: var(--bg-card);
        }

        .landing-history-card:hover {
            background: var(--bg-editor);
            border-color: var(--accent-neon);
        }

        .history-item-card {
            background: var(--bg-card);
        }

        .history-item-card:hover {
            background: var(--bg-editor);
            border-color: var(--accent-neon);
        }

        .computer-chrome {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .chrome-title-bar {
            border-bottom: 1px solid var(--border-color);
        }

        .chrome-tab.active {
            background: var(--bg-editor);
            border-color: var(--border-color);
            color: var(--accent-text);
        }

        .chrome-address-bar {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
        }

        .chrome-url-box {
            background: var(--bg-editor);
            border-color: var(--border-color);
        }

        .chrome-url-box input {
            color: var(--text-secondary);
        }

        .viewer-canvas {
            background-color: var(--bg-editor);
        }

        .document-wrapper {
            background: transparent;
            box-shadow: none;
        }

        .markdown-body h1 {
            color: var(--text-primary);
        }

        .markdown-body table {
            background: transparent;
        }

        .markdown-body th {
            background: var(--bg-sidebar);
            color: var(--text-primary);
        }

        .markdown-body blockquote {
            background: var(--bg-sidebar);
            border-left-color: var(--accent-neon);
        }

        .editor-textarea-custom {
            background: var(--bg-editor);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .editor-textarea-custom:focus {
            border-color: var(--accent-neon);
        }

        .stepper-container {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
        }

        .chat-follow-up-bar {
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border-color);
        }

        .wf-tab-btn.active {
            background: var(--text-primary);
            color: var(--bg-base);
        }

        .wf-tab-btn:hover {
            color: var(--text-primary);
            background: var(--border-color);
        }

        /* ==========================================================================
           4. RESPONSIVE DESIGN (TABLET & MOBILE)
           ========================================================================== */
        .stepper-header-row {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .sidebar-toggle-btn {
            display: none; /* hidden on desktop */
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            margin-right: 8px;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .sidebar-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--accent-text);
        }
        body.dark-theme .sidebar-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ==========================================================================
           APPLE DESIGN SYSTEM: FLUID MOTION, PHYSICAL TOUCH & ACCESSIBILITY
           ========================================================================== */
        /* 1. Instant Pointer-Down (Press) Feedback: Scale 0.97 on active */
        button:active,
        .btn-minimal:active,
        .prompt-submit-btn:active,
        .chrome-tab:active,
        .landing-history-card:active,
        .history-item-card:active,
        .suggestion-pill:active,
        .pitl-modal-btn:active {
            transform: scale(0.97) !important;
            transition: transform 80ms cubic-bezier(0.16, 1, 0.3, 1) !important;
        }

        /* 2. Apple Fluid Spring Curves & Translucency Materials */
        .btn-minimal,
        .prompt-submit-btn,
        .chrome-tab,
        .landing-history-card,
        .history-item-card,
        .suggestion-pill,
        .pitl-modal-content,
        .sidebar-toggle-btn {

        /* 3. Reduced Motion & Reduced Transparency Accessibility (Apple Standard) */

                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;

            .sidebar-panel {
                transition: none !important;
            }

        @media (prefers-reduced-transparency: reduce) {
            .pitl-modal-overlay,
            .pitl-modal-content,
            .chrome-title-bar,
            .computer-chrome {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;

        @media (max-width: 520px) {
