                        ${renderMarkdownEnhanced(mdRaw)}
                        ${extraHtml}
                    </div>
                `;
            }
        }

        // Enhanced Markdown Parser with Soft Highlights (==text==) and Callout Cards
        // ═══════════════════════════════════════════════════════════════════
        //  Framework visualizations — 3C · SWOT/TOWS · STP · MECE/RICE
        //  각 문서 끝의 ```pitl-viz JSON 블록을 읽어 SVG/HTML 차트로 그린다.
        //  색: 검증된 카테고리 4색(--viz-1..4)과 단일 색상 서열 램프(--viz-seq-1..5)만 사용
        // ═══════════════════════════════════════════════════════════════════
        const VIZ_DOC_KEYS = new Set(['threec', 'swot', 'stp', 'mece']);
        const VIZ_BLOCK_RE = /\n?```pitl-viz[^\n]*\n([\s\S]*?)```\s*/;

        // 생성 프롬프트와 '시각화 생성' 추출 프롬프트가 함께 쓰는 데이터 규격
        const VIZ_SCHEMAS = {
            threec: `{"framework":"3c",
 "customer":["고객 핵심 니즈 3개, 각 25자 이내"],
 "competitor":["경쟁 공백 3개, 각 25자 이내"],
 "company":["자사 강점 3개, 각 25자 이내"],
 "whiteSpace":"3C 교집합 전략 컨셉 한 문장, 40자 이내",
 "scores":{"attributes":["비교 속성 4~5개"],"rows":[{"name":"자사(목표)","values":[1~5 정수]},{"name":"경쟁사명","values":[1~5 정수]}]}}
- scores.rows는 자사 포함 3~5행이고, 각 values의 길이는 attributes 길이와 같다.`,
            swot: `{"framework":"swot",
 "S":["강점 3~4개, 각 30자 이내"],"W":["약점 3~4개"],"O":["기회 3~4개"],"T":["위협 3~4개"],
 "tows":[{"type":"SO","strategy":"40자 이내","priority":"High|Medium|Low","period":"예: 0-3개월"},
         {"type":"ST","strategy":"...","priority":"...","period":"..."},
         {"type":"WO","strategy":"...","priority":"...","period":"..."},
         {"type":"WT","strategy":"...","priority":"...","period":"..."}]}`,
            stp: `{"framework":"stp",
 "segments":[{"name":"세그먼트명","size":시장 규모 숫자,"growth":연 성장률(%) 숫자,"access":접근성 1~5,"role":"primary|secondary|other"}],
 "sizeUnit":"억원",
 "market":{"unit":"억원","tam":숫자,"sam":숫자,"som":숫자},
 "positioning":{"xAxis":"X축 속성명","yAxis":"Y축 속성명","points":[{"name":"자사","x":0~10,"y":0~10,"self":true},{"name":"경쟁사명","x":0~10,"y":0~10}]}}
- segments는 3~5개이고 primary는 정확히 1개다. tam ≥ sam ≥ som. points는 자사 포함 4~6개.`,
            mece: `{"framework":"mece",
 "tree":[{"domain":"고객 세분화","items":["..."]},{"domain":"고객 제공 가치","items":["..."]},{"domain":"시장 기회 (Ansoff)","items":["..."]},{"domain":"기능 우선순위 (MoSCoW)","items":["..."]},{"domain":"리스크","items":["..."]}],
 "rice":[{"id":"REQ-01","feature":"기능명, 20자 이내","reach":분기당 도달 사용자 수,"impact":0.25|0.5|1|2|3,"confidence":0~100,"effort":인월(person-month) 숫자,"moscow":"Must|Should|Could|Won't"}]}
- tree는 5개 도메인, 각 items는 3~5개(각 20자 이내). rice는 6~10개 기능.`
        };

        function vizPromptAppendix(docKey) {
            return `
                ## 시각화 데이터 (필수)
                - 문서 맨 끝에 아래 규격의 코드 블록을 반드시 추가하라. 값은 본문 내용과 일치해야 하며, 숫자 필드에는 단위 없이 숫자만 쓴다.
                - 코드 블록 언어 표기는 정확히 pitl-viz 로 하고, 블록 안에는 유효한 JSON만 넣는다.
                \`\`\`pitl-viz
                ${VIZ_SCHEMAS[docKey]}
                \`\`\`
            `;
        }

        const vizEsc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        const vizNum = (value, fallback = 0) => (Number.isFinite(Number(value)) ? Number(value) : fallback);
        const vizClamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
        const vizList = (value, max = 6) => (Array.isArray(value) ? value.filter(Boolean).slice(0, max).map(String) : []);
        const vizFmt = value => vizNum(value).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
        // 포커스·호버 공용 툴팁 대상 속성 (값은 표 보기로도 항상 확인 가능)
        const vizTipAttrs = tip => `data-tip="${vizEsc(tip)}" tabindex="0" role="img" aria-label="${vizEsc(tip.replace(/\n/g, ', '))}"`;

        function splitVizBlock(md) {
            const match = (md || '').match(VIZ_BLOCK_RE);
            if (!match) return { markdown: md || '', data: null };
            let data = null;
            try { data = JSON.parse(match[1]); } catch (e) { console.warn('[viz] pitl-viz JSON 파싱 실패:', e.message); }
            return { markdown: (md.slice(0, match.index) + '\n' + md.slice(match.index + match[0].length)).trim(), data };
        }

        function parseVizJson(raw) {
            const text = String(raw || '').replace(/```[a-z-]*\s*/gi, '').replace(/```/g, '');
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            if (start < 0 || end <= start) throw new Error(t('응답에서 JSON을 찾지 못했습니다.', 'No JSON found in the response.'));
            return JSON.parse(text.slice(start, end + 1));
        }

        function vizTable(headers, rows) {
            return `<table><thead><tr>${headers.map(h => `<th>${vizEsc(h)}</th>`).join('')}</tr></thead>
                <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${vizEsc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
        }

        function vizCard({ title, subtitle = '', body, table = '', wide = false }) {
            return `<figure class="viz-card${wide ? ' wide' : ''}">
                <figcaption class="viz-card-head">
                    <div>
                        <h4 class="viz-title">${vizEsc(title)}</h4>
                        ${subtitle ? `<p class="viz-sub">${vizEsc(subtitle)}</p>` : ''}
                    </div>
                    ${table ? `<button type="button" class="viz-table-toggle" onclick="toggleVizTable(this)" aria-expanded="false">${t('표로 보기', 'Show table')}</button>` : ''}
                </figcaption>
                <div class="viz-body">${body}</div>
                ${table ? `<div class="viz-table" hidden>${table}</div>` : ''}
            </figure>`;
        }

        function toggleVizTable(btn) {
            const tableEl = btn.closest('.viz-card').querySelector('.viz-table');
            const open = tableEl.hidden;
            tableEl.hidden = !open;
            btn.setAttribute('aria-expanded', String(open));
            btn.textContent = open ? t('표 숨기기', 'Hide table') : t('표로 보기', 'Show table');
        }

        function vizLegend(entries) {
            return `<div class="viz-legend">${entries.map(([color, label]) =>
                `<span class="viz-legend-item"><i class="viz-swatch" style="background:${color}"></i>${vizEsc(label)}</span>`).join('')}</div>`;
        }

        // 라벨 겹침 회피: 후보 위치 중 다른 라벨·점·예약 영역과 겹치지 않는 첫 자리를 고른다.
        // 들어갈 자리가 없으면 라벨을 생략한다 (값은 툴팁과 표 보기로 확인 가능)
        function vizPlaceLabels(points, bounds, reserved = []) {
            const textWidth = text => [...text].reduce((w, ch) => w + (/[\u3131-\uD79D]/.test(ch) ? 11.5 : 6.8), 4);
            const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
            const placed = [...reserved];
            return points.map(pt => {
                const w = textWidth(pt.text), h = 14;
                const candidates = [[9, -17], [9, 3], [-9 - w, -17], [-9 - w, 3], [-w / 2, -26], [-w / 2, 11]];
                for (const [dx, dy] of candidates) {
                    const box = { x: pt.cx + dx, y: pt.cy + dy, w, h };
                    if (box.x < bounds.x0 || box.x + w > bounds.x1 || box.y < bounds.y0 || box.y + h > bounds.y1) continue;
                    if (placed.some(b => overlaps(b, box))) continue;
                    if (points.some(q => q !== pt && overlaps({ x: q.cx - 6, y: q.cy - 6, w: 12, h: 12 }, box))) continue;
                    placed.push(box);
                    return { x: box.x, y: box.y + 11 };
                }
                return null;
            });
        }

        // ── 3C: Venn + competitor heatmap ──────────────────────────────────
        function viz3C(d) {
            const groups = [
                ['Customer', t('고객 니즈', 'Customer needs'), vizList(d.customer, 4), 'var(--viz-1)'],
                ['Competitor', t('경쟁 공백', 'Competitor gaps'), vizList(d.competitor, 4), 'var(--viz-2)'],
                ['Company', t('자사 강점', 'Company strengths'), vizList(d.company, 4), 'var(--viz-3)']
            ];
            const venn = `
                <svg class="viz-svg viz-venn" viewBox="0 0 360 300" aria-hidden="true">
                    <circle cx="135" cy="118" r="92" fill="var(--viz-1)" fill-opacity="0.14" stroke="var(--viz-1)" stroke-width="1.5"/>
                    <circle cx="225" cy="118" r="92" fill="var(--viz-2)" fill-opacity="0.14" stroke="var(--viz-2)" stroke-width="1.5"/>
                    <circle cx="180" cy="196" r="92" fill="var(--viz-3)" fill-opacity="0.14" stroke="var(--viz-3)" stroke-width="1.5"/>
                    <text x="88" y="70" class="viz-label-strong" text-anchor="middle">Customer</text>
                    <text x="272" y="70" class="viz-label-strong" text-anchor="middle">Competitor</text>
                    <text x="180" y="268" class="viz-label-strong" text-anchor="middle">Company</text>
                    <text x="180" y="146" class="viz-label-strong" text-anchor="middle">★ White Space</text>
                </svg>`;
            const lists = groups.map(([, label, items, color]) => `
                <div class="viz-3c-group">
                    <div class="viz-3c-head"><i class="viz-swatch" style="background:${color}"></i>${vizEsc(label)}</div>
                    <ul>${items.map(item => `<li>${vizEsc(item)}</li>`).join('')}</ul>
                </div>`).join('');
            const vennCard = vizCard({
                title: t('3C 교집합 — 전략적 화이트 스페이스', '3C overlap — strategic white space'),
                subtitle: d.whiteSpace ? `★ ${d.whiteSpace}` : '',
                wide: true,
                body: `<div class="viz-3c">${venn}<div class="viz-3c-lists">${lists}</div></div>`
            });

            const attrs = vizList(d.scores && d.scores.attributes, 6);
            const rows = (d.scores && Array.isArray(d.scores.rows) ? d.scores.rows : []).slice(0, 6);
            if (!attrs.length || !rows.length) return vennCard;
            const heat = `
                <div class="viz-heat" role="table" aria-label="${vizEsc(t('경쟁 비교 점수 (1~5)', 'Competitive scores (1-5)'))}">
                    <div class="viz-heat-row viz-heat-header" role="row" style="--cols:${attrs.length}">
                        <span role="columnheader"></span>${attrs.map(a => `<span role="columnheader">${vizEsc(a)}</span>`).join('')}
                    </div>
                    ${rows.map(row => {
                        const isSelf = /자사|우리|self/i.test(row.name || '');
                        return `<div class="viz-heat-row${isSelf ? ' self' : ''}" role="row" style="--cols:${attrs.length}">
                            <span class="viz-heat-name" role="rowheader">${vizEsc(row.name)}</span>
                            ${attrs.map((a, i) => {
                                const v = vizClamp(Math.round(vizNum(row.values && row.values[i], 0)), 0, 5);
                                const step = Math.max(1, v);
                                return `<span class="viz-heat-cell" role="cell" style="background:var(--viz-seq-${step});color:var(--viz-seq-${step}-ink)"
                                    ${vizTipAttrs(`${row.name} · ${a}\n${v} / 5`)}>${v}</span>`;
                            }).join('')}
                        </div>`;
                    }).join('')}
                    <div class="viz-heat-scale"><span>${t('낮음', 'Low')}</span>${[1, 2, 3, 4, 5].map(s => `<i style="background:var(--viz-seq-${s})"></i>`).join('')}<span>${t('높음', 'High')}</span></div>
                </div>`;
            const heatCard = vizCard({
                title: t('경쟁 비교 히트맵', 'Competitive heatmap'),
                subtitle: t('속성별 경쟁력 점수 (1~5)', 'Score per attribute (1-5)'),
                wide: true,
                body: heat
            });
            return vennCard + heatCard;
        }

        // ── SWOT 2×2 + TOWS cross-strategy 2×2 ─────────────────────────────
        function vizSWOT(d) {
            const quad = (key, label, color) => `
                <div class="viz-quad">
                    <div class="viz-quad-head"><i class="viz-swatch" style="background:${color}"></i><b>${key}</b> ${vizEsc(label)}</div>
                    <ul>${vizList(d[key], 5).map(item => `<li>${vizEsc(item)}</li>`).join('')}</ul>
                </div>`;
            const swot = `
                <div class="viz-2x2">
                    <span></span>
                    <span class="viz-axis-head">${t('긍정적 요인', 'Positive')}</span>
                    <span class="viz-axis-head">${t('부정적 요인', 'Negative')}</span>
                    <span class="viz-axis-head viz-axis-side">${t('내부', 'Internal')}</span>
                    ${quad('S', t('강점', 'Strengths'), 'var(--viz-1)')}
                    ${quad('W', t('약점', 'Weaknesses'), 'var(--viz-2)')}
                    <span class="viz-axis-head viz-axis-side">${t('외부', 'External')}</span>
                    ${quad('O', t('기회', 'Opportunities'), 'var(--viz-3)')}
                    ${quad('T', t('위협', 'Threats'), 'var(--viz-4)')}
                </div>`;
            const swotCard = vizCard({ title: t('SWOT 4분면', 'SWOT quadrants'), body: swot });

            const towsList = Array.isArray(d.tows) ? d.tows : [];
            const byType = type => towsList.find(item => String(item.type || '').toUpperCase() === type) || {};
            const priorityStep = { HIGH: 5, MEDIUM: 3, LOW: 1 };
            const towsCell = (type, label) => {
                const item = byType(type);
                const priority = String(item.priority || '').toUpperCase();
                const step = priorityStep[priority];
                return `<div class="viz-quad viz-tows-cell">
                    <div class="viz-quad-head"><b>${type}</b> ${vizEsc(label)}
                        ${step ? `<span class="viz-priority" style="background:var(--viz-seq-${step});color:var(--viz-seq-${step}-ink)">${vizEsc(item.priority)}</span>` : ''}
                    </div>
                    <p>${vizEsc(item.strategy || '—')}</p>
                    ${item.period ? `<span class="viz-meta"><i class="fa-regular fa-clock"></i> ${vizEsc(item.period)}</span>` : ''}
                </div>`;
            };
            const tows = `
                <div class="viz-2x2">
                    <span></span>
                    <span class="viz-axis-head">O ${t('기회', 'Opportunities')}</span>
                    <span class="viz-axis-head">T ${t('위협', 'Threats')}</span>
                    <span class="viz-axis-head viz-axis-side">S ${t('강점', 'Strengths')}</span>
                    ${towsCell('SO', t('공격적 성장', 'Aggressive growth'))}
                    ${towsCell('ST', t('위협 회피·다각화', 'Diversify'))}
                    <span class="viz-axis-head viz-axis-side">W ${t('약점', 'Weaknesses')}</span>
                    ${towsCell('WO', t('체질 개선', 'Turnaround'))}
                    ${towsCell('WT', t('방어·위기관리', 'Defensive'))}
                </div>`;
            const towsCard = vizCard({
                title: t('TOWS 교차 전략 매트릭스', 'TOWS cross-strategy matrix'),
                subtitle: t('배지 = 실행 우선순위', 'Badge = execution priority'),
                body: tows,
                table: towsList.length ? vizTable(
                    [t('전략', 'Type'), t('내용', 'Strategy'), t('우선순위', 'Priority'), t('기간', 'Period')],
                    towsList.map(item => [item.type, item.strategy, item.priority, item.period])
                ) : ''
            });
            return swotCard + towsCard;
        }

        // ── STP: segment bubble chart · TAM/SAM/SOM tiles · positioning map ─
        function vizSTP(d) {
            const unit = d.sizeUnit || (d.market && d.market.unit) || '';
            const roleMeta = {
                primary: ['var(--viz-1)', t('핵심 타깃', 'Primary target')],
                secondary: ['var(--viz-2)', t('서브 타깃', 'Secondary target')],
                other: ['var(--viz-muted)', t('기타 세그먼트', 'Other segment')]
            };
            const segs = (Array.isArray(d.segments) ? d.segments : []).slice(0, 6).map(s => ({
                name: String(s.name || ''),
                size: Math.max(0, vizNum(s.size)),
                growth: vizNum(s.growth),
                access: vizClamp(vizNum(s.access, 3), 1, 5),
                role: roleMeta[s.role] ? s.role : 'other'
            }));
            let cards = '';

            if (segs.length) {
                const W = 900, H = 340, m = { l: 52, r: 24, t: 24, b: 46 }; // 넓은 카드 폭에 맞춘 좌표계 (글자 확대 방지)
                const pw = W - m.l - m.r, ph = H - m.t - m.b;
                const gMax = Math.max(...segs.map(s => s.growth), 1);
                const gMin = Math.min(0, ...segs.map(s => s.growth));
                const step = Math.max(5, Math.ceil((gMax - gMin) / 4 / 5) * 5);
                const x0 = Math.floor(gMin / step) * step, x1 = Math.ceil((gMax * 1.15) / step) * step;
                const sx = v => m.l + ((v - x0) / (x1 - x0)) * pw;
                const sy = v => m.t + ph - ((v - 0.5) / 5) * ph;
                const maxSize = Math.max(...segs.map(s => s.size), 1);
                const sr = v => 8 + 30 * Math.sqrt(v / maxSize);
                const xTicks = [];
                for (let v = x0; v <= x1; v += step) xTicks.push(v);
                const bubbles = [...segs].sort((a, b) => b.size - a.size).map(s => {
                    const [color, roleLabel] = roleMeta[s.role];
                    const cx = sx(s.growth), cy = sy(s.access), r = sr(s.size);
                    const tip = `${s.name} (${roleLabel})\n${t('시장 규모', 'Size')} ${vizFmt(s.size)}${unit} · ${t('성장률', 'Growth')} ${vizFmt(s.growth)}% · ${t('접근성', 'Access')} ${s.access}/5`;
                    return `<g class="viz-mark" ${vizTipAttrs(tip)}>
                        <circle cx="${cx}" cy="${cy}" r="${Math.max(r, 12)}" fill="transparent"/>
                        <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" fill-opacity="0.22" stroke="${color}" stroke-width="2"/>
                        <circle cx="${cx}" cy="${cy}" r="4" fill="${color}" stroke="var(--viz-surface)" stroke-width="2"/>
                        <text x="${cx}" y="${cy - r - 6}" class="viz-label" text-anchor="middle">${vizEsc(s.name)}</text>
                    </g>`;
                }).join('');
                const svg = `<svg class="viz-svg" viewBox="0 0 ${W} ${H}">
                    ${[1, 2, 3, 4, 5].map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}" class="viz-gridline"/>
                        <text x="${m.l - 10}" y="${sy(v) + 4}" class="viz-tick" text-anchor="end">${v}</text>`).join('')}
                    ${xTicks.map(v => `<text x="${sx(v)}" y="${H - m.b + 18}" class="viz-tick" text-anchor="middle">${v}%</text>`).join('')}
                    <line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ph}" y2="${m.t + ph}" class="viz-axis"/>
                    <text x="${m.l + pw / 2}" y="${H - 6}" class="viz-axis-title" text-anchor="middle">${t('연 성장률 (%) →', 'Annual growth (%) →')}</text>
                    <text transform="translate(14 ${m.t + ph / 2}) rotate(-90)" class="viz-axis-title" text-anchor="middle">${t('접근성 (1–5) →', 'Accessibility (1-5) →')}</text>
                    ${bubbles}
                </svg>`;
                const roles = ['primary', 'secondary', 'other'].filter(role => segs.some(s => s.role === role));
                cards += vizCard({
                    title: t('세그먼트 매력도', 'Segment attractiveness'),
                    subtitle: t(`원 크기 = 시장 규모${unit ? ` (${unit})` : ''}`, `Bubble size = market size${unit ? ` (${unit})` : ''}`),
                    wide: true,
                    body: vizLegend(roles.map(role => roleMeta[role])) + svg,
                    table: vizTable(
                        [t('세그먼트', 'Segment'), t('역할', 'Role'), `${t('규모', 'Size')}${unit ? ` (${unit})` : ''}`, t('성장률 %', 'Growth %'), t('접근성', 'Access')],
                        segs.map(s => [s.name, roleMeta[s.role][1], vizFmt(s.size), vizFmt(s.growth), s.access])
                    )
                });
            }

            const mk = d.market || {};
            if (mk.tam || mk.sam || mk.som) {
                const mUnit = mk.unit || unit;
                const tiers = [['TAM', t('전체 시장', 'Total'), mk.tam], ['SAM', t('유효 시장', 'Serviceable'), mk.sam], ['SOM', t('획득 목표', 'Obtainable'), mk.som]];
                const tiles = tiers.map(([key, label, value], i) => {
                    const prev = i > 0 ? vizNum(tiers[i - 1][2]) : 0;
                    const ratio = prev > 0 ? Math.round((vizNum(value) / prev) * 1000) / 10 : null;
                    return `${i > 0 ? `<span class="viz-funnel-arrow" title="${tiers[i - 1][0]} → ${key}">→<small>${ratio !== null ? `${ratio}%` : ''}</small></span>` : ''}
                        <div class="viz-stat">
                            <span class="viz-stat-key">${key}</span>
                            <span class="viz-stat-value">${vizFmt(value)}<small>${vizEsc(mUnit)}</small></span>
                            <span class="viz-stat-label">${label}${ratio !== null ? `<span class="viz-sr-only"> (${tiers[i - 1][0]} ${t('대비', 'of')} ${ratio}%)</span>` : ''}</span>
                        </div>`;
                }).join('');
                cards += vizCard({
                    title: t('시장 규모 (TAM · SAM · SOM)', 'Market size (TAM · SAM · SOM)'),
                    subtitle: t('자릿수 차이가 커서 막대 대신 수치로 표시', 'Shown as figures: magnitudes differ too much for bars'),
                    body: `<div class="viz-stats">${tiles}</div>`
                });
            }

            const pos = d.positioning || {};
            const pts = (Array.isArray(pos.points) ? pos.points : []).slice(0, 8).map(p => ({
                name: String(p.name || ''), x: vizClamp(vizNum(p.x, 5), 0, 10), y: vizClamp(vizNum(p.y, 5), 0, 10), self: !!p.self
            }));
            if (pts.length) {
                const S = 340, m = 36, ps = S - m * 2;
                const px = v => m + (v / 10) * ps, py = v => m + ps - (v / 10) * ps;
                const self = pts.find(p => p.self);
                const shade = self ? `<rect x="${self.x >= 5 ? px(5) : m}" y="${self.y >= 5 ? m : py(5)}" width="${ps / 2}" height="${ps / 2}" fill="var(--viz-1)" fill-opacity="0.06"/>` : '';
                // 자사 라벨을 먼저 배치해 가장 좋은 자리를 준다
                const ordered = [...pts].sort((a, b) => b.self - a.self).map(p => ({ ...p, cx: px(p.x), cy: py(p.y), text: p.name }));
                const labels = vizPlaceLabels(ordered, { x0: 0, x1: S, y0: 0, y1: S });
                const marks = ordered.map((p, i) => ({ p, label: labels[i] })).reverse().map(({ p, label }) => {
                    const color = p.self ? 'var(--viz-1)' : 'var(--viz-muted)';
                    const tip = `${p.name}\n${pos.xAxis || 'X'} ${p.x}/10 · ${pos.yAxis || 'Y'} ${p.y}/10`;
                    return `<g class="viz-mark" ${vizTipAttrs(tip)}>
                        <circle cx="${p.cx}" cy="${p.cy}" r="14" fill="transparent"/>
                        <circle cx="${p.cx}" cy="${p.cy}" r="${p.self ? 7 : 5}" fill="${color}" stroke="var(--viz-surface)" stroke-width="2"/>
                        ${label ? `<text x="${label.x}" y="${label.y}" class="${p.self ? 'viz-label-strong' : 'viz-label'}">${vizEsc(p.name)}</text>` : ''}
                    </g>`;
                }).join('');
                const svg = `<svg class="viz-svg viz-square" viewBox="0 0 ${S} ${S}">
                    <rect x="${m}" y="${m}" width="${ps}" height="${ps}" fill="none" class="viz-gridline"/>
                    ${shade}
                    <line x1="${px(5)}" x2="${px(5)}" y1="${m}" y2="${m + ps}" class="viz-axis"/>
                    <line x1="${m}" x2="${m + ps}" y1="${py(5)}" y2="${py(5)}" class="viz-axis"/>
                    <!-- 축 제목은 플롯 바깥에 두어 점 라벨과 겹치지 않게 한다 -->
                    <text x="${m}" y="${m + ps + 18}" class="viz-tick">Low</text>
                    <text x="${m + ps / 2}" y="${m + ps + 18}" class="viz-axis-title" text-anchor="middle">${vizEsc(pos.xAxis || 'X')} →</text>
                    <text x="${m + ps}" y="${m + ps + 18}" class="viz-tick" text-anchor="end">High</text>
                    <text x="${m}" y="${m - 12}" class="viz-axis-title">↑ ${vizEsc(pos.yAxis || 'Y')}</text>
                    <text x="${m - 6}" y="${m + 10}" class="viz-tick" text-anchor="end">High</text>
                    <text x="${m - 6}" y="${m + ps}" class="viz-tick" text-anchor="end">Low</text>
                    ${marks}
                </svg>`;
                cards += vizCard({
                    title: t('포지셔닝 맵', 'Positioning map'),
                    subtitle: t('보라 = 자사, 회색 = 경쟁사 · 음영 = 자사 영역', 'Violet = us, gray = competitors · shaded = our zone'),
                    body: svg,
                    table: vizTable(['', pos.xAxis || 'X', pos.yAxis || 'Y'], pts.map(p => [p.name + (p.self ? ' ★' : ''), p.x, p.y]))
                });
            }
            return cards;
        }

        // ── MECE logic tree · RICE ranking · Impact × Effort 2×2 ─────────────
        function vizMECE(d) {
            let cards = '';
            const tree = (Array.isArray(d.tree) ? d.tree : []).slice(0, 6);
            if (tree.length) {
                cards += vizCard({
                    title: t('MECE 로직 트리', 'MECE logic tree'),
                    subtitle: t('중복 없이(ME), 빠짐없이(CE) 분해한 5대 도메인', 'Five domains, mutually exclusive & collectively exhaustive'),
                    wide: true,
                    body: `<div class="viz-tree">
                        <div class="viz-tree-root">${t('상품 기획 전체', 'Whole plan')}</div>
                        <div class="viz-tree-branches" style="--n:${tree.length}">
                            ${tree.map(node => `<div class="viz-tree-branch">
                                <div class="viz-tree-domain">${vizEsc(node.domain)}</div>
                                ${vizList(node.items, 6).map(item => `<div class="viz-tree-leaf">${vizEsc(item)}</div>`).join('')}
                            </div>`).join('')}
                        </div>
                    </div>`
                });
            }

            const moscow = {
                MUST: ['var(--viz-1)', 'Must'], SHOULD: ['var(--viz-2)', 'Should'],
                COULD: ['var(--viz-3)', 'Could'], "WON'T": ['var(--viz-4)', "Won't"], WONT: ['var(--viz-4)', "Won't"]
            };
            const rice = (Array.isArray(d.rice) ? d.rice : []).slice(0, 12).map(r => {
                const reach = Math.max(0, vizNum(r.reach)), impact = Math.max(0, vizNum(r.impact, 1));
                const confidence = vizClamp(vizNum(r.confidence, 50), 0, 100), effort = Math.max(0.1, vizNum(r.effort, 1));
                const key = String(r.moscow || '').toUpperCase().replace(/’/g, "'");
                return { id: String(r.id || ''), feature: String(r.feature || ''), reach, impact, confidence, effort,
                    moscow: moscow[key] || ['var(--viz-muted)', String(r.moscow || '—')],
                    score: (reach * impact * (confidence / 100)) / effort };
            }).sort((a, b) => b.score - a.score);
            if (!rice.length) return cards;

            const maxScore = Math.max(...rice.map(r => r.score), 1);
            const bars = rice.map(r => {
                const tip = `${r.id} ${r.feature}\nR ${vizFmt(r.reach)} × I ${r.impact} × C ${r.confidence}% ÷ E ${r.effort} = ${vizFmt(Math.round(r.score))}`;
                return `<div class="viz-bar-row" ${vizTipAttrs(tip)}>
                    <span class="viz-bar-label"><b>${vizEsc(r.id)}</b> ${vizEsc(r.feature)}</span>
                    <span class="viz-bar-track">
                        <span class="viz-bar" style="width:${Math.max(1.5, (r.score / maxScore) * 100)}%;background:${r.moscow[0]}"></span>
                        <span class="viz-bar-value">${vizFmt(Math.round(r.score))}</span>
                    </span>
                </div>`;
            }).join('');
            const used = Object.values(moscow).filter(([c, label], i, all) => all.findIndex(x => x[1] === label) === i)
                .filter(([, label]) => rice.some(r => r.moscow[1] === label));
            cards += vizCard({
                title: t('RICE 우선순위 점수', 'RICE priority score'),
                subtitle: 'Reach × Impact × Confidence ÷ Effort',
                body: vizLegend(used) + `<div class="viz-bars">${bars}</div>`,
                table: vizTable(['ID', t('기능', 'Feature'), 'Reach', 'Impact', 'Confidence %', 'Effort', 'RICE', 'MoSCoW'],
                    rice.map(r => [r.id, r.feature, vizFmt(r.reach), r.impact, r.confidence, r.effort, vizFmt(Math.round(r.score)), r.moscow[1]]))
            });

            // Impact × Effort: x = effort, y = impact (RICE 척도 0.25~3)
            const S = 340, m = 40, ps = S - m * 2;
            const eMax = Math.max(...rice.map(r => r.effort), 1) * 1.15;
            const efforts = rice.map(r => r.effort).sort((a, b) => a - b);
            const eSplit = efforts[Math.floor(efforts.length / 2)];
            // 위쪽 여유 구간(3~3.8)은 4분면 라벨 자리
            const px = v => m + (v / eMax) * ps, py = v => m + ps - (vizClamp(v, 0, 3.8) / 3.8) * ps;
            const seen = {};
            const pts = rice.map(r => {
                const k = `${r.effort}|${r.impact}`;
                const n = (seen[k] = (seen[k] || 0) + 1) - 1;
                return { r, cx: px(r.effort) + n * 9, cy: py(r.impact) - n * 9, text: r.id };
            });
            const quadBoxes = [[m + 4, m + 4], [m + ps - 64, m + 4], [m + 4, m + ps - 20], [m + ps - 64, m + ps - 20]]
                .map(([x, y]) => ({ x, y, w: 60, h: 16 }));
            const labels = vizPlaceLabels(pts, { x0: m, x1: m + ps, y0: m, y1: m + ps }, quadBoxes);
            const marks = pts.map(({ r, cx, cy }, i) => {
                const tip = `${r.id} ${r.feature}\nImpact ${r.impact} · Effort ${r.effort} ${t('인월', 'PM')}`;
                return `<g class="viz-mark" ${vizTipAttrs(tip)}>
                    <circle cx="${cx}" cy="${cy}" r="13" fill="transparent"/>
                    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--viz-1)" stroke="var(--viz-surface)" stroke-width="2"/>
                    ${labels[i] ? `<text x="${labels[i].x}" y="${labels[i].y}" class="viz-label">${vizEsc(r.id)}</text>` : ''}
                </g>`;
            }).join('');
            const quads = [
                [m + 8, m + 16, 'start', t('빠른 성과', 'Quick wins')],
                [m + ps - 8, m + 16, 'end', t('큰 베팅', 'Big bets')],
                [m + 8, m + ps - 8, 'start', t('틈새 작업', 'Fill-ins')],
                [m + ps - 8, m + ps - 8, 'end', t('시간 낭비', 'Time sinks')]
            ].map(([x, y, a, label]) => `<text x="${x}" y="${y}" class="viz-quad-label" text-anchor="${a}">${label}</text>`).join('');
            const svg = `<svg class="viz-svg viz-square" viewBox="0 0 ${S} ${S}">
                <rect x="${m}" y="${m}" width="${px(eSplit) - m}" height="${py(1.5) - m}" fill="var(--viz-1)" fill-opacity="0.06"/>
                <rect x="${m}" y="${m}" width="${ps}" height="${ps}" fill="none" class="viz-gridline"/>
                <line x1="${px(eSplit)}" x2="${px(eSplit)}" y1="${m}" y2="${m + ps}" class="viz-axis"/>
                <line x1="${m}" x2="${m + ps}" y1="${py(1.5)}" y2="${py(1.5)}" class="viz-axis"/>
                ${quads}
                <text x="${m + ps / 2}" y="${S - 10}" class="viz-axis-title" text-anchor="middle">${t('노력 (인월) →', 'Effort (person-months) →')}</text>
                <text transform="translate(14 ${m + ps / 2}) rotate(-90)" class="viz-axis-title" text-anchor="middle">${t('임팩트 →', 'Impact →')}</text>
                ${marks}
            </svg>`;
            cards += vizCard({
                title: t('임팩트 × 노력 매트릭스', 'Impact × effort matrix'),
                subtitle: t('왼쪽 위(음영) = 빠른 성과: 노력은 적고 임팩트는 큰 기능', 'Top-left (shaded) = quick wins: low effort, high impact'),
                body: svg,
                table: vizTable(['ID', t('기능', 'Feature'), 'Impact', 'Effort'], rice.map(r => [r.id, r.feature, r.impact, r.effort]))
            });
            return cards;
        }

        function vizEmptyState(docKey, broken = false) {
            const hasDoc = !!(generatedDocs && generatedDocs[docKey] && generatedDocs[docKey].trim());
            if (!hasDoc) return '';
            return `<section class="viz-panel viz-empty">
                <div>
                    <span class="viz-eyebrow"><i class="fa-solid fa-chart-simple"></i> VISUAL SUMMARY</span>
                    <p>${broken
                        ? t('시각화 데이터를 읽지 못했습니다. 다시 생성해 주세요.', 'Could not read the visualization data. Please regenerate it.')
                        : t('이 문서에는 아직 시각화 데이터가 없습니다. 본문에서 차트 데이터를 추출해 그립니다.', 'No visualization data yet. Extract chart data from this document.')}</p>
                </div>
                <button type="button" class="btn-minimal" id="btn-viz-generate" onclick="generateVizForDoc('${docKey}')">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> ${t('시각화 생성', 'Generate charts')}
                </button>
            </section>`;
        }

        function renderFrameworkViz(docKey, data) {
            if (!VIZ_DOC_KEYS.has(docKey)) return '';
            if (!data) return vizEmptyState(docKey);
            try {
                const cards = ({ threec: viz3C, swot: vizSWOT, stp: vizSTP, mece: vizMECE })[docKey](data);
                if (!cards) return vizEmptyState(docKey, true);
                return `<section class="viz-panel" aria-label="${vizEsc(t('시각화 요약', 'Visual summary'))}">
                    <span class="viz-eyebrow"><i class="fa-solid fa-chart-simple"></i> VISUAL SUMMARY</span>
                    <div class="viz-grid">${cards}</div>
                </section>`;
            } catch (err) {
                console.warn('[viz] render failed:', err);
                return vizEmptyState(docKey, true);
            }
        }

        // 차트를 그릴 만큼 데이터가 갖춰졌는지 (블록이 있어도 핵심 필드가 비면 다시 추출)
        function vizDataUsable(docKey, data) {
            if (!data || typeof data !== 'object') return false;
            const filled = value => Array.isArray(value) && value.length > 0;
            switch (docKey) {
                case 'threec': return filled(data.customer) && filled(data.competitor) && filled(data.company);
                case 'swot': return ['S', 'W', 'O', 'T'].every(key => filled(data[key]));
                case 'stp': return filled(data.segments) || filled(data.positioning && data.positioning.points);
                case 'mece': return filled(data.tree) || filled(data.rice);
                default: return false;
            }
        }

        // 문서 본문에서 claude -p로 시각화 데이터를 추출한다
        async function extractVizData(docKey, markdown, logCallback = null) {
            const raw = await callClaudeLocal(
                '당신은 기획 문서에서 차트용 구조화 데이터를 정확히 추출하는 데이터 분석가입니다. 문서에 근거한 값을 쓰고, 수치가 없으면 문서 맥락에서 보수적으로 추정합니다. JSON 외의 텍스트는 출력하지 않습니다.',
                `다음 문서에서 아래 규격의 시각화 데이터를 추출하라. 유효한 JSON 하나만 출력하라.\n\n[규격]\n${VIZ_SCHEMAS[docKey]}\n\n[문서]\n${markdown}`,
                logCallback
            );
            const data = parseVizJson(raw);
            if (!vizDataUsable(docKey, data)) throw new Error(t('추출한 데이터에 필수 항목이 비어 있습니다.', 'Extracted data is missing required fields.'));
            return data;
        }

        const withVizBlock = (markdown, data) => `${markdown.trimEnd()}\n\n\`\`\`pitl-viz\n${JSON.stringify(data, null, 2)}\n\`\`\`\n`;

        // 분석 파이프라인용: 생성 결과에 쓸 만한 시각화 데이터가 없으면 본문에서 바로 추출해 붙인다
        async function ensureVizData(docKey, content, logCallback = null) {
            if (!content || !content.trim()) return content;
            const { markdown, data } = splitVizBlock(content);
            if (vizDataUsable(docKey, data)) return content;
            if (logCallback) logCallback(t('시각화 데이터가 비어 있어 본문에서 자동 추출합니다.', 'Visualization data missing — extracting it from the document.'));
            try {
                const extracted = await extractVizData(docKey, markdown, logCallback);
                if (logCallback) logCallback(t('시각화 데이터 추출 완료.', 'Visualization data extracted.'));
                return withVizBlock(markdown, extracted);
            } catch (err) {
                if (logCallback) logCallback(t(`[시각화 추출 실패] ${err.message} — 문서 화면의 '시각화 생성'으로 다시 시도할 수 있습니다.`, `[Visualization extraction failed] ${err.message}`));
                return content;
            }
        }

        // 시각화 데이터가 없는 기존 문서: 본문에서 claude -p로 추출해 문서 끝에 붙인다
        async function generateVizForDoc(docKey) {
            if (!generatedDocs || !generatedDocs[docKey]) return;
            await window.PITL_PROXY_READY;
            if (!window.PITL_USE_LOCAL_PROXY) { showLocalServerRequired(); return; }
            const btn = document.getElementById('btn-viz-generate');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${t('차트 데이터 추출 중…', 'Extracting chart data…')}`;
            }
            const body = splitVizBlock(generatedDocs[docKey]).markdown;
            try {
                const data = await extractVizData(docKey, body);
                generatedDocs[docKey] = withVizBlock(body, data);
                saveClientHistoryLocally(generatedDocs, window.pitlActiveSessionDate);
                switchDocument(docKey);
            } catch (err) {
                pitlAlert(t('시각화 생성에 실패했습니다: ', 'Failed to generate charts: ') + vizEsc(err.message), 'error', t('시각화 생성 실패', 'Chart generation failed'));
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> ${t('시각화 생성', 'Generate charts')}`;
                }
            }
        }

        // Shared tooltip for chart marks (hover + keyboard focus)
        (function initVizTooltip() {
            let tip = null;
            const ensure = () => {
                if (!tip) {
                    tip = document.createElement('div');
                    tip.id = 'viz-tooltip';
                    tip.setAttribute('role', 'tooltip');
                    tip.hidden = true;
                    document.body.appendChild(tip);
                }
                return tip;
            };
            const place = (x, y) => {
                const el = ensure();
                const r = el.getBoundingClientRect();
                el.style.left = `${Math.min(window.innerWidth - r.width - 8, x + 14)}px`;
                el.style.top = `${Math.max(8, y - r.height - 12)}px`;
            };
            const show = (target, x, y) => {
                const el = ensure();
                el.textContent = target.getAttribute('data-tip');
                el.hidden = false;
                place(x, y);
            };
            const hide = () => { if (tip) tip.hidden = true; };
            document.addEventListener('pointerover', e => {
                const target = e.target.closest && e.target.closest('.viz-panel [data-tip]');
                if (target) show(target, e.clientX, e.clientY);
            });
            document.addEventListener('pointermove', e => {
                if (tip && !tip.hidden && e.target.closest && e.target.closest('.viz-panel [data-tip]')) place(e.clientX, e.clientY);
            });
            document.addEventListener('pointerout', e => {
                const target = e.target.closest && e.target.closest('.viz-panel [data-tip]');
                if (target && !target.contains(e.relatedTarget)) hide();
            });
            document.addEventListener('focusin', e => {
                const target = e.target.closest && e.target.closest('.viz-panel [data-tip]');
                if (!target) return;
                const r = target.getBoundingClientRect();
                show(target, r.left + r.width / 2, r.top);
            });
            document.addEventListener('focusout', hide);
        })();

        // ═══════════════════════════════════════════════════════════════════
        //  Artifact archive publishing — 분석이 끝난 기획서를 GitHub Pages 아카이브에 게시
        //  (서버 /api/archive/publish 가 아카이브 저장소에 커밋 1개로 반영)
        // ═══════════════════════════════════════════════════════════════════
        const ARCHIVE_DOCS = [
            ['1pager', '1-Pager 비즈니스 요약'], ['threec', '3C 환경 분석'], ['swot', 'SWOT · TOWS 전략'],
            ['stp', 'STP 타깃 포지셔닝'], ['mece', 'MECE · RICE 구조화'], ['prd', 'PRD 요구사항 명세'],
            ['wireframe', '와이어프레임 3안'], ['audit', 'QA 정합성 감사'], ['prototype', '서비스 UX 프로토타입']
        ];

        // 앱 스타일시트에서 색상 토큰(라이트/다크)과 차트 스타일을 그대로 가져온다 → 게시 페이지도 같은 디자인
        function collectArchiveCss() {
            const dark = {}, light = {}, rules = [];
            const take = (target, style) => { for (let i = 0; i < style.length; i++) { const prop = style[i]; if (prop.startsWith('--')) target[prop] = style.getPropertyValue(prop).trim(); } };
            for (const sheet of document.styleSheets) {
                let list;
                try { list = sheet.cssRules; } catch (e) { continue; } // 외부 CDN 스타일시트는 건너뜀
                for (const rule of list) {
                    if (rule.selectorText === ':root') take(dark, rule.style);
                    else if (rule.selectorText === '[data-theme="light"], body.light-theme') take(light, rule.style);
                    else if (/\.viz-|#viz-tooltip/.test(rule.cssText)) rules.push(rule.cssText);
                }
            }
            const decl = map => Object.entries(map).map(([k, v]) => `${k}: ${v};`).join(' ');
            return `:root { color-scheme: light; ${decl({ ...dark, ...light })} }
                @media (prefers-color-scheme: dark) { :root { color-scheme: dark; ${decl(dark)} } }
                ${rules.join('\n')}`;
        }

        function buildArchiveReportHtml(docs) {
            const esc = vizEsc;
            const title = docs.summaryTitle || summarizeIdeaToTitle(docs.idea || docs.title || '');
            const timings = docs.timings || null;
            const present = ARCHIVE_DOCS.filter(([key]) => (docs[key] || '').trim());
            const sections = present.map(([key, label]) => {
                const ms = timings && timings.steps ? timings.steps[key] : null;
                const time = ms != null ? `<p class="doc-time">${esc(t('분석 소요', 'Analysis time'))} ${esc(fmtDuration(ms))}</p>` : '<p class="doc-time"></p>';
                if (key === 'prototype') {

                        <a class="open" href="prototype.html" target="_blank" rel="noopener">${esc(t('새 창에서 열기 ↗', 'Open in a new tab ↗'))}</a></section>`;

                // 각 단계 분석 원문 전체를 그대로 싣는다 (요약·생략 없음, 차트 데이터 블록만 차트로 변환)
                const { markdown, data } = splitVizBlock(docs[key]);
                const md = markdown.trim();
                const viz = VIZ_DOC_KEYS.has(key) && vizDataUsable(key, data) ? renderFrameworkViz(key, data) : '';
                // 넓은 표는 가로 스크롤 래퍼로 감싸 본문 폭은 유지하고 표는 전체 폭을 채운다

                holder.innerHTML = renderMarkdownEnhanced(md);

            const total = timings && timings.totalMs ? `<span class="chip">${esc(t('총 분석 소요', 'Total analysis'))} ${esc(fmtDuration(timings.totalMs))}</span>` : '';

            const timingTable = timings && timings.steps && Object.keys(timings.steps).length ? `<section class="doc" id="timings"><h2>${esc(t('단계별 분석 소요시간', 'Analysis time by step'))}</h2><p class="doc-time"></p>

                ${ARCHIVE_DOCS.filter(([key]) => timings.steps[key] != null).map(([key, label]) => `<tr><td>${esc(label)}</td><td>${esc(fmtDuration(timings.steps[key]))}</td></tr>`).join('')}
                <tr><td><b>${esc(t('합계 (중간 검토 대기 제외)', 'Total (excluding review wait)'))}</b></td><td><b>${esc(fmtDuration(timings.totalMs))}</b></td></tr>
                ${timings.reviewWaitMs >= 1000 ? `<tr><td>${esc(t('중간 검토 대기', 'Review wait'))}</td><td>${esc(fmtDuration(timings.reviewWaitMs))}</td></tr>` : ''}
                </tbody></table></div></div></section>` : '';
            return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">

</div></header>
<nav class="toc" aria-label="${esc(t('문서 목차', 'Contents'))}"><div class="wrap">${present.map(([key, label]) => `<a href="#${key}">${esc(label)}</a>`).join('')}${timingTable ? `<a href="#timings">${esc(t('소요시간', 'Timing'))}</a>` : ''}</div></nav>
<main class="wrap">${sections}${timingTable}</main>
<footer class="wrap">${esc(t('Planning-in-the-Loop가 자동 생성한 기획서입니다. 시장 규모·점수 등 수치는 모델 추정치를 포함합니다.', 'Generated by Planning-in-the-Loop. Figures such as market sizes and scores include model estimates.'))}</footer>
<script>
const VIZ_LABELS = ${labels};
function toggleVizTable(btn) {
    const tableEl = btn.closest('.viz-card').querySelector('.viz-table');
    const open = tableEl.hidden;
    tableEl.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    btn.textContent = open ? VIZ_LABELS.hide : VIZ_LABELS.show;
}
(() => {
    const tip = document.createElement('div');
    tip.id = 'viz-tooltip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
    document.body.appendChild(tip);
    const place = (x, y) => { const r = tip.getBoundingClientRect(); tip.style.left = Math.min(innerWidth - r.width - 8, x + 14) + 'px'; tip.style.top = Math.max(8, y - r.height - 12) + 'px'; };
    const show = (el, x, y) => { tip.textContent = el.getAttribute('data-tip'); tip.hidden = false; place(x, y); };
    const find = e => e.target.closest && e.target.closest('[data-tip]');
    addEventListener('pointerover', e => { const el = find(e); if (el) show(el, e.clientX, e.clientY); });
    addEventListener('pointermove', e => { if (!tip.hidden && find(e)) place(e.clientX, e.clientY); });
    addEventListener('pointerout', e => { const el = find(e); if (el && !el.contains(e.relatedTarget)) tip.hidden = true; });
    addEventListener('focusin', e => { const el = find(e); if (el) { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); } });
    addEventListener('focusout', () => { tip.hidden = true; });
})();
<\/script>

        }

        function archiveDate(docs) {
            const key = (docs.archive && docs.archive.date) || window.pitlActiveSessionDate;
            if (/^\d{6}$/.test(key || '')) return `20${key.slice(0, 2)}-${key.slice(2, 4)}-${key.slice(4, 6)}`;
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // 아카이브 카드 썸네일 (960×540 JPEG, 아카이브 기존 썸네일과 같은 규격)
        async function buildArchiveThumb(docs) {
            try { await document.fonts.ready; } catch (e) { /* 기본 글꼴로 그림 */ }
            const W = 960, H = 540;
            const canvas = document.createElement('canvas');
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            const bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#F0EEE9'); bg.addColorStop(1, '#E6E2EE');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
            const accent = ctx.createLinearGradient(0, 0, W, 0);
            accent.addColorStop(0, '#6D4AFF'); accent.addColorStop(1, '#C9245A');
            ctx.fillStyle = accent; ctx.fillRect(0, 0, W, 10);
            // 오른쪽: 9개 문서 타일 모자이크
            const tileKeys = ['1pager', 'threec', 'swot', 'stp', 'mece', 'prd', 'wireframe', 'prototype', 'audit'];
            tileKeys.forEach((key, i) => {
                const x = 640 + (i % 3) * 92, y = 150 + Math.floor(i / 3) * 92;
                ctx.fillStyle = (docs[key] || '').trim() ? 'rgba(91, 59, 240, 0.16)' : 'rgba(27, 26, 31, 0.06)';
                ctx.beginPath(); ctx.roundRect(x, y, 80, 80, 16); ctx.fill();
                ctx.fillStyle = '#5B3BF0'; ctx.font = "700 20px 'Space Grotesk', 'Noto Sans KR', sans-serif";
                ctx.fillText(String(i + 1).padStart(2, '0'), x + 14, y + 34);
            });
            const wrap = (text, x, y, maxW, lineH, maxLines, font, color) => {
                ctx.font = font; ctx.fillStyle = color;
                const words = String(text || '').split(/\s+/);
                let line = '', lines = 0;
                for (let i = 0; i < words.length; i++) {
                    const test = line ? `${line} ${words[i]}` : words[i];
                    if (ctx.measureText(test).width > maxW && line) {
                        if (++lines === maxLines) { ctx.fillText(`${line}…`, x, y); return y + lineH; }
                        ctx.fillText(line, x, y); y += lineH; line = words[i];
                    } else line = test;
                }
                if (line) { ctx.fillText(line, x, y); y += lineH; }
                return y;
            };
            ctx.fillStyle = '#5B3BF0'; ctx.font = "700 20px 'Space Grotesk', 'Noto Sans KR', sans-serif";
            ctx.fillText('PITL 기획서', 64, 96);
            let y = wrap(docs.summaryTitle || summarizeIdeaToTitle(docs.idea || ''), 64, 172, 540, 62, 3, "800 50px 'Noto Sans KR', sans-serif", '#1B1A1F');
            wrap(docs.idea || '', 64, y + 18, 540, 30, 3, "400 21px 'Noto Sans KR', sans-serif", '#66616D');
            const total = docs.timings && docs.timings.totalMs ? ` · 총 ${fmtDuration(docs.timings.totalMs)}` : '';
            ctx.fillStyle = '#66616D'; ctx.font = "600 19px 'Noto Sans KR', sans-serif";
            ctx.fillText(`${archiveDate(docs)}${total}`, 64, H - 56);
            return canvas.toDataURL('image/jpeg', 0.86).split(',')[1];
        }

        function makeArchiveSlug() {
            const d = new Date();
            const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            const rand = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
            return `p-${ymd}-${rand}`;
        }

        // 기획서를 아카이브에 게시한다. auto=true(분석 완료 직후)면 서버 설정이 꺼져 있을 때 조용히 건너뜀
        async function publishPlanToArchive(docs, { auto = false } = {}) {
            const say = msg => { if (typeof logAgentClientSide === 'function') logAgentClientSide('system', msg); };
            if (!docs || !(docs.audit || docs.prototype || docs['1pager'])) return null;
            let status;
            try { status = await fetch('/api/archive/status').then(r => r.json()); } catch (e) { status = null; }
            if (!status) { if (!auto) pitlAlert(t('아카이브 서버 상태를 확인하지 못했습니다.', 'Could not reach the archive service.'), 'error'); return null; }
            if (auto && !status.autoPublish) return null;
            if (!status.authenticated) {
                const msg = t('GitHub 인증 정보가 없어 아카이브 게시를 건너뜁니다. (.env의 GITHUB_TOKEN 또는 gh auth login)', 'Skipping archive publish: no GitHub credentials.');
                say(`📦 ${msg}`);
                if (!auto) pitlAlert(msg, 'warn', t('아카이브 게시', 'Archive'));
                return null;
            }

            const slug = (docs.archive && docs.archive.slug) || makeArchiveSlug();
            const dateKey = (docs.archive && docs.archive.date) || window.pitlActiveSessionDate || null;
            say(t(`📦 아카이브 게시 준비 중… (${status.repo})`, `📦 Preparing archive publish… (${status.repo})`));
            try {
                const files = {
                    report: buildArchiveReportHtml(docs),
                    prototype: docs.prototype ? extractPureHtmlCode(docs.prototype, docs.title || 'pitl', docs.idea || '') : '',
                    thumbJpegBase64: await buildArchiveThumb(docs)
                };
                const item = {
                    title: docs.summaryTitle || summarizeIdeaToTitle(docs.idea || docs.title || ''),
                    desc: String(docs.idea || '').replace(/\s+/g, ' ').trim().slice(0, 140),
                    tags: ['PITL', t('상품기획', 'Product planning')],
                    date: archiveDate(docs)
                };
                const res = await fetch('/api/archive/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slug, item, files })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
                docs.archive = { slug, url: data.url, commit: data.commit, publishedAt: new Date().toISOString(), date: dateKey };
                saveClientHistoryLocally(docs, window.pitlActiveSessionDate);
                say(t(`📦 아카이브 게시 완료: ${data.url} (GitHub Pages 반영까지 1~2분)`, `📦 Published to the archive: ${data.url} (live in 1-2 min)`));
                showCompletionToast(t('기획서를 아카이브에 게시했습니다.', 'Plan published to the archive.'));
                return data.url;
            } catch (err) {
                say(t(`📦 [아카이브 게시 실패] ${err.message}`, `📦 [Archive publish failed] ${err.message}`));
                if (!auto) pitlAlert(t('아카이브 게시에 실패했습니다: ', 'Archive publish failed: ') + vizEsc(err.message), 'error', t('아카이브 게시', 'Archive'));
                return null;
            }
        }

        async function publishFromDashboard() {
            const btn = document.getElementById('btn-archive-publish');
            if (btn) { btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${t('게시 중…', 'Publishing…')}`; }

        function archiveBarHtml() {
            if (!generatedDocs || !(generatedDocs.audit || generatedDocs.prototype)) return '';
            const pub = generatedDocs.archive;

                <span><i class="fa-solid fa-box-archive"></i> ${pub && pub.url

                    : t('아직 아카이브에 게시되지 않았습니다', 'Not published to the archive yet')}</span>

                    <i class="fa-solid fa-cloud-arrow-up"></i> ${pub && pub.url ? t('다시 게시', 'Republish') : t('아카이브에 게시', 'Publish')}

        function renderMarkdownEnhanced(mdRaw) {
            if (!mdRaw) return '';
            
            // 1. Convert ==text== to <mark>text</mark> soft highlight
            let processed = mdRaw.replace(/==(.*?)==/g, '<mark>$1</mark>');
            
            // 2. Transform GitHub-style blockquote callouts (> [!NOTE], > [!IMPORTANT], etc.)
            processed = processed.replace(/^>\s*\[\!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/gmi, (match, type, content) => {
                const typeLower = type.toLowerCase();
                const icons = {
                    note: 'fa-circle-info',
                    tip: 'fa-lightbulb',
                    important: 'fa-star',
                    warning: 'fa-triangle-exclamation',
                    caution: 'fa-circle-exclamation'
                };
                const icon = icons[typeLower] || 'fa-circle-info';
                return `> **<i class="fa-solid ${icon}"></i> ${type.toUpperCase()}**: ${content}`;
            });

            return marked.parse(processed);
        }

        // Render Tile UI Dashboard View
        // 완료 대시보드 상단 숫자 줄: 문서 수 · 총 소요 · QA 점수 · 검토 대기
        function dashboardStatsHtml() {
            if (!generatedDocs) return '';
            const keys = ['1pager', 'threec', 'swot', 'stp', 'mece', 'prd', 'wireframe', 'prototype', 'audit'];

            const tim = generatedDocs.timings || null;

            const stat = (v, k, cls = '') => `<div class="dash-stat"><div class="dash-stat-v ${cls}">${v}</div><div class="dash-stat-k">${k}</div></div>`;
            return `<div class="dash-stats">

        // ── Pure HTML Code Extractor from AI raw output or fallback ──
        function extractPureHtmlCode(raw, title, idea) {
            if (!raw || typeof raw !== 'string') {
                return generateFallbackDoc('prototype', title || 'Product', idea || '');
            }

            let code = raw.trim();

            // 1. Check for markdown code blocks (```html ... ``` or ```xml ... ```)
            const codeBlockMatch = code.match(/```(?:html|xml)?\s*([\s\S]*?)```/i);
            if (codeBlockMatch && codeBlockMatch[1]) {
                code = codeBlockMatch[1].trim();
            }

            // 2. Check for <!DOCTYPE html> ... </html>
            const doctypeIdx = code.search(/<!doctype/i);
            if (doctypeIdx !== -1) {
                code = code.slice(doctypeIdx);
            } else {
                const htmlTagIdx = code.search(/<html/i);
                if (htmlTagIdx !== -1) {
                    code = '<!DOCTYPE html>\n' + code.slice(htmlTagIdx);
                }
            }

            // Trim trailing markdown or explanations after </html>
            const closeHtmlIdx = code.search(/<\/html>/i);
            if (closeHtmlIdx !== -1) {
                code = code.slice(0, closeHtmlIdx + 7);
            }

            // 3. If extracted code contains basic HTML tags, return it
            if (code.includes('<body') || code.includes('<div') || code.includes('<script') || code.includes('<style')) {
                if (!code.toLowerCase().includes('<!doctype html>')) {
                    code = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>${title || 'Prototype'}</title></head><body>${code}</body></html>`;
                }
                return code;
            }

            // 4. If AI returned purely plain text / markdown description, generate mobile prototype
            return generateFallbackDoc('prototype', title || 'Product', idea || raw);
        }

                            <button onclick="downloadPrototype()" style="display:flex; align-items:center; gap:6px; background:var(--sb-accent); border:none; color:#ffffff; padding:6px 14px; border-radius:50px; font-size:12.5px; font-weight:600; cursor:pointer; transition:all 0.15s;" title="${t('HTML 파일 다운로드', 'Download HTML')}">

                    <div class="prototype-viewport-area">
                        <div class="preview-frame mode-${currentDeviceMode}" id="device-frame-shell">

                                <span class="label" id="prototype-frame-label">${vizEsc(screens[0] ? screens[0].title : (idea || title))}</span>
                            </div>
                            <!-- 샌드박스: 앱과 다른 origin으로 실행 (프로토타입 스크립트가 앱 저장소에 접근하지 못함) -->

                </div>`;
        }

        // 프로토타입 HTML에서 data-screen 화면 목록을 읽는다 (스크립트는 실행하지 않는 파싱)
        function extractPrototypeScreens(html) {
            try {
                const doc = new DOMParser().parseFromString(html, 'text/html');
                return [...doc.querySelectorAll('[data-screen]')]
                    .map(el => ({ id: el.getAttribute('data-screen') || '', title: el.getAttribute('data-title') || el.getAttribute('data-screen') || '' }))
                    .filter((s, i, all) => /^[A-Za-z0-9_-]+$/.test(s.id) && all.findIndex(x => x.id === s.id) === i)
                    .slice(0, 12);
            } catch (e) {
                return [];
            }
        }

        // 흐름 단계 클릭 → iframe 해시만 바꿔 해당 화면으로 이동 (프로토타입의 hashchange 라우팅)
        function goPrototypeScreen(id) {
            const iframe = document.getElementById('prototype-iframe');
            if (!iframe || !window.pitlPrototypeBlobUrl) return;
            iframe.src = `${window.pitlPrototypeBlobUrl}#${id}`;
            let label = '';
            document.querySelectorAll('.flow-step').forEach(btn => {
                const active = btn.dataset.screen === id;
                btn.classList.toggle('active', active);
                if (active) label = btn.textContent.replace(/^\d+/, '').trim();
            });
            const labelEl = document.getElementById('prototype-frame-label');
            if (labelEl && label) labelEl.textContent = label;
        }

        function switchDeviceMode(mode) {
            currentDeviceMode = mode;
            const shell = document.getElementById('device-frame-shell');
            if (shell) {
                shell.className = `preview-frame mode-${mode}`;

            ['mobile', 'tablet', 'desktop'].forEach(m => {
                const btn = document.getElementById(`dev-btn-${m}`);
                if (btn) btn.classList.toggle('active', m === mode);
            });
        }

        function reloadPrototypeFrame() {
            const iframe = document.getElementById('prototype-iframe');
            if (iframe) {
                const src = iframe.src;
                iframe.src = '';
                setTimeout(() => { iframe.src = src; }, 50);
            }
        }

        function downloadPrototype() {
            const rawContent = generatedDocs ? (generatedDocs['prototype'] || '') : '';
            const title = generatedDocs ? (generatedDocs['title'] || 'pitl') : 'pitl';
            const idea = generatedDocs ? (generatedDocs['idea'] || '') : '';
            const pureHtml = extractPureHtmlCode(rawContent, title, idea);
            if (!pureHtml) return;
            const blob = new Blob([pureHtml], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `prototype_${title}.html`;
            a.click();
        }

        function openPrototypeFullscreen() {
            const rawContent = generatedDocs ? (generatedDocs['prototype'] || '') : '';
            const title = generatedDocs ? (generatedDocs['title'] || 'pitl') : 'pitl';
            const idea = generatedDocs ? (generatedDocs['idea'] || '') : '';
            const pureHtml = extractPureHtmlCode(rawContent, title, idea);
            if (!pureHtml) return;
            const blob = new Blob([pureHtml], { type: 'text/html;charset=utf-8' });
            window.open(URL.createObjectURL(blob), '_blank');
        }

        // Render interactive ASCII wireframe container
        function renderWireframesContainer(targetArea) {
            targetArea.innerHTML = `
                <div class="document-wrapper" style="padding: 24px;">
                    <div class="stage-methodology-header" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
                        <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; border-bottom: none; padding-bottom: 0;">
                            <span style="display: inline-block; width: 6px; height: 24px; background: var(--accent-neon); border-radius: 3px; flex-shrink: 0;"></span>
