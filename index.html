        .history-live-meta { color: rgb(var(--accent-rgb)) !important; font-weight: 700; }
        .history-group[hidden], .history-row[hidden] { display: none !important; }

        /* ══ 테마 전환: 우측 상단 세그먼트 ══ */
        .theme-seg { display: inline-flex; border: 1px solid var(--border-color); border-radius: 999px; padding: 3px; background: var(--bg-card); }
        .theme-seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font: 500 13px 'Noto Sans KR', sans-serif; color: var(--text-secondary); cursor: pointer; }
        .theme-seg button:hover { color: var(--text-primary); }
        .theme-seg button[aria-pressed="true"] { background: rgba(var(--accent-rgb), .14); color: var(--text-primary); font-weight: 700; }
        .theme-seg button:focus-visible { outline: 2px solid rgb(var(--accent-rgb)); outline-offset: 1px; }
        .landing-theme-corner { position: fixed; top: 16px; right: 20px; z-index: 60; }
        body:not(.state-landing) .landing-theme-corner { display: none; }
        .chrome-title-bar.pitl-rail-bar { position: relative; }
        .plan-actions { position: absolute; top: 16px; right: 28px; display: flex; gap: 8px; align-items: center; z-index: 5; }
        .plan-btn { border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); border-radius: 999px; padding: 7px 16px; font: 600 13px 'Noto Sans KR', sans-serif; cursor: pointer; }
        .plan-btn:hover { border-color: rgba(var(--accent-rgb), .45); }
        .plan-btn[hidden] { display: none; }
        .plan-btn-icon { width: 36px; padding: 7px 0; text-align: center; }
        .plan-head { padding-right: 360px; }
        .chrome-title-bar.pitl-rail-bar:has(.plan-head[hidden]) { padding-top: 64px !important; }
        @media (max-width: 900px) { .plan-actions { position: static; justify-content: flex-end; margin-bottom: 8px; } .plan-head { padding-right: 0; } }
        .sidebar-panel .sidebar-settings-wrap { display: none; }
        .sidebar-empty-state[hidden] { display: none !important; }

        /* ══ 아이콘 버튼 · 뒤로 가기 · 맨 위로 ══ */
        .theme-seg button { width: 32px; height: 28px; padding: 0 !important; display: inline-grid; place-items: center; font-size: 13px !important; }
        .plan-btn-icon { width: 36px; height: 36px; padding: 0 !important; display: inline-grid; place-items: center; font-size: 14px; }
        .plan-btn-icon.on { background: rgba(var(--accent-rgb), .14); border-color: rgba(var(--accent-rgb), .35); }
        .plan-back { border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; cursor: pointer; margin-right: 6px; padding: 0; }
        .plan-back:hover { border-color: rgba(var(--accent-rgb), .45); }
        .plan-back[hidden] { display: none; }
        .plan-crumb { align-items: center; }
        .plan-head { padding-right: 300px; }
        .scroll-top-btn { position: fixed; right: 24px; bottom: 24px; z-index: 950; display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--border-color); background: color-mix(in srgb, var(--bg-card) 80%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: var(--text-primary); font: 700 12px 'Space Grotesk', sans-serif; letter-spacing: .08em; box-shadow: var(--shadow-card), 0 8px 24px rgba(0, 0, 0, .14); cursor: pointer; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .2s, transform .2s; }
        .scroll-top-btn.show { opacity: 1; transform: none; pointer-events: auto; }
        .scroll-top-btn:hover { border-color: rgba(var(--accent-rgb), .45); }
        @media (prefers-reduced-motion: reduce) { .scroll-top-btn { transition: none; } }

        /* ══ 첫 화면 우측: 점 잇기 애니메이션 ══ */
        .landing-dots { display: none; }
        @media (min-width: 1280px) {
            body.state-landing .landing-view-container { flex-direction: row; justify-content: center; column-gap: clamp(40px, 5vw, 88px); }
            /* 두 칸이 한 줄에 들어가도록: 본문 폭 = 화면 - 여백 - 애니메이션 - 간격 (최대 760px) */
            .landing-view-container .landing-content { max-width: 760px; flex: 0 0 min(760px, calc(100vw - 48px - clamp(380px, 34vw, 620px) - clamp(40px, 5vw, 88px) - 8px)); }
            .landing-dots { display: flex; flex-direction: column; align-items: center; gap: 40px; flex: 0 0 clamp(380px, 34vw, 620px); position: relative; z-index: 2; margin-top: var(--sp-6, 48px); }
            /* 배경 점은 애니메이션 주변에서만 부드럽게 사라진다 (테마와 무관한 투명도 마스크라 경계가 보이지 않음) */
            body.state-landing #space-particle-canvas { -webkit-mask-image: radial-gradient(circle at var(--dots-x, 78%) var(--dots-y, 46%), transparent 0, transparent calc(var(--dots-r, 220px) * .45), #000 var(--dots-r, 220px)); mask-image: radial-gradient(circle at var(--dots-x, 78%) var(--dots-y, 46%), transparent 0, transparent calc(var(--dots-r, 220px) * .45), #000 var(--dots-r, 220px)); }
        }
        #landing-dots-canvas { width: 100%; aspect-ratio: 1 / 1.08; display: block; }
        .landing-dots-caption { margin: 0; min-height: 18px; font: 400 12px/1.4 'Space Grotesk', 'Noto Sans KR', sans-serif; letter-spacing: -0.16px; color: var(--text-secondary); text-align: center; opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease; }
        .landing-dots-caption.show { opacity: 1; transform: none; }

        /* ══ 최근 기획서: 화면 가로 끝까지 ══ */
        .landing-view-container > .landing-history-section { flex: none; width: calc(100% + 48px); max-width: none; margin: 8px -24px 0; z-index: 2; position: relative; }
        @media (min-width: 1280px) {
            body.state-landing .landing-view-container { flex-wrap: wrap; align-content: safe center; align-items: flex-start; }
            .landing-view-container > .landing-history-section { flex: 0 0 calc(100% + 48px); }
        }
        .landing-view-container > .landing-history-section .landing-history-marquee-wrapper { mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%); -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%); }
        .landing-view-container > .landing-history-section .starter-empty { max-width: 960px; margin: 0 auto; }
        @media (prefers-reduced-motion: reduce) { .landing-dots-caption { transition: none; } }

        /* ══ 최근 기획서 타일: 한 단계 작게 (220×97 → 184×~78) ══ */
        .landing-history-grid { gap: 12px !important; }
        .landing-history-card { flex: 0 0 184px !important; width: 184px !important; border-radius: 14px !important; }
        .landing-history-card .landing-card-content { padding: 9px 11px !important; gap: 4px !important; }
        .landing-history-card .landing-card-title { font-size: 12.5px !important; line-height: 1.4; }
        .landing-history-card .landing-card-title i { margin-right: 4px !important; font-size: 11px; }
        .landing-history-card .landing-card-idea { font-size: 10.5px !important; margin: 2px 0 !important; max-width: 100% !important; line-height: 1.4 !important; }
        .landing-history-card .landing-card-footer { font-size: 10.5px !important; line-height: 1.4 !important; }
        .landing-history-card .landing-card-badge { font-size: 10px !important; padding: 1px 6px !important; letter-spacing: 0 !important; }
        .landing-history-card .btn-delete-history { font-size: 11px; }

        /* ══ 라이트 테마 대비 보정 (WCAG AA) ══ */
        [data-theme="light"] .dash-stat-v.good { color: #0B7A5A; }
        [data-theme="light"] .pitl-modal-btn-primary { color: #ffffff !important; }
        [data-theme="light"] .tile-card .tile-status { color: #065F46 !important; }
        [data-theme="light"] .slot-nudge.warn { color: #845A00; }

        /* ══ 알림 토스트 · 터미널 · 편집기: 테마 토큰 적용 (어두운 고정 배경 제거) ══ */
        .pitl-toast-container { background: color-mix(in srgb, var(--bg-card) 92%, transparent) !important; color: var(--text-primary) !important; border: 1px solid var(--border-color) !important; box-shadow: var(--shadow-card), 0 12px 32px rgba(0, 0, 0, .16) !important; }
        [data-theme="light"] .pitl-toast-icon { color: #0B7A5A; background: rgba(11, 122, 90, .12); box-shadow: none; animation: none; }
        [data-theme="light"] .terminal-container,
        [data-theme="light"] .editor-textarea-custom { background: rgba(var(--hairline-rgb), .04) !important; color: var(--text-primary) !important; }
        [data-theme="light"] .chat-follow-up-bar { background: var(--bg-card); }

        /* ══ 공유 · 내보내기 메뉴 ══ */
        .export-wrap { position: relative; }
        .export-wrap[hidden] { display: none; }
        .export-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 250px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; box-shadow: var(--shadow-card), 0 14px 36px rgba(0, 0, 0, .16); padding: 6px; display: grid; gap: 2px; z-index: 80; }
        .export-menu[hidden] { display: none; }
        .export-menu button { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; border: 0; background: none; text-align: left; padding: 9px 10px; border-radius: 10px; font: 13.5px 'Noto Sans KR', sans-serif; color: var(--text-primary); cursor: pointer; }
        .export-menu button[hidden] { display: none; }
        .export-menu button i { color: rgb(var(--accent-rgb)); text-align: center; }
        .export-menu button small { display: block; font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; }
        .export-menu button:hover, .export-menu button:focus-visible { background: rgba(var(--hairline-rgb), .06); }
        .export-menu button:focus-visible { outline: none !important; box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .45); }

        /* 대시보드 타일 컬러 줄: 위 → 아래 */
        .tile-card.ready::before { inset: auto 0 0 0 !important; }
        .tile-card { overflow: hidden; }

        /* 선택 상태가 다크에서도 분명히 보이게: 선택은 채운 보라 + 흰 아이콘, 나머지는 한 단계 흐리게 */
        [data-theme="dark"] .theme-seg button { color: rgba(240, 238, 233, .55); }
        [data-theme="dark"] .theme-seg button:hover { color: var(--text-primary); }
        [data-theme="dark"] .theme-seg button[aria-pressed="true"] { background: rgb(var(--accent-rgb)); color: #fff; box-shadow: 0 2px 10px rgba(var(--accent-rgb), .45); }
        [data-theme="dark"] .plan-btn-icon.on { background: rgb(var(--accent-rgb)); border-color: rgb(var(--accent-rgb)); color: #fff; box-shadow: 0 2px 10px rgba(var(--accent-rgb), .45); }

        /* ══ 최근 기획서: 두 줄 반대 방향, 낮은 타일 ══ */
        .landing-history-marquee-wrapper { display: flex; flex-direction: column; gap: 10px; }
        .landing-history-grid.reverse { animation-direction: reverse !important; }
        .landing-history-grid[hidden] { display: none !important; }
        .landing-history-card .landing-card-idea { display: none !important; }
        .landing-history-card .landing-card-content { padding: 8px 11px !important; gap: 3px !important; }
</style>
</head>
<body class="state-landing dark-theme">

    <!-- Password Lock Screen Overlay -->
    <div id="pitl-password-overlay" class="password-overlay-wrapper" style="display: none;">
        <div class="password-card">
            <div class="password-card-glow"></div>
            <div class="password-header">
                <div class="password-logo">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 class="password-title">PITL Agent</h2>
                <p class="password-subtitle" data-i18n="password_subtitle">
                    Planning-in-the-Loop Agentic Workspace가 암호화되어 있습니다.<br>
                    비밀번호를 입력하세요.
                </p>
            </div>
            
            <div class="password-input-group">
                <div class="password-input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="pitl-password-input" placeholder="암호입력" data-i18n-placeholder="password_placeholder" onkeydown="handlePasswordKeydown(event)">
                    <button class="password-toggle-btn" onclick="togglePasswordVisibility()">
                        <i class="fa-regular fa-eye" id="password-eye-icon"></i>
                    </button>
                </div>
                <div id="password-error-message" class="password-error" data-i18n="password_error">올바르지 않은 암호입니다. 다시 시도해 주세요.</div>
            </div>
            
            <button class="password-submit-btn" onclick="checkMasterPassword()">
                <span data-i18n="unlock_btn">접근 해제</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- ========================================================
         PITL Custom Alert Modal (replaces all native alert())
         ======================================================== -->
    <div id="pitl-alert-overlay" style="
        display:none; position:fixed; inset:0; z-index:99999;
        background:rgba(0,0,0,0.65); backdrop-filter:blur(8px);
        align-items:center; justify-content:center;
        animation: fadeInOverlay 0.2s ease;">
        <div id="pitl-alert-card" style="
            position:relative; background:var(--bg-card, #131c2e);
            border:1px solid rgba(255,255,255,0.1); border-radius:20px;
            padding:36px 32px 28px; max-width:420px; width:90%;
            box-shadow:0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
            animation: slideUpModal 0.25s cubic-bezier(0.34,1.56,0.64,1);">
            <!-- Glow -->
            <div style="position:absolute;top:-1px;left:50%;transform:translateX(-50%);
                width:60%;height:2px;background:linear-gradient(90deg,transparent,var(--accent-neon),transparent);
                border-radius:999px;"></div>
            <!-- Icon -->
            <div id="pitl-alert-icon-wrap" style="
                width:52px;height:52px;border-radius:14px;
                display:flex;align-items:center;justify-content:center;
                font-size:22px;margin:0 auto 18px;
                background:rgba(var(--accent-rgb), 0.1); color:var(--accent-text);">
                <i id="pitl-alert-icon" class="fa-solid fa-circle-info"></i>
            </div>
            <!-- Title -->
            <h3 id="pitl-alert-title" style="
                font-family:'Space Grotesk',sans-serif; font-size:17px;
                font-weight:700; color:var(--text-primary,#e8eaf6);
                text-align:center; margin:0 0 10px;"></h3>
            <!-- Message -->
            <p id="pitl-alert-message" style="
                font-size:13.5px; color:var(--text-secondary,#8892aa);
                text-align:center; line-height:1.7; margin:0 0 24px;
                user-select:text; cursor:text;"></p>
            <!-- Buttons -->
            <div id="pitl-alert-buttons" style="display:flex;gap:10px;justify-content:center;"></div>
        </div>
    </div>

    <style>
        @keyframes fadeInOverlay { from{opacity:0} to{opacity:1} }
        @keyframes slideUpModal  { from{opacity:0;transform:translateY(24px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
        .pitl-modal-btn {
            flex:1; max-width:160px; height:40px; border-radius:10px; border:none;
            font-size:13.5px; font-weight:600; cursor:pointer;
            display:flex; align-items:center; justify-content:center; gap:6px;
            transition:all 0.18s ease;
        }
        .pitl-modal-btn-primary {
            background:var(--accent-neon); color:#0a0f1a;
        }
        .pitl-modal-btn-primary:hover { filter:brightness(1.12); transform:translateY(-1px); }
        .pitl-modal-btn-secondary {
            background:rgba(255,255,255,0.06); color:var(--text-secondary,#8892aa);
            border:1px solid rgba(255,255,255,0.1);
        }
        .pitl-modal-btn-secondary:hover { background:rgba(255,255,255,0.1); color:var(--text-primary,#e8eaf6); }
        .pitl-modal-btn-danger { background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.3); }
        .pitl-modal-btn-danger:hover { background:rgba(239,68,68,0.25); }
    </style>

    <!-- 3D PERSPECTIVE BACKGROUND STACK -->
    <div class="perspective-container">
        <!-- Infinite flowing perspective grid floor -->
        <div class="neon-grid-bg"></div>
    </div>

    <!-- 2. Slow-Flowing Animated Aurora Gradient Blobs (Neon.com inspired) -->
    <div class="aurora-container">
        <div class="aurora-blob blob-green"></div>
        <div class="aurora-blob blob-blue"></div>
        <div class="aurora-blob blob-purple"></div>
    </div>

    <!-- 3. Floating 3D depth Parallax Dust Canvas (Supports Shattering/Exploding Physics!) -->
    <canvas id="canvas-backplane"></canvas>

    <!-- ==========================================================================
       1. LANDING PAGE STATE VIEW
       ========================================================================== -->
    <div class="landing-view-container">
        <div class="landing-theme-corner">
                    <div class="theme-seg" role="group" aria-label="테마">
                        <button type="button" data-theme-mode="system" aria-pressed="false" onclick="setThemeMode('system')" title="시스템 설정 따르기" aria-label="시스템 테마"><i class="fa-solid fa-desktop"></i></button>
                        <button type="button" data-theme-mode="light" aria-pressed="false" onclick="setThemeMode('light')" title="라이트" aria-label="라이트 테마"><i class="fa-solid fa-sun"></i></button>
                        <button type="button" data-theme-mode="dark" aria-pressed="false" onclick="setThemeMode('dark')" title="다크" aria-label="다크 테마"><i class="fa-solid fa-moon"></i></button>
                    </div>
        </div>
        <!-- Interactive Space Particle Network Canvas -->
        <canvas id="space-particle-canvas"></canvas>
        
        <!-- Landing Centered Content -->
        <div class="landing-content">
            <div class="landing-header">
                <h1 class="landing-title" id="landing-title"><span class="title-pitl">PITL.</span><span class="title-full">Planning-in-the-loop</span></h1>
            </div>

            <!-- Glowing Centered Prompt Input Box (Supports 3D Card Tilt) -->
            <div class="manus-prompt-container">
                <div class="prompt-box-inner">
                    <textarea id="idea-textarea" placeholder="아이디어/타겟유저/경쟁사를 입력하세요." data-i18n-placeholder="prompt_placeholder" onkeydown="handleLandingKeydown(event)"></textarea>
                    <button class="prompt-submit-btn" onclick="startPlanningFromLanding()" id="btn-submit-planning" title="기획 생성 시작">START</button>
                </div>
                <div class="prompt-slots" id="prompt-slots">
                    <div class="slot-chips">
                        <button type="button" class="slot-chip" data-slot="idea"><span class="slot-dot">✓</span>아이디어</button>
                        <button type="button" class="slot-chip" data-slot="target"><span class="slot-dot">✓</span>타겟유저</button>
                        <button type="button" class="slot-chip" data-slot="comp"><span class="slot-dot">✓</span>경쟁사</button>
                    </div>
                    <div class="slot-status"><span class="slot-meter" aria-hidden="true"><i></i><i></i><i></i></span><span class="slot-nudge" id="slot-nudge" aria-live="polite"></span></div>
                </div>
            </div>

            <!-- 실행 옵션: 중간 검토 on/off (MECE 후 멈춤 여부) -->
            <div class="run-options">
                <button type="button" class="review-toggle" id="toggle-mid-review" role="switch" aria-checked="true" onclick="toggleMidReview()">
                    <span class="review-toggle-track" aria-hidden="true"><span class="review-toggle-thumb"></span></span>
                    <span class="review-toggle-text">
                        <b id="mid-review-label">중간 검토 ON</b>
                        <small id="mid-review-desc">MECE 분석까지 마친 뒤 멈추고, 검토 후 2단계를 진행합니다</small>
                    </span>
                </button>
                <button type="button" class="review-toggle" id="toggle-archive-upload" role="switch" aria-checked="true" onclick="toggleArchiveUpload()">
                    <span class="review-toggle-track" aria-hidden="true"><span class="review-toggle-thumb"></span></span>
                    <span class="review-toggle-text">
                        <b id="archive-upload-label">통합기획서 업로드 ON</b>
                        <small id="archive-upload-desc">분석이 끝나면 아카이브(GitHub Pages)에 자동 게시합니다</small>
                    </span>
                </button>
            </div>

        </div>

        <!-- 우측: 점이 이어져 기획이 되는 애니메이션 -->

            <canvas id="landing-dots-canvas"></canvas>
            <p class="landing-dots-caption" id="landing-dots-caption"></p>
        </aside>

        <!-- Recent Planning Runs Divider & Marquee -->
        <div class="landing-history-section">
            <div class="section-divider-title" data-i18n="history_section_title">최근 생성된 완공 기획안 히스토리</div>
            <div class="landing-history-marquee-wrapper">
                <div class="landing-history-grid" id="landing-history-list">
                    <!-- History cards injected here (doubled for seamless loop) -->
                </div>
                <div class="landing-history-grid reverse" id="landing-history-list-2" hidden></div>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
       2. 3-PANEL WORKSPACE STATE VIEW
       ========================================================================== -->
    <div class="workspace-view-container">
        <!-- Sidebar Backdrop Overlay -->
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
        
        <!-- PANEL 1: LEFT SIDEBAR (History, Actions, Reset) -->
        <aside class="sidebar-panel" id="panel-sidebar">
            <div class="sidebar-logo-container" onclick="resetToLanding()" style="cursor: pointer;" title="첫 화면으로 이동">
                <h3>PITL Workspace</h3>
            </div>
            
            <button class="new-plan-btn" onclick="startNewPlan()" data-i18n="new_plan_btn">
                <span><i class="fa-solid fa-plus"></i> 새 기획</span><kbd class="kbd-hint">⌘K</kbd>
            </button>
            <input type="search" class="history-search" id="history-search" placeholder="기획서 검색" data-i18n-placeholder="history_search_placeholder" oninput="filterHistoryRows(this.value)" aria-label="기획서 검색">
            
            <div class="sidebar-menu-section">

            <!-- Sidebar Footer (Agent Status & Bottom-Right Gear Settings) -->
            <div class="sidebar-footer">

                    <span class="status-dot-pulse"></span>
                    <span style="font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px;">AGENTS ACTIVE</span>
                </div>
                
                <div class="sidebar-settings-wrap" style="position: relative;">
                    <button class="sidebar-gear-btn" id="btn-sidebar-gear" onclick="toggleSidebarSettingsPopover(event)" title="설정 (테마)">
                        <i class="fa-solid fa-gear"></i>
                        <span id="proxy-badge-sidebar" style="display:none;position:absolute;top:-2px;right:-2px;width:10px;height:10px;background:var(--sb-accent);border-radius:50%;border:2px solid var(--bg-base,#0b1613);"></span>

                </div>

        </aside>

        <!-- Sidebar-Main Resizer Bar -->
        <div class="resizer-bar" id="resizer-left" title="좌측 히스토리 패널 너비 조절"></div>

        <!-- MAIN PANEL: RIGHT PANEL (Manus's Computer Browser Mockup) -->
        <main class="computer-panel" id="panel-computer">
            
            <!-- Browser Chrome Frame -->
            <div class="computer-chrome">
                
                <!-- Chrome top title bar with navigation controls & tabs -->
                <div class="chrome-title-bar pitl-rail-bar">
                    <!-- 우측 상단: 테마 · 공유 · 더 보기 -->
                    <div class="plan-actions">
                        <button type="button" class="plan-btn plan-btn-icon" id="btn-plan-dashboard" onclick="switchDocument('dashboard')" title="타일 대시보드" aria-label="타일 대시보드" hidden><i class="fa-solid fa-table-cells-large"></i></button>
                    <div class="theme-seg" role="group" aria-label="테마">
                        <button type="button" data-theme-mode="system" aria-pressed="false" onclick="setThemeMode('system')" title="시스템 설정 따르기" aria-label="시스템 테마"><i class="fa-solid fa-desktop"></i></button>
                        <button type="button" data-theme-mode="light" aria-pressed="false" onclick="setThemeMode('light')" title="라이트" aria-label="라이트 테마"><i class="fa-solid fa-sun"></i></button>
                        <button type="button" data-theme-mode="dark" aria-pressed="false" onclick="setThemeMode('dark')" title="다크" aria-label="다크 테마"><i class="fa-solid fa-moon"></i></button>
                    </div>
                        <div class="export-wrap" id="export-wrap" hidden>

                            <div class="export-menu" id="export-menu" role="menu" hidden>
                                <button type="button" role="menuitem" id="export-link" onclick="runExport('link')" hidden><i class="fa-solid fa-link"></i><span>링크 복사 <small>아카이브</small></span></button>
                                <button type="button" role="menuitem" id="export-native" onclick="runExport('native')" hidden><i class="fa-solid fa-share-nodes"></i><span>시스템 공유… <small>메일 · 메신저 · AirDrop</small></span></button>
                                <button type="button" role="menuitem" onclick="runExport('page')"><i class="fa-solid fa-file-arrow-down"></i><span>HTML 문서 내려받기 <small>모든 분석을 한 페이지로</small></span></button>
                                <button type="button" role="menuitem" onclick="runExport('slides')"><i class="fa-solid fa-person-chalkboard"></i><span>HTML 슬라이드 내려받기 <small>발표용 · ← → 키로 넘김</small></span></button>

                        </div>
                        <button type="button" class="plan-btn plan-btn-icon" id="btn-plan-rerun" onclick="confirmRerunPlan()" title="같은 아이디어로 다시 실행" aria-label="같은 아이디어로 다시 실행" hidden><i class="fa-solid fa-rotate-right"></i></button>

                    </div>

                    <!-- 한 줄 파이프라인 레일 (1단계 5개 · 중간 검토 · 2단계 4개) -->
                    <div class="circle-tab-bar-container pipeline-rail" id="circle-tabs-bar">
                        <div class="rail-phase">
                            <div class="rail-phase-h"><span>1단계 · 구조화</span><span class="rail-count" id="rail-count-1">0/5</span></div>
                            <div class="rail-steps">
                            <button type="button" class="circle-tab-item active nav-item" id="nav-1pager" onclick="switchDocument('1pager')" title="1-Pager">
                                <span class="rail-bar"><span class="node-liquid" id="node-liquid-1pager"></span></span>
                                <span class="circle-tab-label">1-Pager</span>
                                <span class="rail-sub"><span class="node-percent" id="node-pct-1pager"></span><span class="circle-tab-time" data-node-time="1pager" aria-live="off"></span></span>
                            </button>
                            <button type="button" class="circle-tab-item pending disabled nav-item" id="nav-threec" onclick="switchDocument('threec')" title="3C">
                                <span class="rail-bar"><span class="node-liquid" id="node-liquid-threec"></span></span>
                                <span class="circle-tab-label">3C</span>
                                <span class="rail-sub"><span class="node-percent" id="node-pct-threec"></span><span class="circle-tab-time" data-node-time="threec" aria-live="off"></span></span>
                            </button>
                            <button type="button" class="circle-tab-item pending disabled nav-item" id="nav-swot" onclick="switchDocument('swot')" title="SWOT">
                                <span class="rail-bar"><span class="node-liquid" id="node-liquid-swot"></span></span>
                                <span class="circle-tab-label">SWOT</span>
                                <span class="rail-sub"><span class="node-percent" id="node-pct-swot"></span><span class="circle-tab-time" data-node-time="swot" aria-live="off"></span></span>
                            </button>
                            <button type="button" class="circle-tab-item pending disabled nav-item" id="nav-stp" onclick="switchDocument('stp')" title="STP">
                                <span class="rail-bar"><span class="node-liquid" id="node-liquid-stp"></span></span>
                                <span class="circle-tab-label">STP</span>
                                <span class="rail-sub"><span class="node-percent" id="node-pct-stp"></span><span class="circle-tab-time" data-node-time="stp" aria-live="off"></span></span>
                            </button>
                            <button type="button" class="circle-tab-item pending disabled nav-item" id="nav-mece" onclick="switchDocument('mece')" title="MECE">
                                <span class="rail-bar"><span class="node-liquid" id="node-liquid-mece"></span></span>
                                <span class="circle-tab-label">MECE</span>
                                <span class="rail-sub"><span class="node-percent" id="node-pct-mece"></span><span class="circle-tab-time" data-node-time="mece" aria-live="off"></span></span>
                            </button>
                            </div>
                        </div>
                        <button type="button" class="circle-tab-item pending disabled nav-item" id="nav-gate50" onclick="handleGate50Click()" title="중간 검토: 1단계 승인 후 2단계 진행">
                            <span class="rail-dia" aria-hidden="true"></span>
                            <span class="circle-tab-label">중간 검토</span>
                            <span class="rail-sub"><span class="node-percent" id="node-pct-gate50"></span><span class="circle-tab-time" data-node-time="gate50" aria-live="off"></span></span>
                        </button>
                        <div class="rail-phase">

        function t(ko, en) {
            const lang = localStorage.getItem('pitl_lang') || 'ko';
            return lang === 'en' ? en : ko;
        }

        function setLanguage(lang) {
            localStorage.setItem('pitl_lang', lang);
            
            // Update UI elements with data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key] !== undefined) {
                    el.innerHTML = translations[lang][key];
                }
            });

            // Update placeholders with data-i18n-placeholder
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key] !== undefined) {
                    el.setAttribute('placeholder', translations[lang][key]);
                }
            });

            // Sync all language labels
            document.querySelectorAll('.current-lang-label').forEach(el => {
                el.innerText = lang.toUpperCase();
            });

            // Update dynamic logs/notifications with data-i18n-msg
            document.querySelectorAll('[data-i18n-msg]').forEach(el => {
                const rawMsg = el.getAttribute('data-i18n-msg');
                const textEl = el.querySelector('.msg-text') || el;
                textEl.innerText = translateMessage(rawMsg);
            });

            // Refresh history list and currently viewed document to apply translations
            loadHistoryList();
            if (typeof activeDoc !== 'undefined') {
                if (activeDoc === 'wireframe') {
                    renderWireframesContainer(document.getElementById('viewer-main-content'));
                } else if (activeDoc === 'swot' || activeDoc === 'stp') {
                    switchDocument(activeDoc);
                } else if (isEditing) {
                    renderEditorView();
                }
            }
            syncMidReviewToggle();
            syncArchiveToggle();
        }

            const currentLang = localStorage.getItem('pitl_lang') || 'ko';

        // Custom Alert Modal (replaces native alert())

        // ───────────────────────────────────────────────────────────────
        // autoClose(ms)를 주면 그 사이 다른 알림이 뜨지 않은 경우에만 저절로 닫힌다
        function pitlAlert(message, type = 'info', title = '', { autoClose = 0 } = {}) {
            const overlay  = document.getElementById('pitl-alert-overlay');
            const iconWrap = document.getElementById('pitl-alert-icon-wrap');
            const icon     = document.getElementById('pitl-alert-icon');
            const titleEl  = document.getElementById('pitl-alert-title');
            const msgEl    = document.getElementById('pitl-alert-message');
            const btnsEl   = document.getElementById('pitl-alert-buttons');
            if (!overlay) { alert(message); return; }

            const cfg = {
                info:    { icon:'fa-circle-info',  color:'var(--accent-neon)',   bg:'rgba(var(--accent-rgb), 0.10)',  defaultTitle:'안내' },
                success: { icon:'fa-circle-check', color:'var(--success)',                bg:'rgba(var(--success-rgb),0.12)', defaultTitle:'완료' },
                warn:    { icon:'fa-triangle-exclamation', color:'#f59e0b',              bg:'rgba(245,158,11,0.12)', defaultTitle:'주의' },
                error:   { icon:'fa-circle-xmark', color:'#ef4444',                     bg:'rgba(239,68,68,0.12)',  defaultTitle:'오류' },
            };
            const c = cfg[type] || cfg.info;

            iconWrap.style.background = c.bg;
            iconWrap.style.color      = c.color;
            icon.className            = `fa-solid ${c.icon}`;
            titleEl.textContent       = title || c.defaultTitle;
            msgEl.innerHTML           = message;

            btnsEl.innerHTML = `<button class="pitl-modal-btn pitl-modal-btn-primary" onclick="document.getElementById('pitl-alert-overlay').style.display='none'">
                <i class="fa-solid fa-check"></i> 확인
            </button>`;

            overlay.style.display = 'flex';
            const alertId = String((Number(overlay.dataset.alertId) || 0) + 1);
            overlay.dataset.alertId = alertId;
            if (autoClose > 0) setTimeout(() => { if (overlay.dataset.alertId === alertId) overlay.style.display = 'none'; }, autoClose);
            // Re-trigger animation
            const card = document.getElementById('pitl-alert-card');
            card.style.animation = 'none';
            card.offsetHeight; // reflow
            card.style.animation = '';
        }

        // Close on overlay backdrop click
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('pitl-alert-overlay');
            if (overlay) overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.style.display = 'none';

        });

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        const CLAUDE_CLIENT_TIMEOUT_MS = 11 * 60 * 1000;

                'error', t('로컬 서버 필요', 'Local Server Required'));
        }

        async function callClaudeLocal(systemInstruction, userPrompt, logCallback = null) {
            const currentLang = localStorage.getItem('pitl_lang') || 'ko';
            let finalPrompt = userPrompt;
            if (currentLang === 'en') finalPrompt += '\n\nCRITICAL: You must write the entire output/content/report in English. Do not write any Korean.';

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), CLAUDE_CLIENT_TIMEOUT_MS);
            try {
                const res = await fetch('/api/llm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ systemInstruction, userPrompt: finalPrompt }),
                    signal: controller.signal
                });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || `Local server error: ${res.status}`);
                }
                const data = await res.json();
                if (!data.text) throw new Error(t('로컬 Claude 엔진에서 응답 텍스트를 받지 못했습니다.', 'No response text from local Claude engine.'));
                return data.text;
            } catch (err) {
                const errMsg = err.name === 'AbortError'
                    ? t('로컬 Claude 응답 시간 초과. 백업 템플릿으로 전환합니다.', 'Local Claude timed out. Switching to backup template.')
                    : err.message;
                if (logCallback) logCallback(`[로컬 Claude 경고] ${errMsg}`);
                throw new Error(errMsg);
            } finally {
                clearTimeout(timeoutId);
            }
        }

- 핵심 대상과 가치가 드러나게 쓴다

[요청문]
${idea.slice(0, 2000)}`
                );
                const title = String(raw || '').split('\n').map(line => line.trim()).find(Boolean) || '';
                const cleaned = title.replace(/^(제목\s*[:：]\s*)/, '').replace(/^["'“”‘’「『#*\s]+|["'“”‘’」』*.\s]+$/g, '').trim();

        function saveClientHistoryLocally(docs, keyDateOverride) {
            let clientHistory = localStorage.getItem('pitl_client_history');
            clientHistory = clientHistory ? JSON.parse(clientHistory) : [];
            
            const cleanTitle = docs.title;
            const dateStr = new Date().toISOString().split('T')[0].replace(/-/g, '').slice(2);
            const keyDate = /^\d{6}$/.test(keyDateOverride || '') ? keyDateOverride : dateStr;
            const year = '20' + keyDate.slice(0, 2);
            const month = keyDate.slice(2, 4);
            const day = keyDate.slice(4, 6);
            
            // 분석 시작 때 요약한 제목(summaryTitle)을 쓰고, 없으면 규칙 기반 요약으로 대체
            const displayTitle = docs.summaryTitle || summarizeIdeaToTitle(docs.idea || cleanTitle);
            const displayDate = `${year}-${month}-${day}`;
            
            const existingIdx = clientHistory.findIndex(item => item.title === cleanTitle && item.date === keyDate);
            
            const types = ['1pager', 'threec', 'swot', 'stp', 'mece', 'prd', 'wireframe', 'audit', 'prototype'];
            const historyItem = {
                title: cleanTitle,
                date: keyDate,
                displayTitle: displayTitle,
                displayDate: displayDate,
                idea: docs.idea || displayTitle,
                types: types,
                docs: {
                    title: cleanTitle,
                    idea: docs.idea || '',
                    summaryTitle: docs.summaryTitle || '',
                    timings: docs.timings || null,
                    midReview: typeof docs.midReview === 'boolean' ? docs.midReview : null,
                    '1pager': docs['1pager'] || '',
                    'threec': docs['threec'] || '',
                    'swot': docs['swot'] || '',
                    'stp': docs['stp'] || '',
                    'mece': docs['mece'] || '',
                    'prd': docs['prd'] || '',
                    'wireframe': docs['wireframe'] || '',
                    'audit': docs['audit'] || '',
                    'prototype': docs['prototype'] || ''
                }
            };
            
            if (existingIdx > -1) {
                clientHistory[existingIdx] = historyItem;
            } else {

            localStorage.setItem('pitl_client_history', JSON.stringify(clientHistory));

        // ─────────────────────────────────────────────────────
        // MASTER Theme Toggle — single source of truth
        // Applies data-theme attribute (for CSS selectors) AND
        // body class (for legacy overrides). Consistent key: pitl_theme
        // ─────────────────────────────────────────────────────
        function toggleTheme(persist = true) {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const nextTheme = currentTheme === 'light' ? 'dark' : 'light';

            // Apply theme attribute — this is what the CSS [data-theme] selectors use
            html.setAttribute('data-theme', nextTheme);

            // Sync body classes too (for any legacy body.light-theme / body.dark-theme rules)
            if (nextTheme === 'light') {
                document.body.classList.add('light-theme');
                document.body.classList.remove('dark-theme');
            } else {
                document.body.classList.add('dark-theme');
                document.body.classList.remove('light-theme');
            }

            // Persist (single key, no mismatch). System-driven changes are not persisted.
            if (persist) localStorage.setItem('pitl_theme', nextTheme);

            // Sync ALL theme toggle button icons throughout the page
            const isLight = nextTheme === 'light';
            document.querySelectorAll(
                '#theme-toggle-btn, .theme-toggle-btn, #btn-theme-toggle-sidebar'
            ).forEach(btn => {
                btn.innerHTML = isLight
                    ? '<i class="fa-solid fa-moon"></i>'
                    : '<i class="fa-solid fa-sun"></i>';
            });
        }


        // ── Accessibility: keyboard-operable click targets & labelled icon buttons ──
        (function enhanceClickableA11y() {
            const NATIVE = 'a, button, input, select, textarea, summary, label, [contenteditable]';
            const upgradeEl = el => {
                if (el.matches('[onclick]') && !el.matches(NATIVE) && !el.hasAttribute('tabindex')) {
                    el.setAttribute('tabindex', '0');
                    if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
                }
                if (el.matches('button[title]:not([aria-label])') && !el.textContent.trim()) {
                    el.setAttribute('aria-label', el.title);
                }
            };
            const upgrade = root => {
                if (root.nodeType !== 1) return;
                upgradeEl(root);
                root.querySelectorAll('[onclick], button[title]').forEach(upgradeEl);
            };
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    const alertOverlay = document.getElementById('pitl-alert-overlay');
                    if (alertOverlay && alertOverlay.style.display !== 'none') alertOverlay.style.display = 'none';
                    return;
                }
                if (e.key !== 'Enter' && e.key !== ' ') return;
                const el = e.target;
                if (el.nodeType === 1 && el.getAttribute('role') === 'button' && el.matches('[onclick]') && !el.matches(NATIVE)) {
                    e.preventDefault();
                    el.click();
                }
            });
            const start = () => {
                upgrade(document.body);
                new MutationObserver(muts => muts.forEach(m => m.addedNodes.forEach(upgrade)))
                    .observe(document.body, { childList: true, subtree: true });
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
            else start();
        })();

        // ── Motion layer: scroll reveals, view transitions, ripples, reading progress ──
        (function initMotionLayer() {
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
            const REVEAL = '.tile-card, .history-item-card, .markdown-body > h1, .markdown-body > h2, .markdown-body > h3, '
                + '.markdown-body > p, .markdown-body > ul, .markdown-body > ol, .markdown-body > table, .markdown-body > blockquote, .markdown-body > pre';
            const RIPPLE = '.prompt-submit-btn, .btn-minimal, .pitl-modal-btn, .password-submit-btn, .new-plan-btn, .pill-gate-btn, .suggestion-pill';

            const finishReveal = el => {
                el.classList.remove('reveal-in');
                el.style.removeProperty('--reveal-delay');
            };
            const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
                let order = 0;
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const el = entry.target;
                    io.unobserve(el);
                    // 한 번에 화면에 들어온 요소들은 순차적으로(stagger) 등장
                    el.style.setProperty('--reveal-delay', `${Math.min(order++, 8) * 45}ms`);
                    el.classList.remove('reveal-pending');
                    el.classList.add('reveal-in');
                    el.addEventListener('animationend', e => { if (e.target === el) finishReveal(el); });
                });
            }, { threshold: 0 }) : null;

            // 새로 렌더링된 노드 안의 등장 대상을 준비한다. 준비한 개수를 반환
            const prepare = root => {
                if (!io || reduce.matches || root.nodeType !== 1) return 0;
                const targets = root.matches(REVEAL) ? [root] : [];
                targets.push(...root.querySelectorAll(REVEAL));
                let count = 0;
                targets.forEach(el => {
                    if (el.dataset.revealed) return;
                    el.dataset.revealed = '1';
                    el.classList.add('reveal-pending');
                    io.observe(el);
                    count++;
                });
                return count;
            };

            const playViewEnter = el => {
                if (reduce.matches || el.nodeType !== 1) return;
                el.classList.add('view-enter');
                el.addEventListener('animationend', e => { if (e.target === el) el.classList.remove('view-enter'); }, { once: true });
            };

            // Ripple on press (pointer position)
            document.addEventListener('pointerdown', e => {
                if (reduce.matches || e.button !== 0) return;
                const host = e.target.closest(RIPPLE);
                if (!host || host.disabled) return;
                if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
                host.style.overflow = 'hidden';
                const rect = host.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height) * 2;
                const dot = document.createElement('span');
                dot.className = 'ripple';
                dot.setAttribute('aria-hidden', 'true');
                dot.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px;`;
                host.appendChild(dot);
                dot.addEventListener('animationend', () => dot.remove(), { once: true });
                setTimeout(() => dot.remove(), 1000); // 애니메이션이 돌지 않는 경우(숨겨진 요소 등) 대비
            });

            const start = () => {
                prepare(document.body);

                const viewer = document.getElementById('viewer-main-content');
                new MutationObserver(muts => muts.forEach(m => m.addedNodes.forEach(node => {
                    const prepared = prepare(node);
                    // 문서 전환: 블록 단위 등장이 없는 화면(와이어프레임·프로토타입 등)은 화면 전체를 페이드인
                    if (m.target === viewer && !prepared) playViewEnter(node);
                }))).observe(document.body, { childList: true, subtree: true });

                // Reading progress bar under the browser chrome
                const chrome = document.querySelector('.computer-chrome');
                if (viewer && chrome) {
                    const bar = document.createElement('div');
                    bar.id = 'read-progress';
                    bar.setAttribute('aria-hidden', 'true');
                    chrome.appendChild(bar);
                    let ticking = false;
                    const update = () => {
                        ticking = false;
                        const max = viewer.scrollHeight - viewer.clientHeight;
                        bar.style.transform = `scaleX(${max > 0 ? Math.min(1, viewer.scrollTop / max) : 0})`;
                    };
                    viewer.addEventListener('scroll', () => {
                        if (!ticking) { ticking = true; requestAnimationFrame(update); }
                    }, { passive: true });
                    new MutationObserver(() => requestAnimationFrame(update)).observe(viewer, { childList: true });
                }
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
            else start();
        })();

        // Initialize Theme from localStorage immediately (no flicker)
        (function initTheme() {
            // Migrate legacy key 'pitl-theme' to 'pitl_theme' if needed
            const legacyVal = localStorage.getItem('pitl-theme');
            if (legacyVal) {
                localStorage.setItem('pitl_theme', legacyVal);
                localStorage.removeItem('pitl-theme');
            }
            // 저장된 선택이 없으면 OS의 다크/라이트 설정을 따른다
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
            const savedTheme = localStorage.getItem('pitl_theme') || (systemDark.matches ? 'dark' : 'light');
            const html = document.documentElement;
            html.setAttribute('data-theme', savedTheme);
            systemDark.addEventListener('change', e => {
                if (localStorage.getItem('pitl_theme')) return; // explicit choice wins
                const isDark = html.getAttribute('data-theme') !== 'light';
                if (isDark !== e.matches) toggleTheme(false);
            });
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                document.body.classList.remove('dark-theme');
            } else {
                document.body.classList.add('dark-theme');
                document.body.classList.remove('light-theme');
            }
        })();

        // ── 화면 기록: 문서·대시보드·진행 화면 사이 뒤로 가기 ──
        window.pitlViewStack = [];
        window.pitlCurrentView = null;

        function pushViewHistory(next, fromBack) {
            const cur = window.pitlCurrentView;
            if (!fromBack && cur && cur !== next) {
                window.pitlViewStack.push(cur);
                if (window.pitlViewStack.length > 30) window.pitlViewStack.shift();
            }
            window.pitlCurrentView = next;
        }

        function resetViewHistory() {
            window.pitlViewStack = [];
            window.pitlCurrentView = null;
            const back = document.getElementById('btn-plan-back');
            if (back) back.hidden = true;
        }

        function goBackView() {
            const stack = window.pitlViewStack;
            while (stack.length) {
                const prev = stack.pop();
                // 지나간 진행 화면·검토 카드는 지금도 유효할 때만 되돌린다
                if (prev === 'progress') {
                    const tm = window.pitlTiming;
                    if (tm && tm.active && !tm.finishedAt) { window.pitlCurrentView = 'progress'; renderPipelineRunningProgressCard(); break; }
                    continue;
                }
                if (prev === 'gate50') {
                    if (window.pitlWaitingGate50) { window.pitlCurrentView = 'gate50'; renderGateCheckpoint(); break; }
                    continue;
                }
                switchDocument(prev, true);
                break;
            }
            updateRailMeta();
        }

        // ── 테마: 시스템 / 라이트 / 다크 ──
        function currentThemeMode() {
            const v = localStorage.getItem('pitl_theme');

            if (mode === 'system') localStorage.removeItem('pitl_theme');
            else localStorage.setItem('pitl_theme', mode);
            const want = mode === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;

        // ── 공유: 아카이브 링크 복사 (아직 게시 전이면 게시 후 복사) ──
        async function sharePlan() {

        // ── 내려받기: 모든 분석을 HTML 문서(page) 또는 HTML 슬라이드(slides) 한 파일로 ──
        function planFileName(kind) {
            const title = (generatedDocs && (generatedDocs.summaryTitle || generatedDocs.title)) || 'PITL';
            const safe = String(title).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, '_').slice(0, 60);
            return `${safe}_PITL_${kind === 'slides' ? t('슬라이드', 'slides') : t('기획서', 'report')}.html`;
        }

        function prototypeSrcdoc(docs) {
            if (!docs.prototype) return '';
            return vizEsc(extractPureHtmlCode(docs.prototype, docs.title || 'pitl', docs.idea || ''));
        }

        // 아카이브용 기획서 HTML을 한 파일로: 별도 prototype.html 대신 프로토타입을 문서 안에 넣는다
        function buildPlanPageHtml(docs) {
            return buildArchiveReportHtml(docs)
                .replace('<iframe src="prototype.html"', `<iframe srcdoc="${prototypeSrcdoc(docs)}"`)
                .replace(/<a class="open" href="prototype\.html"[^>]*>[\s\S]*?<\/a>/, '');
        }

        // 발표용 슬라이드: 표지 → 목차 → 문서마다 표지 + 소제목(##) 단위 슬라이드 → 마무리
        function buildPlanSlidesHtml(docs) {
            const esc = vizEsc;
            const title = docs.summaryTitle || summarizeIdeaToTitle(docs.idea || docs.title || '');
            const timings = docs.timings || null;
            const present = ARCHIVE_DOCS.filter(([key]) => (docs[key] || '').trim());
            const slides = [];
            slides.push(`<section class="slide cover"><div class="eyebrow">PITL · PLANNING-IN-THE-LOOP</div><h1>${esc(title)}</h1><p class="idea">${esc(docs.idea || '')}</p>
                <div class="meta"><span class="chip">${esc(archiveDate(docs))}</span><span class="chip">${present.length}${esc(t('개 문서', ' documents'))}</span>${timings && timings.totalMs ? `<span class="chip">${esc(t('총 분석 소요', 'Total analysis'))} ${esc(fmtDuration(timings.totalMs))}</span>` : ''}</div></section>`);
            slides.push(`<section class="slide agenda"><h2>${esc(t('목차', 'Contents'))}</h2><ol>${present.map(([, label]) => `<li>${esc(label)}</li>`).join('')}</ol></section>`);
            present.forEach(([key, label], n) => {
                const ms = timings && timings.steps ? timings.steps[key] : null;
                slides.push(`<section class="slide divider"><span class="num">${String(n + 1).padStart(2, '0')}</span><h2>${esc(label)}</h2>${ms != null ? `<p class="doc-time">${esc(t('분석 소요', 'Analysis time'))} ${esc(fmtDuration(ms))}</p>` : ''}</section>`);
                if (key === 'prototype') {
                    slides.push(`<section class="slide proto"><h3>${esc(label)}</h3><div class="proto-frame"><iframe srcdoc="${prototypeSrcdoc(docs)}" sandbox="allow-scripts allow-forms allow-modals" title="${esc(label)}"></iframe></div></section>`);
                    return;
                }
                const { markdown, data } = splitVizBlock(docs[key]);
