                            ${items.map(([key, md]) => `<button type="button" class="gate-cp-item" onclick="switchDocument('${key}')"><b>${STEP_LABELS[key]}</b><span>${esc(docSummaryLine(md)) || t('내용 없음', 'Empty')}</span></button>`).join('')}
                        </div>
                        <div class="gate-cp-actions">
                            <button type="button" class="gate-cp-btn primary" onclick="approveGateCheckpoint()">${t('승인하고 계속', 'Approve & continue')}</button>
                            <button type="button" class="gate-cp-btn" onclick="toggleGateRevision()">${t('수정 요청', 'Request changes')}</button>
                            <button type="button" class="gate-cp-btn ghost" onclick="regenerateFromStart()">${t('1단계 다시 생성', 'Regenerate phase 1')}</button>
                        </div>
                        <div class="gate-cp-edit" id="gate-cp-edit">
                            <textarea id="gate-cp-note" placeholder="${t('예) 타겟을 40대 1인 가구로 좁혀서 PRD를 써 주세요', 'e.g. Narrow the target to single-person households in their 40s')}">${esc(st.reviewNote || '')}</textarea>
                            <button type="button" class="gate-cp-btn primary" onclick="approveGateCheckpoint(true)">${t('요청 반영해 계속', 'Continue with changes')}</button>
                        </div>
                    </div>
                </div>
            `;
            updateStatusPill(computeProgress());
        }

        function toggleGateRevision() {
            const box = document.getElementById('gate-cp-edit');
            if (!box) return;
            box.classList.toggle('show');
            if (box.classList.contains('show')) document.getElementById('gate-cp-note').focus();
        }

        function approveGateCheckpoint(withNote) {
            const st = window.pitlPendingState;
            if (!st) return;
            const note = withNote ? (document.getElementById('gate-cp-note').value || '').trim() : '';
            st.reviewNote = note;
            if (note) logAgentClientSide('system', t(`✍️ 검토 요청 반영: ${note}`, `✍️ Review note applied: ${note}`));
            renderPipelineRunningProgressCard();
            resumePlanningAfterMece();
        }

        function regenerateFromStart() {
            const ta = document.getElementById('idea-textarea');
            const idea = (generatedDocs && generatedDocs.idea) || (window.pitlPendingState && window.pitlPendingState.idea) || '';
            if (!ta || !idea) return;
            window.pitlPendingState = null;
            window.pitlWaitingGate50 = false;
            ta.value = idea;
            startProductPlanning();
        }

        // ── 상태 알약: 진행 카드가 안 보일 때 화면 하단에 진행 상황을 표시 ──
        function updateStatusPill(stats) {
            let pill = document.getElementById('pitl-status-pill');
            const tm = window.pitlTiming;
            const running = !!(tm && tm.active && !tm.finishedAt);
            const visible = running && document.body.classList.contains('state-workspace') && !document.getElementById('run-stream') && !document.querySelector('.gate-checkpoint');
            if (!pill) {
                if (!visible) return;
                pill = document.createElement('div');
                pill.id = 'pitl-status-pill';
                pill.className = 'status-pill';
                pill.innerHTML = `
                    <button type="button" class="status-pill-row" aria-expanded="false">
                        <span class="run-pulse" aria-hidden="true"></span>
                        <span class="status-pill-txt"></span>
                        <svg class="status-pill-ring" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" stroke="rgba(127,127,127,.25)"/><circle class="status-pill-arc" cx="13" cy="13" r="10" stroke="rgb(var(--accent-rgb))" stroke-linecap="round" stroke-dasharray="62.8" stroke-dashoffset="62.8" transform="rotate(-90 13 13)"/></svg>
                    </button>
                    <div class="status-pill-more"><div><ul></ul><button type="button" class="status-pill-open">${t('진행 화면 열기', 'Open progress view')}</button></div></div>`;
                pill.querySelector('.status-pill-row').addEventListener('click', () => {
                    const open = pill.classList.toggle('open');
                    pill.querySelector('.status-pill-row').setAttribute('aria-expanded', String(open));
                });
                pill.querySelector('.status-pill-open').addEventListener('click', () => {
                    pill.classList.remove('open');
                    if (window.pitlTiming && window.pitlTiming.active === 'gate50') renderGateCheckpoint();
                    else renderPipelineRunningProgressCard();
                    updateStatusPill(computeProgress());
                });
                document.body.appendChild(pill);
            }
            pill.classList.toggle('show', visible);
            if (!visible || !stats) return;

            const viewer = document.getElementById('viewer-main-content');
            if (viewer) { const r = viewer.getBoundingClientRect(); pill.style.left = (r.left + r.width / 2) + 'px'; }
            const pct = Math.round(stats.percent);
            const isGate = tm.active === 'gate50';
            pill.querySelector('.status-pill-txt').innerHTML = isGate
                ? `${t('중간 검토 대기 중', 'Waiting for review')}<small>${t('눌러서 검토', 'tap to review')}</small>`
                : `${t(`${STEP_LABELS[tm.active]} 작성 중`, `Writing ${STEP_LABELS[tm.active]}`)}<small>${pct}% · ${t(`약 ${fmtDuration(stats.etaSec * 1000)} 남음`, `~${fmtDuration(stats.etaSec * 1000)} left`)}</small>`;
            pill.querySelector('.status-pill-arc').setAttribute('stroke-dashoffset', String(62.8 * (1 - pct / 100)));
            const activeIdx = PIPELINE_STEPS.indexOf(tm.active);
            const html = WORK_STEPS.map(key => {
                const idx = PIPELINE_STEPS.indexOf(key);
                const state = idx < activeIdx ? 'done' : idx === activeIdx ? 'cur' : '';
                return `<li class="${state}"><span>${state === 'done' ? '✓' : state === 'cur' ? '●' : '○'} ${STEP_LABELS[key]}</span><span>${state === 'done' ? t('완료', 'Done') : state === 'cur' ? t('진행 중', 'Running') : t('대기', 'Queued')}</span></li>`;
            }).join('');
            const ul = pill.querySelector('ul');
            if (ul.dataset.sig !== html) { ul.innerHTML = html; ul.dataset.sig = html; }
        }

        // Progress Popover Toggle when active circle node is clicked -> renders attached image card view
        function toggleProgressPopover(e) {
            if (e) e.stopPropagation();
            renderPipelineRunningProgressCard();
        }

        document.addEventListener('click', () => {
            const pop = document.getElementById('progress-popover');
            if (pop) pop.style.display = 'none';
        });

        // 50% Gate Click Handler
        function handleGate50Click() {
            if (window.pitlWaitingGate50) {
                renderGateCheckpoint();
            } else {
                switchDocument('mece');
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        //  Pipeline progress & timing
        //  전체 진행률 = (완료 단계 가중치 + 진행 단계 가중치 × 경과 비율) ÷ 전체 가중치
        //  · 가중치 = 단계별 예상 소요시간(초). 실제 소요시간으로 매 실행 보정(지수 이동 평균)
        //  · 진행 단계 비율 = 실제 경과 ÷ 예상 (예상 도달 시 90%, 초과하면 97%까지 천천히 수렴)
        //  · 중간 검토(gate50) 대기는 작업이 아니므로 진행률·분석 소요시간에서 제외
        // ═══════════════════════════════════════════════════════════════════
        const PIPELINE_STEPS = ['1pager', 'threec', 'swot', 'stp', 'mece', 'gate50', 'prd', 'wireframe', 'prototype', 'audit'];
        const WORK_STEPS = PIPELINE_STEPS.filter(key => key !== 'gate50');
        const STEP_EXPECTED_DEFAULT = { '1pager': 90, threec: 90, swot: 75, stp: 80, mece: 100, prd: 110, wireframe: 100, prototype: 360, audit: 70 };
        const STEP_LABELS = { '1pager': '1-Pager', threec: '3C', swot: 'SWOT', stp: 'STP', mece: 'MECE', prd: 'PRD', wireframe: t('와이어프레임', 'Wireframe'), prototype: t('프로토타입', 'Prototype'), audit: t('QA 감사', 'QA Audit') };
        const STEP_LEARN_MIN_SECONDS = 10; // 백업 템플릿처럼 즉시 끝난 단계는 예상치 학습에서 제외

        function fmtDuration(ms) {
            const sec = Math.max(0, Math.round((ms || 0) / 1000));
            if (sec < 60) return t(`${sec}초`, `${sec}s`);
            const min = Math.floor(sec / 60), rest = sec % 60;
            if (min < 60) return t(`${min}분 ${String(rest).padStart(2, '0')}초`, `${min}m ${String(rest).padStart(2, '0')}s`);
            return t(`${Math.floor(min / 60)}시간 ${min % 60}분`, `${Math.floor(min / 60)}h ${min % 60}m`);
        }

        function loadStepEstimates() {
            let learned = {};
            try { learned = JSON.parse(localStorage.getItem('pitl_step_estimates') || '{}'); } catch (e) { /* 기본값 사용 */ }
            const est = {};
            WORK_STEPS.forEach(key => {
                const v = Number(learned[key]);
                est[key] = v >= 5 && v <= 3600 ? v : STEP_EXPECTED_DEFAULT[key];
            });
            return est;
        }

        function learnStepEstimate(key, seconds) {
            if (!WORK_STEPS.includes(key) || !(seconds >= STEP_LEARN_MIN_SECONDS)) return;
            try {
                const learned = JSON.parse(localStorage.getItem('pitl_step_estimates') || '{}');
                const prev = Number(learned[key]) || STEP_EXPECTED_DEFAULT[key];
                learned[key] = Math.round(prev * 0.6 + seconds * 0.4);
                localStorage.setItem('pitl_step_estimates', JSON.stringify(learned));
            } catch (e) { /* 저장 불가 시 기본값 유지 */ }
        }

        window.pitlTiming = null;

        function timingBegin() {
            window.pitlTiming = { est: loadStepEstimates(), steps: {}, active: null, activeStart: 0, reviewWaitMs: 0, startedAt: Date.now(), finishedAt: null };
        }

        // 활성 단계 전환: 이전 단계의 소요시간을 확정하고 기록한다
        function timingEnter(key) {
            const tm = window.pitlTiming;
            if (!tm) return;
            const now = performance.now();
            if (tm.active && tm.active !== key) {
                const ms = now - tm.activeStart;
                if (tm.active === 'gate50') {
                    tm.reviewWaitMs += ms;
                } else {
                    tm.steps[tm.active] = ms;
                    learnStepEstimate(tm.active, ms / 1000);
                    if (typeof logAgentClientSide === 'function') {
                        logAgentClientSide('system', t(`⏱ ${STEP_LABELS[tm.active]} 단계 소요 ${fmtDuration(ms)}`, `⏱ ${STEP_LABELS[tm.active]} took ${fmtDuration(ms)}`));
                    }
                }
            }
            if (key === 'completed_all') {
                tm.active = null;
                tm.finishedAt = Date.now();
                const snap = timingSnapshot();
                if (typeof logAgentClientSide === 'function') {
                    logAgentClientSide('system', t(`⏱ 총 분석 소요시간 ${fmtDuration(snap.totalMs)}${snap.reviewWaitMs >= 1000 ? ` (중간 검토 대기 ${fmtDuration(snap.reviewWaitMs)} 제외)` : ''}`,
                        `⏱ Total analysis time ${fmtDuration(snap.totalMs)}${snap.reviewWaitMs >= 1000 ? ` (excluding ${fmtDuration(snap.reviewWaitMs)} review wait)` : ''}`));
                }
                return;
            }
            if (tm.active !== key) {
                tm.active = key;
                tm.activeStart = now;
            }
        }

        function timingSnapshot() {
            const tm = window.pitlTiming;
            if (!tm) return null;
            const steps = {};
            WORK_STEPS.forEach(key => { if (tm.steps[key] != null) steps[key] = Math.round(tm.steps[key]); });
            return {
                steps,
                totalMs: Object.values(steps).reduce((a, b) => a + b, 0),
                reviewWaitMs: Math.round(tm.reviewWaitMs),
                startedAt: tm.startedAt,
                finishedAt: tm.finishedAt
            };
        }

        // 진행 중 단계의 완료 비율 (0~0.97): 실제 경과 시간 기준
        function activeStepFraction(elapsedSec, expectedSec) {
            const ratio = elapsedSec / Math.max(1, expectedSec);
            if (ratio <= 1) return 0.9 * ratio;
            return 0.9 + 0.07 * (1 - Math.exp(-(ratio - 1)));
        }

        function computeProgress() {
            const tm = window.pitlTiming;
            if (!tm) return null;
            const total = WORK_STEPS.reduce((sum, key) => sum + tm.est[key], 0);
            let done = 0, remaining = 0, activeElapsedMs = 0, activeFraction = 0;
            const activeIdx = tm.active ? PIPELINE_STEPS.indexOf(tm.active) : PIPELINE_STEPS.length;
            WORK_STEPS.forEach(key => {
                const idx = PIPELINE_STEPS.indexOf(key);
                if (tm.steps[key] != null && idx < activeIdx) {
                    done += tm.est[key];
                } else if (key === tm.active) {
                    activeElapsedMs = performance.now() - tm.activeStart;
                    activeFraction = activeStepFraction(activeElapsedMs / 1000, tm.est[key]);
                    done += tm.est[key] * activeFraction;
                    remaining += Math.max(5, tm.est[key] - activeElapsedMs / 1000);
                } else if (idx > activeIdx) {
                    remaining += tm.est[key];
                }
            });
            if (tm.active === 'gate50') activeElapsedMs = performance.now() - tm.activeStart;
            const completedMs = Object.values(tm.steps).reduce((a, b) => a + b, 0);
            return {
                percent: tm.finishedAt ? 100 : Math.min(99, (done / total) * 100),
                activeFraction,
                activeElapsedMs,
                totalElapsedMs: completedMs + (tm.active && tm.active !== 'gate50' ? activeElapsedMs : 0),
                etaSec: tm.finishedAt ? 0 : remaining
            };
        }

        // 원형 탭 아래 단계별 소요시간 표시
        function renderNodeTimes(timings) {
            const tm = window.pitlTiming;
            PIPELINE_STEPS.forEach(key => {
                const el = document.querySelector(`[data-node-time="${key}"]`);
                if (!el) return;
                let text = '';
                if (key === 'gate50') {
                    const wait = timings ? timings.reviewWaitMs : (tm ? tm.reviewWaitMs + (tm.active === 'gate50' ? performance.now() - tm.activeStart : 0) : 0);
                    text = wait >= 1000 ? t(`대기 ${fmtDuration(wait)}`, `wait ${fmtDuration(wait)}`) : '';
                } else if (timings && timings.steps && timings.steps[key] != null) {
                    text = fmtDuration(timings.steps[key]);
                } else if (tm && tm.steps[key] != null) {
                    text = fmtDuration(tm.steps[key]);
                } else if (tm && tm.active === key) {
                    text = fmtDuration(performance.now() - tm.activeStart);
                }
                el.textContent = text;
            });
        }

        // 진행 카드의 소요시간 요약 (현재 단계 · 총 소요 · 예상 남은 시간)
        function renderTimingStats(stats, timings) {
            const set = (role, text) => document.querySelectorAll(`[data-timing="${role}"]`).forEach(el => { el.textContent = text; });
            const tm = window.pitlTiming;
            if (timings) {
                set('step', t('완료', 'Done'));
                set('total', fmtDuration(timings.totalMs));
                set('eta', '—');
                return;
            }
            if (!stats || !tm) return;
            set('step', tm.active === 'gate50' ? t(`검토 대기 ${fmtDuration(stats.activeElapsedMs)}`, `Review wait ${fmtDuration(stats.activeElapsedMs)}`)
                : tm.active ? `${STEP_LABELS[tm.active]} ${fmtDuration(stats.activeElapsedMs)}` : t('완료', 'Done'));
            set('total', fmtDuration(stats.totalElapsedMs));
            set('eta', tm.finishedAt ? '—' : t(`약 ${fmtDuration(stats.etaSec * 1000)}`, `~${fmtDuration(stats.etaSec * 1000)}`));
        }

        function timingStatsHtml() {
            return `<div class="timing-stats">
                <span><i class="fa-regular fa-clock"></i> ${t('현재 단계', 'Current step')} <b data-timing="step">—</b></span>
                <span>${t('총 분석 소요', 'Total analysis')} <b data-timing="total">—</b></span>
                <span>${t('예상 남은 시간', 'Estimated remaining')} <b data-timing="eta">—</b></span>
            </div>`;
        }

        window.pitlProgressTimer = null;
        window.pitlCurrentProgress = 0;

        window.updatePipelineProgress = function(percent, activeKey) {
            try {
                if (window.pitlProgressTimer) {
                    clearInterval(window.pitlProgressTimer);
                    window.pitlProgressTimer = null;
                }

                // 새 실행의 시작이면 타이밍을 초기화하고, 이후 단계 전환마다 소요시간을 확정한다
                if (activeKey === '1pager') timingBegin();
                const running = !!(window.pitlTiming && (window.pitlTiming.active || activeKey !== 'completed_all'));
                if (running) timingEnter(activeKey);

                const CIRCUMFERENCE = 106.81; // 2π × r=17
                const stepKeys = PIPELINE_STEPS;
                const activeIdx = activeKey === 'completed_all' ? stepKeys.length : stepKeys.indexOf(activeKey);
                const setOverall = pct => {
                    const rounded = Math.min(100, Math.max(0, Math.round(pct)));
                    window.pitlCurrentProgress = pct;
                    const fillEl = document.getElementById('pipeline-progress-fill');
                    const percentEl = document.getElementById('progress-percent-label');
                    if (fillEl) fillEl.style.width = rounded + '%';
                    if (percentEl) percentEl.innerText = rounded + '%';
                };
                const gateText = state => (state === 'completed' ? '✓' : '⏸');

                if (!activeKey || activeKey === 'completed_all') {
                    if (activeKey === 'completed_all') {
                        stepKeys.forEach(key => {
                            const itemEl   = document.getElementById(`nav-${key}`);
                            const ringEl   = document.getElementById(`ring-fill-${key}`);
                            const pctEl    = document.getElementById(`node-pct-${key}`);
                            const liquidEl = document.getElementById(`node-liquid-${key}`);
                            if (itemEl) {
                                itemEl.className = 'circle-tab-item completed nav-item';
                                itemEl.classList.remove('disabled');
                                itemEl.onclick = function(e) {
                                    if (e) e.stopPropagation();
                                    if (key === 'gate50') handleGate50Click();
                                    else switchDocument(key);
                                };
                            }
                            if (ringEl) ringEl.style.strokeDashoffset = '0';
                            if (pctEl) pctEl.textContent = key === 'gate50' ? gateText('completed') : '100%';
                            if (liquidEl) liquidEl.style.width = '100%';
                        });
                        setOverall(100);
                        // 방금 끝난 실행이면 실행 기록을, 히스토리를 연 경우면 저장된 기록을 보여준다
                        const saved = running ? timingSnapshot() : (generatedDocs && generatedDocs.timings) || null;
                        renderNodeTimes(saved);
                        renderTimingStats(null, saved);
                        updateStatusPill(null);
                        updateRailMeta();
                        updateLiveHistoryRow();
                    }
                    return;
                }

                // Update top bar circle node tab states
                stepKeys.forEach((key, idx) => {
                    const itemEl   = document.getElementById(`nav-${key}`);
                    const ringEl   = document.getElementById(`ring-fill-${key}`);
                    const pctEl    = document.getElementById(`node-pct-${key}`);
                    let   liquidEl = document.getElementById(`node-liquid-${key}`);

                    if (!itemEl) return;

                    if (!liquidEl) {
                        const nodeInner = itemEl.querySelector('.node-inner');
                        if (nodeInner) {
                            liquidEl = document.createElement('div');
                            liquidEl.className = 'node-liquid';
                            liquidEl.id = `node-liquid-${key}`;
                            nodeInner.insertBefore(liquidEl, nodeInner.firstChild);
                        }
                    }

                    if (idx < activeIdx) {
                        itemEl.className = 'circle-tab-item completed nav-item';
                        itemEl.classList.remove('disabled');
                        // 100% completed circle node ALWAYS opens the reviewed analysis document page directly!
                        itemEl.onclick = function(e) {
                            if (e) e.stopPropagation();
                            if (key === 'gate50') handleGate50Click();
                            else switchDocument(key);
                        };
                        if (ringEl)   ringEl.style.strokeDashoffset = '0';
                        if (pctEl)    pctEl.textContent = key === 'gate50' ? gateText('completed') : '100%';
                        if (liquidEl) liquidEl.style.width = '100%';
                    } else if (idx > activeIdx) {
                        itemEl.className = 'circle-tab-item pending disabled nav-item';
                        if (ringEl)   ringEl.style.strokeDashoffset = String(CIRCUMFERENCE);
                        if (pctEl)    pctEl.textContent = key === 'gate50' ? gateText('pending') : '0%';
                        if (liquidEl) liquidEl.style.width = '0%';
                    }
                });

                const activeItemEl   = document.getElementById(`nav-${activeKey}`);
                const activeRingEl   = document.getElementById(`ring-fill-${activeKey}`);
                const activePctEl    = document.getElementById(`node-pct-${activeKey}`);
                const activeLiquidEl = document.getElementById(`node-liquid-${activeKey}`);

                if (activeItemEl) {
                    activeItemEl.className = 'circle-tab-item active nav-item';
                    activeItemEl.classList.remove('disabled');
                    // Clicking active node displays attached DHK 5-Stage Running progress card directly
                    activeItemEl.onclick = function(e) {
                        if (e) e.stopPropagation();
                        if (activeKey === 'gate50') {
                            handleGate50Click();
                        } else {
                            renderPipelineRunningProgressCard();
                        }
                    };
                }

                // 실제 경과 시간으로 활성 단계 %, 전체 %, 소요시간 표시를 갱신한다
                const tick = () => {
                    const stats = computeProgress();
                    if (!stats) return;
                    setOverall(stats.percent);
                    if (activeKey === 'gate50') {
                        if (activePctEl) activePctEl.textContent = gateText('active');
                    } else {
                        const pct = Math.min(99, stats.activeFraction * 100);
                        if (activeRingEl)   activeRingEl.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - pct / 100));
                        if (activePctEl)    activePctEl.textContent = Math.round(pct) + '%';
                        if (activeLiquidEl) activeLiquidEl.style.width = pct + '%';
                        if (activeItemEl)   activeItemEl.classList.add('organizing');
                    }
                    renderNodeTimes(null);
                    renderTimingStats(stats, null);
                    renderRunStream();
                    updateStatusPill(stats);
                    updateLiveHistoryRow();
                };
                tick();
                updateRailMeta();
                window.pitlProgressTimer = setInterval(tick, 500);

            } catch (e) {
                console.warn('[Progress] Update failed:', e);
            }
        };

        function safeUpdateProgress(percent, activeKey) {
            if (typeof window.updatePipelineProgress === 'function') {
                window.updatePipelineProgress(percent, activeKey);
            }
        }

        // ── 중간 검토 설정 (기본 ON: MECE 후 멈춤) ──
        function isMidReviewEnabled() {
            try { return localStorage.getItem('pitl_mid_review') !== 'off'; } catch (e) { return true; }
        }

        function syncMidReviewToggle() {
            const btn = document.getElementById('toggle-mid-review');
            if (!btn) return;
            const on = isMidReviewEnabled();

                ## 1. 개요 및 구조화 목적 (MECE Purpose)

                ## 2. [MECE A] 고객 세분화 분석 (Customer Segmentation Tree)

                  * **6.5. 규제/법적 리스크 (Regulatory/Legal Risk)**: 법령 변화, 인증, 개인정보 규제 등

        // Returns dynamic palette matching the current active theme
        function getThemePalette() {
            const isLight = document.body.classList.contains('light-theme');
            if (isLight) {

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        function shouldPauseBackgroundMotion() {
            return document.hidden || prefersReducedMotion.matches;
        }
        function cssAccentRGB() {
            return getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb').trim() || '139, 108, 255';

        // Factory to create a single star particle
        function createSingleStar(forceEdge = false) {
            const palette = getThemePalette();
            const choice = palette[Math.floor(Math.random() * palette.length)];
            
            let x = Math.random() * canvas.width;
            let y = Math.random() * canvas.height;
            
            if (forceEdge) {
                // Spawn at bottom edge to slowly float up
                y = canvas.height + 15;
                x = Math.random() * canvas.width;
            }
            
            return {
                x: x,
                y: y,
                radius: Math.random() * 1.5 + 1.2,      // Extremely tiny, subtle star dust (1.2px to 2.7px)
                opacity: Math.random() * 0.3 + 0.18,     // Very soft and faint baseline opacity for gentle presence
                speed: Math.random() * 0.006 + 0.002,     // slow glow toggle speed
                colorRGB: choice.rgb,
                colorHex: choice.hex
            };
        }

        function initStars() {
            stars = [];
            fragments = [];
            shockwaves = [];
            trails = [];
            // Float sparse glowing neon dust particles for a clean, non-distracting screen
            const count = Math.floor((canvas.width * canvas.height) / 20000);
            for (let i = 0; i < count; i++) {
                stars.push(createSingleStar(false));
            }
        }

        // Parallax mouse variables
        let mouseX = 0;
        let mouseY = 0;
        
        // Exact mouse position tracking (for physics collision)
        let rawMouseX = -1000;
        let rawMouseY = -1000;

        function animateStars() {
            if (shouldPauseBackgroundMotion()) {
                setTimeout(() => requestAnimationFrame(animateStars), 500);
                return;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const shatterDistance = 70; // Close proximity triggers subtle particle shatters
            
            // 1. Process Normal Floating Stars
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                
                // Calculate 3D Parallax offset based on depth (radius) and cursor
                const offsetX = mouseX * star.radius * 0.5;
                const offsetY = mouseY * star.radius * 0.5;
                
                const actualX = star.x + offsetX;
                const actualY = star.y + offsetY;
                
                // Calculate distance to cursor
                const dx = actualX - rawMouseX;
                const dy = actualY - rawMouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < shatterDistance) {
                    // GENTLE SUBTLE SHATTER DETECTED!
                    
                    // A. Trigger Expanding Shockwave Ring
                    shockwaves.push({
                        x: actualX,
                        y: actualY,
                        radius: 4,
                        opacity: 0.7,
                        colorRGB: star.colorRGB,
                        colorHex: star.colorHex,
                        decay: 0.04 // Fades away quickly for clean, quiet look
                    });
                    
                    // B. Spawn 8 to 15 Shard Fragment Sparks (Sparse, elegant, and clean!)
                    const numFragments = Math.floor(Math.random() * 8) + 8;
                    for (let f = 0; f < numFragments; f++) {
                        const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.0;
                        const speed = Math.random() * 4 + 2.0; // Soft drift speed
                        
                        fragments.push({
                            x: actualX,
                            y: actualY,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            radius: star.radius * (Math.random() * 0.4 + 0.3), // very tiny shards
                            opacity: 0.8,
                            colorRGB: star.colorRGB,
                            colorHex: star.colorHex,
                            decay: Math.random() * 0.02 + 0.015 // Dissipates quickly
                        });
                    }
                    
                    // Respawn a replacement star at bottom edge
                    stars[i] = createSingleStar(true);
                } else {
                    // Render normal drifting star
                    ctx.beginPath();
                    ctx.arc(actualX, actualY, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${star.colorRGB}, ${star.opacity})`;
                    ctx.fill();

                    // Glow pulsing
                    star.opacity += star.speed;
                    if (star.opacity > 0.6 || star.opacity < 0.1) {
                        star.speed = -star.speed;
                    }
                    
                    // Slow upward drift
                    star.y -= 0.06; // Elegant slow drift
                    if (star.y < -15) {
                        star.y = canvas.height + 15;
                        star.x = Math.random() * canvas.width;
                    }
                }
            }
            
            // 2. Render Exploding Fragment Sparks (with Minimal Glow!)
            ctx.save();
            for (let i = fragments.length - 1; i >= 0; i--) {
                const frag = fragments[i];
                
                // Physics velocity drift
                frag.x += frag.vx;
                frag.y += frag.vy;
                
                // Velocity drag
                frag.vx *= 0.94;
                frag.vy *= 0.94;
                
                // Age decay
                frag.opacity -= frag.decay;
                
                if (frag.opacity <= 0) {
                    fragments.splice(i, 1);
                } else {
                    // Soft glow effect
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = frag.colorHex;
                    
                    ctx.beginPath();
                    ctx.arc(frag.x, frag.y, frag.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${frag.colorRGB}, ${frag.opacity})`;
                    ctx.fill();
                }
            }
            ctx.restore();
            
            // 3. Render Shockwave Rings (with Minimal Glow!)
            ctx.save();
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const wave = shockwaves[i];
                
                // Expand wave
                wave.radius += 2.2;
                wave.opacity -= wave.decay;
                
                if (wave.opacity <= 0) {
                    shockwaves.splice(i, 1);
                } else {
                    // Subtle glowing shockwave ring
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = wave.colorHex;
                    
                    ctx.beginPath();
                    ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${wave.colorRGB}, ${wave.opacity})`;
                    ctx.lineWidth = 1.5; // Fine line
                    ctx.stroke();
                }
            }
            ctx.restore();

            // 4. Render Mouse Trail Sparks (Cursor follow particles)
            ctx.save();
            for (let i = trails.length - 1; i >= 0; i--) {
                const trail = trails[i];
                
                trail.x += trail.vx;
                trail.y += trail.vy;
                trail.opacity -= trail.decay;
                
                if (trail.opacity <= 0) {
                    trails.splice(i, 1);
                } else {
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = trail.colorHex;
                    
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, trail.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${trail.colorRGB}, ${trail.opacity})`;
                    ctx.fill();
                }
            }
            ctx.restore();
            
            requestAnimationFrame(animateStars);
        }

        // 3D Card Tilt Engine
        function handleTilt(e, el, maxRot = 8) {
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((centerY - y) / centerY) * maxRot;
            const rotateY = ((x - centerX) / centerX) * maxRot;
            
            el.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translate3d(0, -4px, 15px)`;
            el.style.transition = 'transform 0.08s ease';
        }

        function resetTilt(el) {
            el.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translate3d(0, 0, 0)`;

        // Update workflow stepper based on streamed logs and agents
        function updatePipelineStepFromLog(agent, msg) {
            const stepStrategist = document.getElementById('step-strategist');
            const stepPRD = document.getElementById('step-prd');
            const stepWireframe = document.getElementById('step-wireframe');
            const stepAudit = document.getElementById('step-audit');
            
            if (!stepStrategist || !stepPRD || !stepWireframe || !stepAudit) return;
            
            const lowercaseMsg = msg.toLowerCase();
            
            // Detect active stage based on agent and keywords
            if (agent === 'strategist' || agent === 'analyst') {
                currentActiveStep = 1;
            } else if (agent === 'architect') {
                if (lowercaseMsg.includes('wireframe') || lowercaseMsg.includes('와이어프레임') || lowercaseMsg.includes('개인화 시안') || lowercaseMsg.includes('3안')) {
                    currentActiveStep = 3;
                } else {
                    currentActiveStep = 2;
                }
            } else if (agent === 'reviewer') {
                currentActiveStep = 4;
            }
            
            // Helper to set element state
            const setStepState = (el, state) => {
                const statusEl = el.querySelector('.step-status');
                if (!statusEl) return;
                
                if (state === 'pending') {
                    el.classList.remove('active', 'completed');
                    statusEl.innerHTML = `<i class="fa-solid fa-circle"></i>`;
                } else if (state === 'active') {
                    el.classList.add('active');
                    el.classList.remove('completed');
                    statusEl.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin" style="color: var(--accent-text);"></i>`;
                } else if (state === 'complete') {
                    el.classList.add('completed');
                    el.classList.remove('active');
                    statusEl.innerHTML = `<i class="fa-solid fa-circle-check" style="color: var(--accent-green);"></i>`;
                }
            };
            
            // Apply states
            if (currentActiveStep === 1) {
                setStepState(stepStrategist, 'active');
                setStepState(stepPRD, 'pending');
                setStepState(stepWireframe, 'pending');
                setStepState(stepAudit, 'pending');
            } else if (currentActiveStep === 2) {
                setStepState(stepStrategist, 'complete');
                setStepState(stepPRD, 'active');
                setStepState(stepWireframe, 'pending');
                setStepState(stepAudit, 'pending');
            } else if (currentActiveStep === 3) {
                setStepState(stepStrategist, 'complete');
                setStepState(stepPRD, 'complete');
                setStepState(stepWireframe, 'active');
                setStepState(stepAudit, 'pending');
            } else if (currentActiveStep === 4) {
                setStepState(stepStrategist, 'complete');
                setStepState(stepPRD, 'complete');
                setStepState(stepWireframe, 'complete');
                setStepState(stepAudit, 'active');
            }
        }

                    <div class="document-wrapper markdown-body">
                        <div class="stage-methodology-header" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
                            <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; border-bottom: none; padding-bottom: 0;">
                                <span style="display: inline-block; width: 6px; height: 24px; background: var(--accent-neon); border-radius: 3px; flex-shrink: 0;"></span>

                            </h1>
                            <p style="font-size: 13px; color: var(--text-secondary); margin: 0; line-height: 1.6; font-weight: 500;">
                                ${descText}
                            </p>
